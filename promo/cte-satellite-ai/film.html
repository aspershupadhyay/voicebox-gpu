<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Barlow;src:url(fonts/barlow-cond.woff2) format("woff2");font-weight:700}
@font-face{font-family:Barlow;src:url(fonts/barlow-cond-500.woff2) format("woff2");font-weight:500}
@font-face{font-family:Plex;src:url(fonts/plex-mono.woff2) format("woff2")}
@font-face{font-family:Instr;src:url(fonts/instr-serif.woff2) format("woff2")}
@font-face{font-family:Instr;font-style:italic;src:url(fonts/instr-serif-i.woff2) format("woff2")}
@font-face{font-family:Caveat;src:url(fonts/caveat.woff2) format("woff2");font-weight:400 700}
@font-face{font-family:Jost;src:url(fonts/jost.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:"Courier Prime";src:url(fonts/courier-prime.woff2) format("woff2")}
@font-face{font-family:Geist;src:url(fonts/geist.woff2) format("woff2");font-weight:100 900}
html,body{margin:0;background:#1C2023;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Barlow,sans-serif;-webkit-font-smoothing:antialiased}
#cam{position:absolute;inset:0;transform-origin:540px 900px}
.a{position:absolute;box-sizing:border-box}
.c{left:0;width:1080px;text-align:center}
.w{display:inline-block;white-space:pre}
#cap{position:absolute;left:0;width:1080px;top:1470px;text-align:center;font-family:Barlow;font-weight:700;font-size:64px;letter-spacing:.01em;text-transform:uppercase}
#cap span.box{display:inline-block;background:rgba(20,23,25,.92);color:#E7E2D7;border-radius:10px;padding:8px 26px 12px;border:2px solid #3A4146}
svg{position:absolute;overflow:visible}
img{position:absolute;display:block}
</style></head>
<body><div id="stage"><div id="cam"></div><div id="cap"></div></div>
<script src="vo.js"></script>
<script src="cte.js"></script>
<script>
// ---------- the world: mission control (formats.md; not the paper desk of the last two). check_colors.py must pass ----------
const BG='#1C2023', BG2='#23282C', PANEL='#2B3135', LINE='#3A4146', GRID='#252A2E', AMB='#D9A13B', AMBD='#8E6B2C',
      CREAM='#ECE5D6', CREAM2='#D8CFBD', INKC='#24211D', TX='#E7E2D7', TX2='#9AA19F', RED='#D8463A', REDL='#E8705F', GRN='#86A77E';
// ---------- math ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const eo=x=>x<=0?0:x>=1?1:1-Math.pow(2,-10*x);
const ei=x=>x<=0?0:x>=1?1:x*x*x;
const eio=x=>x<=0?0:x>=1?1:x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{if(x<=0)return 0;if(x>=1)return 1;const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const seg=(t,t0,d,e=eo)=>e(clamp((t-t0)/d));
function hash(n){let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
// ---------- voice timing ----------
const LINES={};for(const l of VO.lines)LINES[l.id]=l;
const S=id=>LINES[id].start, E=id=>LINES[id].end;
function wt(id,i){const l=LINES[id];const w=l.words[Math.min(i,l.words.length-1)];return w?w.s:l.start;}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
function wordIdx(id,word,from=0){const l=LINES[id];let k=l.words.findIndex((w,i)=>i>=from&&norm(w.w)===word);if(k<0)k=l.words.findIndex((w,i)=>i>=from&&norm(w.w).startsWith(word));return k<0?0:k;}
const at=(id,word,from=0)=>wt(id,wordIdx(id,word,from));
// ---------- text motion ----------
function rise(t,t0,d=.26,dy=22){const p=seg(t,t0,d);return `opacity:${p.toFixed(3)};transform:translateY(${((1-p)*dy).toFixed(2)}px);filter:blur(${((1-p)*5).toFixed(2)}px)`;}
function fade(t,t0,d=.25){return `opacity:${seg(t,t0,d).toFixed(3)}`;}
function arrive(t,t0,d=.34,s0=.8){const p=clamp((t-t0)/d);const s=p<=0?s0:lerp(s0,1,back(p));return `opacity:${clamp(p*3).toFixed(3)};transform:scale(${s.toFixed(4)})`;}
function slam(t,t0,d=.22){const p=clamp((t-t0)/d);const s=lerp(1.5,1,eo(p));return `opacity:${clamp(p*4).toFixed(3)};transform:scale(${s.toFixed(4)})`;}
function ws(t,words,times,style=''){return words.map((w,i)=>`<span class="w" style="${rise(t,times[i]??times[times.length-1],.24,16)};${typeof style==='function'?style(i,w):style}">${w}${i<words.length-1?' ':''}</span>`).join('');}
function spoken(t,id,words,k=0,style=''){return ws(t,words,words.map((_,i)=>wt(id,k+i)-.06),style);}
function A(x,y,css,html){return `<div class="a" style="left:${x}px;top:${y}px;${css}">${html??''}</div>`;}
function C(y,css,html){return `<div class="a c" style="top:${y}px;${css}">${html??''}</div>`;}
function svgL(inner){return `<svg width="1080" height="1920" style="left:0;top:0">${inner}</svg>`;}
const MONO=`font-family:Plex;letter-spacing:.06em`;
// ---------- the console: grid, corner brackets, the HUD line, a mission clock ----------
function grid(){let p='';for(let x=60;x<1080;x+=60)p+=`M${x} 0V1920`;for(let y=60;y<1920;y+=60)p+=`M0 ${y}H1080`;
  return svgL(`<path d="${p}" stroke="${GRID}" stroke-width="1.5" fill="none"/>`);}
function brackets(col=LINE){const s=46,m=40,y0=120,y1=1500;
  return svgL(`<path d="M${m} ${y0+s}V${y0}H${m+s} M${1080-m-s} ${y0}H${1080-m}V${y0+s} M${m} ${y1-s}V${y1}H${m+s} M${1080-m-s} ${y1}H${1080-m}V${y1-s}" stroke="${col}" stroke-width="3" fill="none"/>`);}
function clock(t){const s=Math.max(0,t);const mm=Math.floor(s/60),ss=Math.floor(s%60),cs=Math.floor((s*100)%100);return `T+${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;}
function hud(t,label){return A(70,150,`${MONO};font-size:24px;color:${TX2};width:940px;display:flex;justify-content:space-between`,
  `<span><span style="color:${AMB}">AI, DECODED #1</span> / ${label}</span><span>${clock(t)}</span>`);}
function cred(t,t0,text){return A(70,190,`${MONO};font-size:18px;color:${TX2};opacity:${(.7*seg(t,t0,.3)).toFixed(2)};width:940px;text-align:right`,text);}  // minimal, the owner's ask
function con(t,label){return grid()+brackets()+hud(t,label);}
// ---------- the red grease pencil (on the console glass; every gesture draws on, a little wobbly) ----------
function wob(i,seed,amp){return amp*(Math.sin(i*.9+seed)*.6+Math.sin(i*2.3+seed*1.7)*.4);}
function penPath(pts,t,t0,d,w=8,col=RED){const p=eio(clamp((t-t0)/d));if(p<=0)return '';let L=0;for(let i=1;i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  return `<path d="M${pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L')}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${L.toFixed(0)}" stroke-dashoffset="${(L*(1-p)).toFixed(1)}" opacity=".95"/>`;}
function penUnder(x0,x1,y,t,t0,d=.3,w=9,seed=1){const n=24,pts=[];for(let i=0;i<=n;i++){const u=i/n;pts.push([lerp(x0,x1,u),y+wob(i,seed,3)+u*6-8*u*(1-u)]);}return penPath(pts,t,t0,d,w);}
function penRing(cx,cy,rx,ry,t,t0,d=.45,w=8,turns=1.2,seed=2){const pts=[],n=120,a0=-2.3;for(let i=0;i<=n;i++){const u=i/n,a=a0+u*Math.PI*2*turns;const r=1+.05*Math.sin(3*a+seed)+.03*Math.sin(5*a+seed*2)+.03*u;pts.push([cx+Math.cos(a)*rx*r,cy+Math.sin(a)*ry*r]);}return penPath(pts,t,t0,d,w);}
function penTick(x,y,s,t,t0,d=.2,w=10){return penPath([[x,y],[x+s*.35,y+s*.4],[x+s,y-s*.55]],t,t0,d,w);}
function penX(x,y,s,t,t0,w=9){return penPath([[x,y],[x+s,y+s]],t,t0,.1,w)+penPath([[x+s,y],[x,y+s]],t,t0+.08,.1,w);}
function note(x,y,t,t0,text,size=58,rot=-4){return A(x,y,`${rise(t,t0,.24,10)};font-family:Caveat;font-weight:700;font-size:${size}px;color:${RED};rotate:${rot}deg;white-space:nowrap`,text);}
function stamp(cx,cy,t,t0,text,rot=-8,size=64,col=RED){const p=clamp((t-t0)/.2);if(p<=0)return '';const s=lerp(1.7,1,eo(p));
  return A(cx,cy,`transform:translate(-50%,-50%) rotate(${rot}deg) scale(${s.toFixed(3)});opacity:${clamp(p*3).toFixed(2)};border:7px solid ${col};color:${col};border-radius:10px;padding:4px 22px 8px;font-family:Barlow;font-weight:700;font-size:${size}px;letter-spacing:.06em;white-space:nowrap;background:rgba(28,32,35,.25)`,text);}
// ---------- props (amber line art) ----------
function sat(x,y,s,t,o={}){const rot=o.rot??Math.sin(t*1.3)*4, col=o.col??AMB;
  return `<svg width="${s*2.6}" height="${s*1.3}" viewBox="-130 -65 260 130" style="left:${x-s*1.3}px;top:${y-s*.65}px;transform:rotate(${rot}deg)">
  <g fill="${PANEL}" stroke="${col}" stroke-width="3.5" stroke-linejoin="round">
  <rect x="-125" y="-26" width="78" height="52"/><path d="M-112 -26V26M-99 -26V26M-86 -26V26M-73 -26V26M-60 -26V26M-125 0H-47" fill="none" stroke-width="2"/>
  <rect x="47" y="-26" width="78" height="52"/><path d="M60 -26V26M73 -26V26M86 -26V26M99 -26V26M112 -26V26M47 0H125" fill="none" stroke-width="2"/>
  <path d="M-47 0H-30M30 0H47" fill="none"/><rect x="-30" y="-34" width="60" height="68" rx="4"/>
  <circle cx="0" cy="48" r="11"/><path d="M0 34V37" fill="none"/><circle cx="0" cy="48" r="4" fill="${col}" stroke="none"/></g></svg>`;}
function dish(x,y,s,col=AMB){return `<svg width="${s}" height="${s}" viewBox="0 0 100 100" style="left:${x-s/2}px;top:${y-s/2}px"><g fill="none" stroke="${col}" stroke-width="3.2" stroke-linecap="round">
  <path d="M18 40 Q50 78 82 40"/><path d="M18 40 L82 40" stroke-dasharray="3 5"/><path d="M50 60 L66 22"/><circle cx="66" cy="20" r="3"/><path d="M50 60 L50 88 M36 92 H64 M42 88 L50 74 L58 88"/></g></svg>`;}
function print(x,y,w,h,src,o={}){const rot=o.rot??0, b=o.b??12, op=o.op??1, fit=o.fit??'cover', pos=o.pos??'50% 50%';
  return `<div class="a" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${CREAM};padding:${b}px;box-shadow:0 18px 40px rgba(18,20,19,.55);transform:rotate(${rot}deg) ${o.tf||''};opacity:${op};${o.css||''}">
  <div style="position:relative;width:100%;height:100%;overflow:hidden;background:${BG2}"><img src="${src}" style="left:0;top:0;width:100%;height:100%;object-fit:${fit};object-position:${pos};${o.imcss||''}">${o.inner||''}</div></div>`;}
function slot(cx,y,w,state,t){const shut=state==='shut';const col=shut?RED:AMB;
  return A(cx-w/2,y,`width:${w}px;height:56px;border:3px solid ${col};border-radius:8px;background:${BG2};display:flex;align-items:center;justify-content:space-between;padding:0 22px;${MONO};font-size:24px;color:${col}`,
  `<span>DOWNLINK</span><span>${shut?'■ NOT SENT':'▶ SENDING'}</span>`);}
// ---------- the real media (credited, small) ----------
const GLOBE_N=90; function globeSrc(t,rate=15){const n=GLOBE_N*2-2;let k=Math.floor(Math.max(0,t)*rate)%n;if(k>=GLOBE_N)k=n-k;return `assets/globe/${String(k).padStart(3,'0')}.webp`;}
const REC_N=465; function recSrc(f){const i=clamp(Math.floor(f),0,REC_N-1)+1;return `assets/rec/${String(i).padStart(3,'0')}.jpg`;}
const tile=i=>`assets/real/tile${i}.jpg`;
const CLOUDY=[1,2,3,5,6,7];
// ---------- scenes ----------
const SC=[];
function scene(t0,draw,opt={}){SC.push({t0,bg:opt.bg||BG,draw,...opt});}

// 1 · the hook (the triple hook: the shutter fires on frame 1, the photo drops, the slot shuts: NOT SENT)
scene(0,(t)=>{
  let h=con(t,'ORBIT LOG');
  const gy=1010+Math.sin(t*.6)*4;
  h+=img(globeSrc(t,10),`left:-10px;top:${gy}px;width:1100px;height:1100px`);
  h+=sat(540,640+Math.sin(t*1.6)*6,120,t);
  const fl=1-seg(t,.02,.18);if(t<.25)h+=A(0,0,`width:1080px;height:1920px;background:${CREAM};opacity:${(fl*.55).toFixed(3)}`);
  // the photo it just took drops toward the downlink
  const nv=at('l01','never'), p=seg(t,.18,.55,eio);
  const px=lerp(540,540,p), py=lerp(700,1000,p), sc=lerp(.25,1,p);
  if(t>.18)h+=print(px-180,py,360,360,tile(1),{rot:lerp(-14,-4,p),tf:`scale(${sc.toFixed(3)})`});
  h+=stamp(540,py+180,t,nv,'NOT SENT',-10,70);
  h+=slot(540,1390,620,t>=nv?'shut':'open',t);
  h+=C(250,`font-family:Barlow;font-weight:500;font-size:66px;color:${TX};text-transform:uppercase;letter-spacing:.02em`,`<span style="${rise(t,-.2,.2,10)}" class="w">It decides what we</span>`);  // on screen from frame 1 (the triple hook)
  h+=C(320,`font-family:Instr;font-style:italic;font-size:170px;line-height:1;color:${CREAM}`,`<span style="${rise(t,nv-.08,.26,20)}" class="w">never see.</span>`);
  h+=svgL(penUnder(250,830,500,t,nv+.02,.3,10));
  h+=cred(t,.4,'IMAGERY: NASA VIIRS, 1 NOV 2026');
  return h;});

// 2 · two thirds of Earth is under cloud: the counter on the real globe, then our own screen: NASA Worldview, day by day
scene(S('l02'),(t)=>{const lt=t-S('l02'), tB=at('l02','earth')-.12;
  let h=con(t,'CLOUD COVER');
  const n=Math.round(67*eio(clamp((t-at('l02','two'))/.55)));
  if(t<tB){
    h+=img(globeSrc(t,18),`left:100px;top:420px;width:880px;height:880px;${arrive(t,S('l02'),.35,.9)}`);
    h+=C(250,`font-family:Barlow;font-weight:700;font-size:190px;line-height:1;color:${AMB};${fade(t,at('l02','two')-.1,.12)}`,`${n}%`);
    h+=cred(t,S('l02'),'IMAGERY: NASA VIIRS, 1 NOV 2026');
  } else {
    const f=(t-tB)*30*3.6;  // the days step by, ~3.6x
    h+=A(70,370,`width:940px;height:917px;border:3px solid ${LINE};border-radius:12px;overflow:hidden;background:${BG2};${arrive(t,tB,.22,.94)}`,
      img(recSrc(f),`left:0;top:0;width:940px;height:917px`)+A(16,16,`${MONO};font-size:20px;color:${AMB};background:rgba(28,32,35,.8);padding:4px 10px;border-radius:6px`,'● OUR SCREEN · NASA WORLDVIEW'));
    h+=A(70,250,`font-family:Barlow;font-weight:700;font-size:110px;line-height:1;color:${AMB}`,`${n}%`);
    h+=A(330,272,`${MONO};font-size:26px;line-height:1.35;color:${TX};${fade(t,tB,.2)}`,'OF EARTH UNDER CLOUD<br><span style="color:'+TX2+'">AT ANY MOMENT · NASA</span>');
  }
  return h;},{tr:'shutter',cap:'l02'});

// 3 · so most photos are just white: nine real tiles, six of them cloud
scene(S('l03'),(t)=>{const t0=S('l03'), tm=at('l03','most'), tw=at('l03','white');
  let h=con(t,'TODAY\'S PHOTOS');
  const X0=78,Y0=330,W=300,G=12;
  for(let i=0;i<9;i++){const r=Math.floor(i/3),c=i%3, x=X0+c*(W+G), y=Y0+r*(W+G), ti=t0+i*.035;
    const cl=CLOUDY.includes(i), k=CLOUDY.indexOf(i), tc=tm+.1+k*.07;
    let inner='';
    if(cl&&t>=tc)inner+=A(0,0,`inset:0;border:5px solid ${AMB};${fade(t,tc,.08)}`)+A(10,10,`${MONO};font-size:20px;color:${INKC};background:${AMB};padding:2px 8px;${fade(t,tc,.08)}`,'CLOUD');
    if(cl&&t>=tw)inner+=A(0,0,`inset:0;background:${CREAM};opacity:${(.72*seg(t,tw,.18)).toFixed(3)}`);
    if(!cl&&t>=tw)inner+=A(0,0,`inset:0;border:5px solid ${GRN};${fade(t,tw,.15)}`);
    h+=`<div class="a" style="left:${x}px;top:${y}px;width:${W}px;height:${W}px;overflow:hidden;${arrive(t,ti,.22,.7)}">${img(tile(i),'left:0;top:0;width:100%;height:100%')}${inner}</div>`;}
  h+=C(1290,`font-family:Barlow;font-weight:700;font-size:78px;color:${TX};text-transform:uppercase;${rise(t,tw,.22)}`,`6 of 9: <span style="font-family:Instr;font-style:italic;text-transform:none;font-weight:400;color:${CREAM}">just white</span>`);
  h+=cred(t,t0,'NASA VIIRS TILES, 1 NOV 2026');
  return h;},{cap:'l03'});

// 4 · a few minutes per pass: the satellite crosses the sky over a ground dish; only a couple of photos get home
scene(S('l04'),(t)=>{const t0=S('l04'), t1=E('l04')+.1, p=clamp((t-t0)/(t1-t0));
  let h=con(t,'GROUND PASS');
  const cx=540, cy=1500, R=980, a=lerp(-2.45,-.69,p), sx=cx+Math.cos(a)*R, sy=cy+Math.sin(a)*R;
  let arc='';for(let i=0;i<=60;i++){const u=lerp(-2.6,-.54,i/60);arc+=(i?'L':'M')+(cx+Math.cos(u)*R).toFixed(1)+' '+(cy+Math.sin(u)*R).toFixed(1);}
  const inWin=p>.32&&p<.68, w=clamp((p-.32)/.36);
  h+=svgL(`<path d="${arc}" stroke="${LINE}" stroke-width="3" stroke-dasharray="10 12" fill="none"/>`+(inWin?`<path d="M${sx} ${sy} L470 1160 L610 1160 Z" fill="${AMB}" opacity=".13"/>`:''));
  h+=sat(sx,sy,70,t,{rot:(a+Math.PI/2)*57.3*.4});
  h+=dish(540,1200,200,inWin?AMB:TX2);
  const secs=Math.round(480*(1-(inWin?w:p>=.68?1:0)));
  h+=C(260,`font-family:Barlow;font-weight:700;font-size:120px;line-height:1;color:${inWin?AMB:TX}`,`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`);
  h+=C(395,`${MONO};font-size:28px;color:${TX2}`,`CONTACT WINDOW · <span style="color:${TX}">A FEW MINUTES PER PASS</span>`);
  h+=A(190,470,`width:700px;height:14px;background:${PANEL};border-radius:7px;overflow:hidden`,A(0,0,`height:14px;width:${(700*(1-(inWin?w:p>=.68?1:0))).toFixed(0)}px;background:${AMB}`));
  // the queue of photos waiting to go home: two make it
  for(let i=0;i<7;i++){const sent=i<2&&p>.4+i*.12, q=sent?seg(t,t0+(.4+i*.12)*(t1-t0),.3):0;
    const x=lerp(110+i*34,520,q), y=lerp(1300-i*6,1180,q);
    h+=print(x,y,150,150,tile(i<2?[0,4][i]:CLOUDY[i-2]),{rot:-6+i*3,b:6,op:1-q*.9});}
  h+=A(110,1475,`${MONO};font-size:22px;color:${TX2}`,'QUEUE: 7 PHOTOS · SENT: '+(p>.64?2:p>.4?1:0));
  return h;},{tr:'whip',cap:'l04'});

// 5 · 2020: Europe tried something new (Φ-sat-1)
scene(S('l05'),(t)=>{const t0=S('l05'), ty=at('l05','twenty');
  let h=con(t,'ESA · 2020');
  h+=C(330,`font-family:Barlow;font-weight:700;font-size:380px;line-height:1;color:${CREAM};${slam(t,ty-.04)}`,'2020');
  h+=sat(540,960+Math.sin(t*1.8)*8,150,t,{rot:-8+Math.sin(t)*4});
  h+=C(1130,`${MONO};font-size:30px;color:${AMB};${fade(t,at('l05','europe'),.2)}`,'PHI-SAT-1 · ESA');
  h+=C(1180,`font-family:Instr;font-style:italic;font-size:84px;color:${TX}`,spoken(t,'l05',['tried','something','new.'],wordIdx('l05','tried')));
  return h;},{tr:'shutter'});

// 6 · a tiny AI chip on board, checking every photo for cloud before it's sent (the real board, ESA)
scene(S('l06'),(t)=>{const t0=S('l06'), tc=at('l06','chip'), tk=at('l06','checking');
  let h=con(t,'ON BOARD');
  h+=print(150,300,780,724,'assets/real/myriad.jpg',{rot:-2,css:arrive(t,t0,.3,.92)});
  h+=svgL(penRing(560,640,210,160,t,tc,.45,9));
  h+=note(760,380,t,tc+.3,'the AI',64,-6);
  // the scan line: photos pass under it and get a verdict
  const sy=1140;
  h+=A(70,sy-8,`width:940px;height:4px;background:${AMB};opacity:${(.85*seg(t,tk-.1,.15)).toFixed(2)}`);
