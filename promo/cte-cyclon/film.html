<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Jost;src:url(fonts/jost.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Serif;src:url(fonts/serif.woff2) format("woff2")}
@font-face{font-family:Serif;font-style:italic;src:url(fonts/serif-i.woff2) format("woff2")}
@font-face{font-family:"Courier Prime";src:url(fonts/courier-prime.woff2) format("woff2")}
@font-face{font-family:Caveat;src:url(fonts/caveat.woff2) format("woff2");font-weight:400 700}
@font-face{font-family:Geist;src:url(fonts/geist.woff2) format("woff2");font-weight:100 900}
html,body{margin:0;background:#1B1A18;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Jost,sans-serif;-webkit-font-smoothing:antialiased}
#cam{position:absolute;inset:0;transform-origin:540px 900px}
.a{position:absolute;box-sizing:border-box}
.c{left:0;width:1080px;text-align:center}
.serif{font-family:Serif;font-weight:400;letter-spacing:-0.01em}
.ty{font-family:"Courier Prime"}
.hand{font-family:Caveat;font-weight:600}
.ui{font-family:Geist}
.w{display:inline-block;white-space:pre}
#cap{position:absolute;left:0;width:1080px;top:1480px;text-align:center;font-family:Jost;font-weight:500;font-size:60px;letter-spacing:-0.01em}
#cap span.box{display:inline-block;background:rgba(27,26,24,.92);color:#EDEBE6;border-radius:18px;padding:12px 30px 16px}
svg{position:absolute;overflow:visible}
</style></head>
<body><div id="stage"><div id="cam"></div><div id="cap"></div></div>
<script src="vo.js"></script>
<script src="cte.js"></script>
<script>
// ---------- the brand palette (docs/BRAND.md); check_colors.py must stay clean ----------
const PAPER='#E7E5E1', PAPER2='#D9D6D0', SHEET='#F4F1EA', INK='#1B1A18', INK2='#2A2926', INKL='#3A3936', SOFT='#57554F',
      GRAPH='#A6A49F', RED='#D8463A', REDL='#E8705F', OK='#5E7D5B', ONINK='#EDEBE6', ONINK2='#9C9A94';
const BEAT=.5;
// ---------- math ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const eo=x=>x<=0?0:x>=1?1:1-Math.pow(2,-10*x);
const ei=x=>x<=0?0:x>=1?1:x*x*x;
const eio=x=>x<=0?0:x>=1?1:x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{if(x<=0)return 0;if(x>=1)return 1;const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const seg=(t,t0,d,e=eo)=>e(clamp((t-t0)/d));
function hash(n){let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
// ---------- voice timing ----------
const LINES={};for(const l of VO.lines)LINES[l.id]=l;
const S=id=>LINES[id].start, E=id=>LINES[id].end;
function wt(id,i){const l=LINES[id];const w=l.words[Math.min(i,l.words.length-1)];return w?w.s:l.start;}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
function wordIdx(id,word,from=0){const l=LINES[id];const k=l.words.findIndex((w,i)=>i>=from&&norm(w.w).startsWith(word));return k<0?0:k;}
const at=(id,word,from=0)=>wt(id,wordIdx(id,word,from));
function venv(t){for(const l of VO.lines){if(t>=l.start&&t<l.end&&l.env){return l.env[Math.min(l.env.length-1,Math.floor((t-l.start)*30))]||0;}}return 0;}
// ---------- text motion (the house rise: fade, 20 px, a little blur) ----------
function rise(t,t0,d=.34,dy=22){const p=seg(t,t0,d);return `opacity:${p.toFixed(3)};transform:translateY(${((1-p)*dy).toFixed(2)}px);filter:blur(${((1-p)*5).toFixed(2)}px)`;}
function fade(t,t0,d=.3){return `opacity:${seg(t,t0,d).toFixed(3)}`;}
// arrive with anticipation and settle (for objects, not text)
function arrive(t,t0,d=.42){const p=clamp((t-t0)/d);const s=p<=0?.82:lerp(.82,1,back(p));return `opacity:${clamp(p*3).toFixed(3)};transform:scale(${s.toFixed(4)})`;}
function ws(t,words,times,style=''){return words.map((w,i)=>`<span class="w" style="${rise(t,times[i]??times[times.length-1],.3,18)};${typeof style==='function'?style(i,w):style}">${w}${i<words.length-1?' ':''}</span>`).join('');}
function spoken(t,id,words,k=0,style=''){return ws(t,words,words.map((_,i)=>wt(id,k+i)-.06),style);}
function A(x,y,css,html){return `<div class="a" style="left:${x}px;top:${y}px;${css}">${html??''}</div>`;}
function C(y,css,html){return `<div class="a c" style="top:${y}px;${css}">${html??''}</div>`;}
function grain(dark){return `<svg width="1080" height="1920" style="left:0;top:0"><filter id="g${dark?1:0}"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="${dark?9:4}"/><feColorMatrix values="0 0 0 0 ${dark?.9:.25}  0 0 0 0 ${dark?.88:.24}  0 0 0 0 ${dark?.85:.22}  0 0 0 ${dark?.035:.07} 0"/></filter><rect width="1080" height="1920" filter="url(#g${dark?1:0})"/></svg>`;}
function slug(t,dark){return A(70,150,`font-family:'Courier Prime';font-size:26px;letter-spacing:.12em;color:${dark?ONINK2:SOFT};${fade(t,-1)}`,`cte <span style="color:${RED}">/</span> CYCLON, YC F26`);}
// ---------- the red pen (every gesture draws on, a little wobbly) ----------
function wob(i,seed,amp){return amp*(Math.sin(i*.9+seed)*.6+Math.sin(i*2.3+seed*1.7)*.4);}
function penPath(pts,t,t0,d,w=7,col=RED){const p=eio(clamp((t-t0)/d));if(p<=0)return '';let L=0;for(let i=1;i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  return `<path d="M${pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L')}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${L.toFixed(0)}" stroke-dashoffset="${(L*(1-p)).toFixed(1)}"/>`;}
function penUnder(x0,x1,y,t,t0,d=.35,w=8,seed=1){const n=24,pts=[];for(let i=0;i<=n;i++){const u=i/n;pts.push([lerp(x0,x1,u),y+wob(i,seed,3)+u*6-8*u*(1-u)]);}return penPath(pts,t,t0,d,w);}
function penStrike(x0,x1,y,t,t0,d=.25,w=8){const pts=[];for(let i=0;i<=16;i++){const u=i/16;pts.push([lerp(x0,x1,u),y+wob(i,4,2.5)-u*10]);}return penPath(pts,t,t0,d,w);}
function penRing(cx,cy,rx,ry,t,t0,d=.6,w=7,turns=1.25,seed=2){const pts=[],n=120,a0=-2.3;for(let i=0;i<=n;i++){const u=i/n,a=a0+u*Math.PI*2*turns;const r=1+.05*Math.sin(3*a+seed)+.03*Math.sin(5*a+seed*2)+.03*u;pts.push([cx+Math.cos(a)*rx*r,cy+Math.sin(a)*ry*r]);}return penPath(pts,t,t0,d,w);}
function penTick(x,y,s,t,t0,d=.22,w=8){return penPath([[x,y],[x+s*.35,y+s*.4],[x+s,y-s*.55]],t,t0,d,w);}
function penX(x,y,s,t,t0){return penPath([[x,y],[x+s,y+s]],t,t0,.12,7)+penPath([[x+s,y],[x,y+s]],t,t0+.1,.12,7);}
function penArrow(x0,y0,x1,y1,t,t0,d=.3,w=6){const pts=[];for(let i=0;i<=16;i++){const u=i/16;pts.push([lerp(x0,x1,u)+Math.sin(u*Math.PI)*24,lerp(y0,y1,u)]);}
  const ang=Math.atan2(y1-pts[14][1],x1-pts[14][0]);const h=22;const hd=[[x1-h*Math.cos(ang-.5),y1-h*Math.sin(ang-.5)],[x1,y1],[x1-h*Math.cos(ang+.5),y1-h*Math.sin(ang+.5)]];
  return penPath(pts,t,t0,d,w)+penPath(hd,t,t0+d*.9,.12,w);}
function mark(t,t0,inner,kind='ring',d=.5,col=RED,w=7,seed=3){const p=eio(clamp((t-t0)/d));
  let path='',box='left:-10%;top:-24%;width:120%;height:148%';
  if(kind==='ring'){const pts=[];for(let i=0;i<=90;i++){const u=i/90,a=-2.3+u*Math.PI*2*1.2;const r=1+.04*Math.sin(3*a+seed)+.03*u;pts.push([50+Math.cos(a)*46*r,50+Math.sin(a)*44*r]);}path='M'+pts.map(q=>q[0].toFixed(2)+' '+q[1].toFixed(2)).join(' L');}
  if(kind==='strike'){box='left:-4%;top:0;width:108%;height:100%';path='M0 58 C30 52, 60 56, 100 46';}
  if(kind==='under'){box='left:-3%;top:84%;width:106%;height:22%';path='M0 40 C30 60, 70 30, 100 55';}
  const svg=p>0?`<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;${box};overflow:visible;pointer-events:none"><path d="${path}" pathLength="1" fill="none" stroke="${col}" stroke-width="${w}" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 1" stroke-dashoffset="${(1-p).toFixed(4)}"/></svg>`:'';
  return `<span style="position:relative;display:inline-block">${inner}${svg}</span>`;}
function svgL(inner){return `<svg width="1080" height="1920" style="left:0;top:0">${inner}</svg>`;}
function note(x,y,t,t0,text,size=52,rot=-3){return A(x,y,`${rise(t,t0,.3,10)};font-family:Caveat;font-weight:600;font-size:${size}px;color:${RED};transform-origin:left;rotate:${rot}deg;white-space:nowrap`,text);}
// ---------- line-art props (ink drawings, not glossy mock-ups) ----------
const GL=['<circle cx="12" cy="12" r="5"/>','<rect x="7" y="7" width="10" height="10" rx="2"/>','<path d="M6 16 12 6l6 10z"/>','<path d="M6 12h12M12 6v12"/>','<path d="M5 9h14M5 15h10"/>','<circle cx="9" cy="12" r="3"/><circle cx="15" cy="12" r="3"/>','<path d="M4 17l5-6 4 4 7-8"/>','<path d="M12 4v16M4 12h16"/>'];
function appLA(i,size,col,sw=2.2,fill='none'){return `<div style="width:${size}px;height:${size}px;border-radius:${size*.27}px;border:${sw*1.4}px solid ${col};background:${fill};display:flex;align-items:center;justify-content:center;box-sizing:border-box"><svg viewBox="0 0 24 24" width="${size*.46}" height="${size*.46}" style="position:static;fill:none;stroke:${col};stroke-width:${sw};stroke-linecap:round;stroke-linejoin:round">${GL[i%GL.length]}</svg></div>`;}
function phoneLA(cx,top,w,col,inner,css=''){const h=w*2.05;return `<div class="a" style="left:${cx-w/2}px;top:${top}px;width:${w}px;height:${h}px;border:${w*.022}px solid ${col};border-radius:${w*.15}px;${css}">
  <div class="a" style="left:${w*.42}px;top:${w*.035}px;width:${w*.16}px;height:${w*.035}px;border-radius:9px;border:${w*.012}px solid ${col}"></div>${inner}</div>`;}
// the demo phone: an ink bezel and a lit paper screen (520 x 1066 design units, scaled)
function phone(cx,top,sc,inner,css=''){return `<div class="a" style="left:${cx-270}px;top:${top}px;width:540px;height:1100px;transform:scale(${sc});transform-origin:270px 0;${css}">
  <div class="a" style="inset:0;border-radius:80px;background:${INK2};border:2px solid #45433F"></div>
  <div class="a" style="left:14px;top:14px;width:512px;height:1072px;border-radius:68px;background:${SHEET};overflow:hidden">${inner}
   <div class="a" style="left:236px;top:22px;width:40px;height:12px;border-radius:6px;background:${INK2}"></div></div></div>`;}
function status(){return A(40,64,`font-family:Geist;font-size:22px;color:${SOFT};font-weight:600`,`1:41 PM <span style="font-weight:400;opacity:.7;margin-left:12px">Fri, Oct 23</span>`);}
const PH=[['#CDBFA8','#8E7C62'],['#B3BCBE','#66767B'],['#C2BEA4','#76735A'],['#CCB2A3','#84675A'],['#BEC3B7','#6F7A68'],['#D1C4B1','#9A8467']];
function photo(i,s){const [a,b]=PH[i%PH.length];const hy=.5+hash(i)*.2;return `<div style="width:${s}px;height:${s}px;border-radius:14px;overflow:hidden;position:relative;background:${a}">
  <div style="position:absolute;left:${s*(.55+hash(i+1)*.25)}px;top:${s*.18}px;width:${s*.2}px;height:${s*.2}px;border-radius:50%;background:${SHEET};opacity:.85"></div>
  <svg viewBox="0 0 100 100" width="${s}" height="${s}" style="left:0;top:0"><path d="M0 ${hy*100} Q30 ${hy*100-22} 55 ${hy*100-6} T100 ${hy*100-12} V100 H0z" fill="${b}"/><path d="M0 ${hy*100+16} Q40 ${hy*100+2} 100 ${hy*100+14} V100 H0z" fill="${INK2}" opacity=".35"/></svg></div>`;}
// ---------- scenes ----------
const SC=[];
function scene(t0,bg,draw,opt={}){SC.push({t0,bg,draw,...opt});}
const dark=bg=>bg===INK;

// 1 · the hook: "your iPhone has it backwards": the line-art phone turns upside down
scene(0,PAPER,(t)=>{
  let h=grain(0)+slug(t,0);
  h+=C(270,`font-size:64px;font-weight:500;color:${INK};letter-spacing:-0.02em`,ws(t,['A','Y','Combinator','startup','thinks'],[-1,-1,-1,-1,-1]));
  h+=C(360,`font-size:150px;line-height:1;font-weight:500;color:${INK};letter-spacing:-0.035em`,ws(t,['your','iPhone'],[-1,-1]));
  const bk=at('l01','backwards');
  h+=C(530,`font-size:132px;line-height:1;color:${INK}`,`<span class="serif" style="font-style:italic">${ws(t,['has','it','backwards.'],[at('l01','has')-.06,at('l01','it',5)-.06,bk-.06])}</span>`);
  h+=svgL(penUnder(330,750,526,t,.05,.5,9,3));
  // the phone: an ink drawing of an app grid that flips on "backwards" (anticipation, a turn, a settle)
  const pre=Math.sin(Math.PI*seg(t,bk-.18,.18,x=>x))*-8, turn=back(clamp((t-bk)/.6))*180;
  const sway=Math.sin(t*1.6)*1.5;
  let g='';for(let i=0;i<20;i++){const c=i%4,r=Math.floor(i/4);g+=A(34+c*86,90+r*92,`${fade(t,-1)}`,appLA(i,64,INK,2));}
  h+=`<div class="a" style="left:0;top:0;width:1080px;height:1920px;transform-origin:540px 1170px;transform:rotate(${(pre+turn+sway).toFixed(2)}deg)">${phoneLA(540,800,380,INK,g)}</div>`;
  return h;
});

// 2 · "for almost twenty years": a ruler of years; the count runs to ~20
scene(S('l02'),PAPER,(t)=>{
  const t0=S('l02');let h=grain(0)+slug(t,0);
  const p=seg(t,t0+.1,Math.max(1,at('l02','adapted')-t0),eio), yrs=Math.round(p*19);
  h+=C(330,`${rise(t,t0)};font-family:'Courier Prime';font-size:30px;letter-spacing:.2em;color:${SOFT}`,'FOR ALMOST');
  h+=C(390,`font-size:330px;line-height:1;font-weight:500;color:${INK};letter-spacing:-0.05em;font-variant-numeric:tabular-nums;${rise(t,t0)}`,`${yrs}<span style="font-size:120px;letter-spacing:-0.02em"> yrs</span>`);
  // the ruler
  const rx0=110,rx1=970,ry=930;let r='';
  for(let y=0;y<=19;y++){const x=lerp(rx0,rx1,y/19),on=y<=yrs;r+=`<line x1="${x}" y1="${ry}" x2="${x}" y2="${ry-(y%5===0?40:22)}" stroke="${on?INK:GRAPH}" stroke-width="3"/>`;}
  h+=svgL(`<line x1="${rx0}" y1="${ry}" x2="${lerp(rx0,rx1,p)}" y2="${ry}" stroke="${INK}" stroke-width="3"/><line x1="${lerp(rx0,rx1,p)}" y1="${ry}" x2="${rx1}" y2="${ry}" stroke="${GRAPH}" stroke-width="3"/>${r}`);
  h+=A(rx0-40,ry+20,`font-family:'Courier Prime';font-size:28px;color:${SOFT}`,'2007');h+=A(rx1-40,ry+20,`font-family:'Courier Prime';font-size:28px;color:${SOFT}`,'2026');
  // phones along the ruler, growing taller year by year
  [0,4,8,12,16,19].forEach((y,i)=>{if(y>yrs)return;const x=lerp(rx0,rx1,y/19);const w=46+i*4,hh=w*(1.7+i*.07);h+=A(x-w/2,ry-70-hh,`${arrive(t,t0+.1+i*.12,.35)};width:${w}px;height:${hh}px;border:3px solid ${INK};border-radius:${w*.18}px`);});
  const ad=at('l02','adapted');
  h+=C(1090,`font-size:96px;line-height:1.05;color:${INK}`,`<span class="serif">${spoken(t,'l02',["we've",'adapted'],wordIdx('l02','weve'),(i)=>i===1?'font-style:italic':'')}<br>${spoken(t,'l02',['to','our','phones.'],wordIdx('l02','to'))}</span>`);
  h+=svgL(penUnder(560,880,1196,t,ad+.15,.35,8,5));
  return h;
},{tr:'pull'});

// 3 · the pain, one action per beat (an ink scene: the mode changes)
scene(S('l03'),INK,(t)=>{
  const t0=S('l03');let h=grain(1);
  const W=['Tap.','Swipe.','Switch.','Copy.','Paste.','Repeat.'];const ts=W.map((_,i)=>wt('l03',i));
  let k=0;for(let i=0;i<6;i++)if(t>=ts[i]-.05)k=i;
  // the phone (paper line art on ink), with the finger doing the word
  let inner='';const w=420,hh=w*2.05;
  const lt=t-ts[k];
  if(k===0){const rp=seg(t,ts[0],.35);for(let i=0;i<12;i++)inner+=A(40+(i%3)*120,90+Math.floor(i/3)*120,'',appLA(i,80,ONINK2,2));inner+=A(170-60*rp,210-60*rp,`width:${80+120*rp}px;height:${80+120*rp}px;border-radius:50%;border:4px solid ${ONINK};opacity:${(1-rp).toFixed(2)}`)+A(180,220,'width:60px;height:60px;border-radius:50%;background:rgba(237,235,230,.85)');}
  if(k===1){const p=seg(t,ts[1],.3,eio);for(let i=0;i<12;i++)inner+=A(40+(i%3)*120-p*420,90+Math.floor(i/3)*120,'',appLA(i+3,80,ONINK2,2));for(let i=0;i<12;i++)inner+=A(40+(i%3)*120+(1-p)*420,90+Math.floor(i/3)*120,'',appLA(i+7,80,ONINK2,2));inner+=A(300-p*200,520,'width:60px;height:60px;border-radius:50%;background:rgba(237,235,230,.85)');}
  if(k===2){const p=seg(t,ts[2],.3,eo);for(let i=0;i<3;i++)inner+=A(70+i*40*p,180+i*150*p,`width:${260}px;height:${360}px;border-radius:30px;border:4px solid ${ONINK2};background:${INK};transform:scale(${(1-.08*i).toFixed(2)})`);}
  if(k===3){const p=seg(t,ts[3],.25);inner+=A(40,200,`width:300px;font-family:Geist;font-size:30px;line-height:1.5;color:${ONINK2}`,`Dinner at <span style="background:rgba(237,235,230,${(.35*p).toFixed(2)});color:${ONINK}">7:30 Saturday</span>, the place on 5th.`)+A(110,150,`${arrive(t,ts[3]+.05,.25)};background:${ONINK};color:${INK};font-family:Geist;font-size:24px;padding:8px 18px;border-radius:12px`,'Copy');}
  if(k===4){inner+=A(40,820,`width:300px;height:70px;border-radius:20px;border:3px solid ${ONINK2}`)+A(60,836,`${fade(t,ts[4]+.1,.15)};font-family:Geist;font-size:26px;color:${ONINK}`,'7:30 Saturday')+A(110,740,`${arrive(t,ts[4],.25)};background:${ONINK};color:${INK};font-family:Geist;font-size:24px;padding:8px 18px;border-radius:12px`,'Paste');}
  if(k===5){const sp=(t-ts[5]);for(let i=0;i<3;i++){const y=((i*300-sp*1600)%900+900)%900-60;inner+=A(40,y,`opacity:.6;filter:blur(${Math.min(6,sp*10).toFixed(1)}px)`,`<div style="display:flex;gap:30px">${appLA(i,80,ONINK2,2)}${appLA(i+2,80,ONINK2,2)}${appLA(i+4,80,ONINK2,2)}</div>`);}}
  const punch=1+.04*(1-seg(t,ts[k],.22));
  h+=`<div class="a" style="inset:0;transform-origin:540px 900px;transform:scale(${punch.toFixed(4)})">${phoneLA(540,520,w,ONINK2,`<div class="a" style="inset:0;overflow:hidden;border-radius:${w*.13}px">${inner}</div>`)}</div>`;
  // the word, big, on its beat; the previous words stack faintly above
  h+=C(250,`font-size:150px;font-weight:600;letter-spacing:-0.04em;color:${ONINK};line-height:1`,`<span style="display:inline-block;${rise(t,ts[k]-.04,.18,26)}">${W[k]}</span>`);
  h+=C(1420,`font-family:'Courier Prime';font-size:30px;letter-spacing:.14em;color:${ONINK2}`,W.slice(0,k+1).map((w,i)=>`<span style="color:${i===k?REDL:ONINK2}">${w.replace('.','').toUpperCase()}</span>`).join('  ·  '));
  return h;
},{tr:'whip',dir:-1});

// 4 · "Cyclon wants the phone to adapt to you": the grid melts into one line you talk to
scene(S('l04'),PAPER,(t)=>{
  const t0=S('l04');let h=grain(0)+slug(t,0);
  const nm=at('l04','cyclon'), ad=at('l04','adapt');

// ---------- captions (1-2 words, the current word in red) ----------
function caption(t){
  const sc=SC.filter(s=>s.t0<=t).pop();if(!sc||!sc.cap)return '';
  const l=LINES[sc.cap];if(!l||t<l.start-.05||t>l.end+.2)return '';if(sc.capEnd&&t>=sc.capEnd())return '';
  const W=l.words;let k=W.findIndex(w=>t<w.e+.04);if(k<0)k=W.length-1;
  const g=Math.floor(k/2)*2;const grp=W.slice(g,g+2);
  return `<span class="box">${grp.map((w,i)=>`<span style="color:${g+i===k?REDL:'#EDEBE6'}">${w.w}</span>`).join(' ')}</span>`;
}

    else if(tr==='fadeup') html=layer(prev,t,`opacity:${(1-p).toFixed(3)};transform:translateY(${(-40*p).toFixed(1)}px)`)+`<div class="a" style="inset:0;opacity:${p.toFixed(3)}">${layer(sc,t,'')}</div>`;
