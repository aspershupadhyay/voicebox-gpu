<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Jost;src:url(fonts/jost.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Serif;src:url(fonts/serif.woff2) format("woff2")}
@font-face{font-family:Serif;font-style:italic;src:url(fonts/serif-i.woff2) format("woff2")}
@font-face{font-family:"Courier Prime";src:url(fonts/courier-prime.woff2) format("woff2")}
@font-face{font-family:Caveat;src:url(fonts/caveat.woff2) format("woff2");font-weight:400 700}
@font-face{font-family:Geist;src:url(fonts/geist.woff2) format("woff2");font-weight:100 900}
html,body{margin:0;background:#1B1A18;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Jost,sans-serif;-webkit-font-smoothing:antialiased}
#cam{position:absolute;inset:0;transform-origin:540px 900px}
.a{position:absolute;box-sizing:border-box}
.c{left:0;width:1080px;text-align:center}
.serif{font-family:Serif;font-weight:400;letter-spacing:-0.01em}
.ty{font-family:"Courier Prime"}
.hand{font-family:Caveat;font-weight:600}
.ui{font-family:Geist}
.w{display:inline-block;white-space:pre}
#cap{position:absolute;left:0;width:1080px;top:1480px;text-align:center;font-family:Jost;font-weight:500;font-size:60px;letter-spacing:-0.01em}
#cap span.box{display:inline-block;background:rgba(27,26,24,.92);color:#EDEBE6;border-radius:18px;padding:12px 30px 16px}
svg{position:absolute;overflow:visible}
</style></head>
<body><div id="stage"><div id="cam"></div><div id="cap"></div></div>
<script src="vo.js"></script>
<script src="cte.js"></script>
<script>
// ---------- the brand palette (docs/BRAND.md); check_colors.py must stay clean ----------
const PAPER='#E7E5E1', PAPER2='#D9D6D0', SHEET='#F4F1EA', INK='#1B1A18', INK2='#2A2926', INKL='#3A3936', SOFT='#57554F',
      GRAPH='#A6A49F', RED='#D8463A', REDL='#E8705F', OK='#5E7D5B', ONINK='#EDEBE6', ONINK2='#9C9A94';
const BEAT=.5;
// ---------- math ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const eo=x=>x<=0?0:x>=1?1:1-Math.pow(2,-10*x);
const ei=x=>x<=0?0:x>=1?1:x*x*x;
const eio=x=>x<=0?0:x>=1?1:x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{if(x<=0)return 0;if(x>=1)return 1;const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const seg=(t,t0,d,e=eo)=>e(clamp((t-t0)/d));
function hash(n){let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
// ---------- voice timing ----------
const LINES={};for(const l of VO.lines)LINES[l.id]=l;
const S=id=>LINES[id].start, E=id=>LINES[id].end;
function wt(id,i){const l=LINES[id];const w=l.words[Math.min(i,l.words.length-1)];return w?w.s:l.start;}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
function wordIdx(id,word,from=0){const l=LINES[id];const k=l.words.findIndex((w,i)=>i>=from&&norm(w.w).startsWith(word));return k<0?0:k;}
const at=(id,word,from=0)=>wt(id,wordIdx(id,word,from));
function venv(t){for(const l of VO.lines){if(t>=l.start&&t<l.end&&l.env){return l.env[Math.min(l.env.length-1,Math.floor((t-l.start)*30))]||0;}}return 0;}
// ---------- text motion (the house rise: fade, 20 px, a little blur) ----------
function rise(t,t0,d=.34,dy=22){const p=seg(t,t0,d);return `opacity:${p.toFixed(3)};transform:translateY(${((1-p)*dy).toFixed(2)}px);filter:blur(${((1-p)*5).toFixed(2)}px)`;}
function fade(t,t0,d=.3){return `opacity:${seg(t,t0,d).toFixed(3)}`;}
// arrive with anticipation and settle (for objects, not text)
function arrive(t,t0,d=.42){const p=clamp((t-t0)/d);const s=p<=0?.82:lerp(.82,1,back(p));return `opacity:${clamp(p*3).toFixed(3)};transform:scale(${s.toFixed(4)})`;}
function ws(t,words,times,style=''){return words.map((w,i)=>`<span class="w" style="${rise(t,times[i]??times[times.length-1],.3,18)};${typeof style==='function'?style(i,w):style}">${w}${i<words.length-1?' ':''}</span>`).join('');}
function spoken(t,id,words,k=0,style=''){return ws(t,words,words.map((_,i)=>wt(id,k+i)-.06),style);}
function A(x,y,css,html){return `<div class="a" style="left:${x}px;top:${y}px;${css}">${html??''}</div>`;}
function C(y,css,html){return `<div class="a c" style="top:${y}px;${css}">${html??''}</div>`;}
function grain(dark){return `<svg width="1080" height="1920" style="left:0;top:0"><filter id="g${dark?1:0}"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="${dark?9:4}"/><feColorMatrix values="0 0 0 0 ${dark?.9:.25}  0 0 0 0 ${dark?.88:.24}  0 0 0 0 ${dark?.85:.22}  0 0 0 ${dark?.035:.07} 0"/></filter><rect width="1080" height="1920" filter="url(#g${dark?1:0})"/></svg>`;}
function slug(t,dark){return A(70,150,`font-family:'Courier Prime';font-size:26px;letter-spacing:.12em;color:${dark?ONINK2:SOFT};${fade(t,-1)}`,`cte <span style="color:${RED}">/</span> INSTAGRAM ON APPLE TV`);}
// ---------- the red pen (every gesture draws on, a little wobbly) ----------
function wob(i,seed,amp){return amp*(Math.sin(i*.9+seed)*.6+Math.sin(i*2.3+seed*1.7)*.4);}
function penPath(pts,t,t0,d,w=7,col=RED){const p=eio(clamp((t-t0)/d));if(p<=0)return '';let L=0;for(let i=1;i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  return `<path d="M${pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L')}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${L.toFixed(0)}" stroke-dashoffset="${(L*(1-p)).toFixed(1)}"/>`;}
function penUnder(x0,x1,y,t,t0,d=.35,w=8,seed=1){const n=24,pts=[];for(let i=0;i<=n;i++){const u=i/n;pts.push([lerp(x0,x1,u),y+wob(i,seed,3)+u*6-8*u*(1-u)]);}return penPath(pts,t,t0,d,w);}
function penStrike(x0,x1,y,t,t0,d=.25,w=8){const pts=[];for(let i=0;i<=16;i++){const u=i/16;pts.push([lerp(x0,x1,u),y+wob(i,4,2.5)-u*10]);}return penPath(pts,t,t0,d,w);}
function penRing(cx,cy,rx,ry,t,t0,d=.6,w=7,turns=1.25,seed=2){const pts=[],n=120,a0=-2.3;for(let i=0;i<=n;i++){const u=i/n,a=a0+u*Math.PI*2*turns;const r=1+.05*Math.sin(3*a+seed)+.03*Math.sin(5*a+seed*2)+.03*u;pts.push([cx+Math.cos(a)*rx*r,cy+Math.sin(a)*ry*r]);}return penPath(pts,t,t0,d,w);}
function penTick(x,y,s,t,t0,d=.22,w=8){return penPath([[x,y],[x+s*.35,y+s*.4],[x+s,y-s*.55]],t,t0,d,w);}
function penX(x,y,s,t,t0){return penPath([[x,y],[x+s,y+s]],t,t0,.12,7)+penPath([[x+s,y],[x,y+s]],t,t0+.1,.12,7);}
function penArrow(x0,y0,x1,y1,t,t0,d=.3,w=6){const pts=[];for(let i=0;i<=16;i++){const u=i/16;pts.push([lerp(x0,x1,u)+Math.sin(u*Math.PI)*24,lerp(y0,y1,u)]);}
  const ang=Math.atan2(y1-pts[14][1],x1-pts[14][0]);const h=22;const hd=[[x1-h*Math.cos(ang-.5),y1-h*Math.sin(ang-.5)],[x1,y1],[x1-h*Math.cos(ang+.5),y1-h*Math.sin(ang+.5)]];
  return penPath(pts,t,t0,d,w)+penPath(hd,t,t0+d*.9,.12,w);}
function mark(t,t0,inner,kind='ring',d=.5,col=RED,w=7,seed=3){const p=eio(clamp((t-t0)/d));
  let path='',box='left:-10%;top:-24%;width:120%;height:148%';
  if(kind==='ring'){const pts=[];for(let i=0;i<=90;i++){const u=i/90,a=-2.3+u*Math.PI*2*1.2;const r=1+.04*Math.sin(3*a+seed)+.03*u;pts.push([50+Math.cos(a)*46*r,50+Math.sin(a)*44*r]);}path='M'+pts.map(q=>q[0].toFixed(2)+' '+q[1].toFixed(2)).join(' L');}
  if(kind==='strike'){box='left:-4%;top:0;width:108%;height:100%';path='M0 58 C30 52, 60 56, 100 46';}
  if(kind==='under'){box='left:-3%;top:84%;width:106%;height:22%';path='M0 40 C30 60, 70 30, 100 55';}
  const svg=p>0?`<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;${box};overflow:visible;pointer-events:none"><path d="${path}" pathLength="1" fill="none" stroke="${col}" stroke-width="${w}" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 1" stroke-dashoffset="${(1-p).toFixed(4)}"/></svg>`:'';
  return `<span style="position:relative;display:inline-block">${inner}${svg}</span>`;}
function svgL(inner){return `<svg width="1080" height="1920" style="left:0;top:0">${inner}</svg>`;}
function note(x,y,t,t0,text,size=52,rot=-3){return A(x,y,`${rise(t,t0,.3,10)};font-family:Caveat;font-weight:600;font-size:${size}px;color:${RED};transform-origin:left;rotate:${rot}deg;white-space:nowrap`,text);}
// ---------- line-art props ----------
const GL=['<circle cx="12" cy="12" r="5"/>','<rect x="7" y="7" width="10" height="10" rx="2"/>','<path d="M6 16 12 6l6 10z"/>','<path d="M6 12h12M12 6v12"/>','<path d="M5 9h14M5 15h10"/>','<circle cx="9" cy="12" r="3"/><circle cx="15" cy="12" r="3"/>','<path d="M4 17l5-6 4 4 7-8"/>','<path d="M12 4v16M4 12h16"/>'];
function glyph(i,s,col,sw=2.2){return `<svg viewBox="0 0 24 24" width="${s}" height="${s}" style="position:static;fill:none;stroke:${col};stroke-width:${sw};stroke-linecap:round;stroke-linejoin:round">${GL[i%GL.length]}</svg>`;}
// a camera glyph (a rounded square, the lens, the flash): drawn line art, not anyone's logo
function camGlyph(s,col,sw=2){return `<svg viewBox="0 0 24 24" width="${s}" height="${s}" style="position:static;fill:none;stroke:${col};stroke-width:${sw};stroke-linecap:round;stroke-linejoin:round"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="16.9" cy="7.1" r=".6" fill="${col}"/></svg>`;}
// ---------- our Reel (Catch the Error: Cyclon), frames from Files -> Videos/Cyclon ----------
const REEL_N=420;
function reelSrc(lt){const i=Math.floor((((lt%14)+14)%14)*30)%REEL_N+1;return `assets/reel/${String(i).padStart(3,'0')}.jpg`;}
const TH=['t4','t9','t14','t20','t24','t33','t37','t44','t50','t56'];
const th=i=>`assets/thumb/${TH[i%TH.length]}.jpg`;
function img(src,css){return `<img src="${src}" style="position:absolute;display:block;${css}">`;}
// the Reel playing on the TV app (W x H screen): the vertical video in the middle over its own blurred frame, the
// creator and caption on the right, the actions, a progress line. side = 0..1 shows the TV-app chrome.
function playView(W,H,lt,side=1,prog0=.12){const k=H/520,vw=H*9/16,vx=(W-vw)/2,src=reelSrc(lt);
  let h=`<div class="a" style="inset:0;background:${INK}"></div>`;
  h+=img(src,`left:${-W*.1}px;top:${-H*.4}px;width:${W*1.2}px;height:${W*1.2*16/9}px;object-fit:cover;filter:blur(${28*k}px);opacity:${(.32*side).toFixed(3)}`);
  h+=img(src,`left:${vx}px;top:0;width:${vw}px;height:${H}px;object-fit:cover`);
  if(side>0){const o=`opacity:${side.toFixed(3)}`;const rx=vx+vw+26*k;
    h+=A(rx,H-150*k,`${o};width:${W-rx-20*k}px;font-family:Geist;color:${ONINK}`,`<div style="display:flex;align-items:center;gap:${10*k}px"><div style="width:${34*k}px;height:${34*k}px;border-radius:50%;background:${PAPER};color:${INK};font-family:Jost;font-weight:500;font-size:${15*k}px;display:flex;align-items:center;justify-content:center">cte</div><span style="font-size:${16*k}px;font-weight:600">catchtheerror</span></div><div style="font-size:${14*k}px;color:${ONINK2};margin-top:${10*k}px;line-height:1.35">Did the iPhone get it backwards?</div>`);
    const ic=['<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>','<path d="M5 18l1.3-3.6A7 7 0 1 1 9.5 18z"/>','<path d="M20 4 3 11l7 3 3 7z"/>'];
    ic.forEach((p,i)=>{h+=A(vx-60*k,H-170*k+i*52*k,`${o}`,`<svg viewBox="0 0 24 24" width="${30*k}" height="${30*k}" style="position:static;fill:none;stroke:${ONINK};stroke-width:1.8;stroke-linejoin:round">${p}</svg>`);});
    const pr=(prog0+lt/62.4)%1;h+=A(vx,H-5*k,`${o};width:${vw}px;height:${3*k}px;background:rgba(237,235,230,.25)`,`<div style="width:${(pr*100).toFixed(2)}%;height:100%;background:${ONINK}"></div>`);}
  return h;}
// the TV: an ink bezel, a thin stand; screen W x H centred on (cx, cy)
function tv(cx,cy,W,H,inner,o={}){const b=o.bezel??14,r=o.r??12,st=o.stand??1;
  let h=`<div class="a" style="left:${cx-W/2-b}px;top:${cy-H/2-b}px;width:${W+2*b}px;height:${H+2*b}px;border-radius:${r+b*.6}px;background:${INK2};border:2px solid #45433F;${o.css||''}">
   <div class="a" style="left:${b}px;top:${b}px;width:${W}px;height:${H}px;border-radius:${r}px;overflow:hidden;background:${INK}">${inner}</div></div>`;
  if(st>0)h=`<div class="a" style="left:${cx-60}px;top:${cy+H/2+b-4}px;width:120px;height:${44*st}px;border-left:4px solid ${INKL};border-right:4px solid ${INKL};opacity:${st}"></div>`+
     `<div class="a" style="left:${cx-210}px;top:${cy+H/2+b+40*st}px;width:420px;height:8px;border-radius:4px;background:${INKL};opacity:${st}"></div>`+h;
  return h;}
const TVX=540,TVY=1000,TVW=924,TVH=520;
// the remote: line art, the thumb's press is a ring on the clickpad
function remote(x,y,t,presses,col=INK,rot=10){let ring='';for(const p of presses){const q=seg(t,p,.35);if(t>=p&&q<1)ring+=`<circle cx="60" cy="70" r="${(20+30*q).toFixed(1)}" fill="none" stroke="${RED}" stroke-width="4" opacity="${(1-q).toFixed(2)}"/>`;}
  const dn=presses.some(p=>t>=p&&t<p+.12);
  return `<svg width="120" height="380" style="left:${x}px;top:${y}px;transform:rotate(${rot}deg)"><rect x="6" y="6" width="108" height="368" rx="46" fill="${dark(col)?PAPER:INK2}" stroke="${col}" stroke-width="4"/>
   <circle cx="60" cy="70" r="${dn?36:38}" fill="none" stroke="${dark(col)?INK:ONINK2}" stroke-width="3"/>${ring}
   ${[[34,150],[86,150],[34,206],[86,206]].map(([a,b])=>`<circle cx="${a}" cy="${b}" r="15" fill="none" stroke="${dark(col)?INK:ONINK2}" stroke-width="3"/>`).join('')}
   <rect x="44" y="250" width="32" height="90" rx="16" fill="none" stroke="${dark(col)?INK:ONINK2}" stroke-width="3"/></svg>`;}
// a focused tile (the TV's focus engine: it lifts, gets a light edge, a slow sheen and a little parallax)
function focus(on,t,t0){const p=on?seg(t,t0,.28,back):0;if(p<=0)return {css:'',sheen:''};
  const s=1+.13*p,tx=Math.sin(t*1.3)*2*p,ty=Math.cos(t*1.1)*1.5*p;
  const sx=((t-t0)*.55%1.6)-.3;
  return {css:`transform:translate(${tx.toFixed(2)}px,${(ty-6*p).toFixed(2)}px) scale(${s.toFixed(4)});box-shadow:0 ${(18*p).toFixed(1)}px ${(26*p).toFixed(1)}px rgba(14,13,12,.7),0 0 0 ${(3*p).toFixed(1)}px rgba(237,235,230,.9);z-index:5`,
    sheen:`<div class="a" style="left:${(sx*100).toFixed(1)}%;top:-20%;width:26%;height:140%;background:rgba(244,241,234,.16);transform:skewX(-18deg)"></div>`};}
// the TV's home screen: a top shelf for the focused app (our Reel), a row of apps with the new one in the middle
function tvHome(W,H,t,fon){let h=`<div class="a" style="inset:0;background:${INK}"></div>`;
  h+=`<div class="a" style="left:0;top:0;width:${W}px;height:260px;overflow:hidden;background:${INK2}">${img(reelSrc(t+4),`left:${W-200}px;top:20px;width:124px;height:220px;border-radius:8px;object-fit:cover`)}
    ${A(36,170,`font-family:Geist;color:${ONINK}`,`<div style="font-size:13px;letter-spacing:.14em;color:${ONINK2}">NEW ON YOUR TV</div><div style="font-size:30px;font-weight:600;margin-top:4px">Reels, on the big screen</div>`)}</div>`;
  const cols=[SOFT,OK,SHEET,INKL,GRAPH],x0=(W-(5*150+4*26))/2;
  cols.forEach((c,i)=>{const ig=i===2,f=focus(ig&&fon!=null,t,fon??0);
    h+=`<div class="a" style="left:${x0+i*176}px;top:300px;width:150px;height:90px;border-radius:14px;background:${c};overflow:hidden;display:flex;align-items:center;justify-content:center;${f.css}">${ig?camGlyph(54,INK,1.8):glyph(i+1,40,ig?INK:ONINK,2)}${f.sheen}</div>`;});
  h+=A(x0+2*176,400,`width:150px;text-align:center;font-family:Geist;font-size:15px;color:${ONINK};opacity:${fon!=null?seg(t,fon+.1,.2):0}`,'Instagram');
  for(let i=0;i<5;i++)h+=A(x0+i*176,440,`width:150px;height:90px;border-radius:14px;background:${INK2};opacity:.8`);
  return h;}
// the Instagram TV app: tabs, then rows (Reels, longer videos, live), focus moves with the voice
function tvApp(W,H,t,row,col,ft){let h=`<div class="a" style="inset:0;background:${INK}"></div>`;
  const tabs=['For you','Reels','Videos','Live','Following'],act=row<0?0:row+1;let tx='';
  tabs.forEach((x,i)=>{tx+=`<span style="padding:6px 16px;border-radius:999px;${i===act?`background:${SHEET};color:${INK}`:`color:${ONINK2}`}">${x}</span>`;});
  h+=A(0,16,`width:${W}px;display:flex;justify-content:center;gap:6px;font-family:Geist;font-size:15px;font-weight:500`,tx);
  h+=A(28,20,'',camGlyph(26,ONINK,1.8));
  const R=[{y:64,lab:'Reels for you',w:84,hh:150,n:8,dx:100},{y:262,lab:'Longer videos',w:166,hh:94,n:5,dx:182},{y:398,lab:'Live',w:166,hh:94,n:5,dx:182}];
  R.forEach((r,ri)=>{h+=A(30,r.y,`font-family:Geist;font-size:15px;font-weight:600;color:${ri===row?ONINK:ONINK2}`,r.lab);
    for(let i=0;i<r.n;i++){const on=ri===row&&i===col,f=focus(on,t,ft);
      h+=`<div class="a" style="left:${30+i*r.dx}px;top:${r.y+24}px;width:${r.w}px;height:${r.hh}px;border-radius:10px;overflow:hidden;background:${INK2};opacity:${row<0||ri===row?1:.55};${f.css}">${img(th(i*3+ri*2),`left:0;top:${r.hh>r.w?0:-r.w*.6}px;width:${r.w}px;height:${r.hh>r.w?r.hh:r.w*16/9}px;object-fit:cover`)}
        ${ri===2?`<span style="position:absolute;left:8px;top:8px;background:${RED};color:${SHEET};font-family:Geist;font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:5px">LIVE</span>`:''}${f.sheen}</div>`;}});
  return h;}
// a sofa, line art, seen from behind
function couch(cx,y,w,col,fill){const hh=w*.36;return `<svg width="${w}" height="${hh}" viewBox="0 0 100 36" style="left:${cx-w/2}px;top:${y}px" preserveAspectRatio="none">
  <path d="M6 10 Q6 4 12 4 H88 Q94 4 94 10 V26 H6 Z" fill="${fill}" stroke="${col}" stroke-width="1.1" vector-effect="non-scaling-stroke" style="stroke-width:5px"/>
  <path d="M2 14 Q2 10 6 10 Q10 10 10 14 V34 H2 Z M90 14 Q90 10 94 10 Q98 10 98 14 V34 H90 Z" fill="${fill}" stroke="${col}" style="stroke-width:5px" vector-effect="non-scaling-stroke"/>
  <path d="M10 26 H90 V34 H10 Z" fill="${fill}" stroke="${col}" style="stroke-width:5px" vector-effect="non-scaling-stroke"/><path d="M50 6 V26" stroke="${col}" style="stroke-width:4px" vector-effect="non-scaling-stroke"/></svg>`;}
function src(t,t0,text,dk){return C(1640,`${fade(t,t0,.3)};font-family:'Courier Prime';font-size:24px;color:${dk?ONINK2:SOFT};padding:0 90px;box-sizing:border-box`,text);}
// ---------- scenes ----------
const SC=[];
function scene(t0,bg,draw,opt={}){SC.push({t0,bg,draw,...opt});}
const dark=bg=>bg===INK;

// 1 · the hook: our Reel is playing on a phone; on "biggest screen" the phone grows into a TV

// ---------- captions (1-2 words, the current word in red) ----------
function caption(t){
  const sc=SC.filter(s=>s.t0<=t).pop();if(!sc||!sc.cap)return '';
  const l=LINES[sc.cap];if(!l||t<l.start-.05||t>l.end+.2)return '';if(sc.capEnd&&t>=sc.capEnd())return '';
  const W=l.words;let k=W.findIndex(w=>t<w.e+.04);if(k<0)k=W.length-1;
  const g=Math.floor(k/2)*2;const grp=W.slice(g,g+2);
  return `<span class="box">${grp.map((w,i)=>`<span style="color:${g+i===k?REDL:'#EDEBE6'}">${w.w}</span>`).join(' ')}</span>`;
}

// ---------- transitions (each motivated; 0.3 s) ----------
const TR=.3;
function layer(sc,t,css){return `<div class="a" style="inset:0;background:${sc.bg};${css}">${sc.draw(t)}</div>`;}
function penWipe(p){ // a broad red marker stroke sweeps up the frame: covers, then uncovers
  const a=p<.5?0:(p-.5)*2, b=p<.5?p*2:1;const y0=lerp(2200,-300,b), y1=lerp(2200,-300,a);
  return `<svg width="1080" height="1920" style="left:0;top:0"><path d="M-60 ${y0+120} C 300 ${y0-60}, 700 ${y0+80}, 1140 ${y0-120} L1140 ${y1-120} C 700 ${y1+80}, 300 ${y1-60}, -60 ${y1+120} Z" fill="${RED}"/></svg>`;}

  let i=0;while(i+1<SC.length&&SC[i+1].t0<=t)i++;
  const sc=SC[i], lt=t-sc.t0, t1=(SC[i+1]?.t0)??window.DURATION, prev=SC[i-1];
  stage.style.background=sc.bg;
  let s=1;if(!sc.still)s=1+(sc.punch?sc.punch-1:.025)*(1-eo(clamp(lt/.3)))+.025*clamp(lt/Math.max(1,t1-sc.t0));
  const tr=sc.tr||'cut';let html;
  if(prev&&lt<TR&&tr!=='cut'){
    const p=eio(lt/TR), d=sc.dir||1;
    if(tr==='whip') html=layer(prev,t,`transform:translateY(${(-d*1920*p).toFixed(1)}px);filter:blur(${(p*14).toFixed(1)}px)`)+layer(sc,t,`transform:translateY(${(d*1920*(1-p)).toFixed(1)}px);filter:blur(${((1-p)*14).toFixed(1)}px)`);
    else if(tr==='zoom') html=layer(sc,t,`transform:scale(${(.85+.15*p).toFixed(4)});opacity:${p.toFixed(3)}`)+layer(prev,t,`transform:scale(${(1+.6*p).toFixed(4)});opacity:${(1-p).toFixed(3)};filter:blur(${(p*12).toFixed(1)}px)`);
    else if(tr==='pull') html=layer(prev,t,`transform:scale(${(1-.25*p).toFixed(4)});opacity:${(1-p).toFixed(3)}`)+layer(sc,t,`transform:scale(${(1.25-.25*p).toFixed(4)});opacity:${p.toFixed(3)}`);
    else if(tr==='pen') html=(lt/TR<.5?layer(prev,t,''):layer(sc,t,''))+penWipe(lt/TR);
    else if(tr==='fadeup') html=layer(prev,t,`opacity:${(1-p).toFixed(3)};transform:translateY(${(-40*p).toFixed(1)}px)`)+`<div class="a" style="inset:0;opacity:${p.toFixed(3)}">${layer(sc,t,'')}</div>`;
  } else html=layer(sc,t,'');
  cam.style.transform=`scale(${s.toFixed(5)})`;
  cam.innerHTML=html;

};

  add(at('l07','couch')-.15,'simple-whoosh-382724',-14,{peak:true,at:at('l07','couch')+.05});add(at('l07','couch')+.2,'pop-402324',-10);add(at('l07','couch')+.12,'PEN',-14,{synth:'pen',len:.35});
  // 8 three strikes, the play button

  add(at('l08','watch')-.05,'pop-402324',-8);add(at('l08','watch')+.12,'PEN',-12,{synth:'pen',len:.35});

  // 11 the old app lands, switches off, the ring
