<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Serif;src:url(fonts/serif.woff2) format("woff2")}
@font-face{font-family:Serif;font-style:italic;src:url(fonts/serif-i.woff2) format("woff2")}
@font-face{font-family:Geist;src:url(fonts/geist.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Mono;src:url(fonts/mono.woff2) format("woff2");font-weight:100 900}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:Geist,sans-serif;-webkit-font-smoothing:antialiased;color:#fff}
#cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#over,#hud,#cap{position:absolute;inset:0;pointer-events:none}
.a{position:absolute;box-sizing:border-box}
.c{left:0;width:1920px;text-align:center}
.mono{font-family:Mono}
.w{display:inline-block;white-space:pre}
.card{border-radius:18px;border:1px solid #2A2A31;background:#16161A}
.pill{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:8px 18px;font-family:Mono;font-size:20px}
#cap .box{position:absolute;left:0;width:1920px;top:892px;text-align:center;font-family:Geist;font-weight:700;font-size:48px;letter-spacing:-0.01em}
#cap .box span.b{display:inline-block;background:rgba(10,10,12,.88);border-radius:16px;padding:8px 24px 12px}
svg{position:absolute;overflow:visible}
</style></head>
<body><div id="stage"><div id="cam"></div><div id="over"></div><div id="hud"></div><div id="cap"></div></div>
<script src="vo.js"></script>
<script src="blob.js"></script>
<script>
// ---------- palette: Reel's marigold is the accent (not Claude's clay), a dull blue the second voice ----------
const DK='#0C0C0E', DK2='#16161A', DKL='#2A2A31', IV='#EFEDE8', INK='#15151A', MID='#6D6A72', DMID='#9B98A3',
      AC='#E3BC5C', ACL='#F3DA94', SAND='#8FA8D8', MINT='#86C9A8', RED='#D2665A', TXT='#ECEAF2';
const W=1920, H=1080, CX=960;
// ---------- math ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const eo=x=>x<=0?0:x>=1?1:1-Math.pow(2,-10*x);
const sio=x=>x<=0?0:x>=1?1:-(Math.cos(Math.PI*x)-1)/2;
const back=x=>{x=clamp(x);const c=1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);}; // Cue's landing only
const seg=(t,t0,d,e=eo)=>e(clamp((t-t0)/d));
function hash(n){let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
// ---------- voice timing ----------
const LINES={};for(const l of VO.lines)LINES[l.id]=l;
const S=id=>LINES[id].start, E=id=>LINES[id].end;
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
function wt(id,i){const l=LINES[id];const w=l.words[Math.min(i,l.words.length-1)];return w?w.s:l.start;}
function wordIdx(id,word,from=0){const l=LINES[id];const k=l.words.findIndex((w,i)=>i>=from&&norm(w.w).startsWith(word));if(k<0)console.warn('no word',id,word);return k<0?0:k;}
const at=(id,word,from=0)=>wt(id,wordIdx(id,word,from));
function venv(t){for(const l of VO.lines){if(t>=l.start&&t<l.end)return l.env[Math.min(l.env.length-1,Math.floor((t-l.start)*30))]||0;}return 0;}
// ---------- text motion ----------
function rise(t,t0,d=.34,dy=22){const p=seg(t,t0,d);return `opacity:${p.toFixed(3)};transform:translateY(${((1-p)*dy).toFixed(1)}px)`;}
function wrise(t,t0){const p=seg(t,t0,.3);return `opacity:${p.toFixed(3)};transform:translateY(${((1-p)*20).toFixed(1)}px);filter:blur(${((1-p)*5).toFixed(2)}px)`;}
function ws(t,words,times,style=''){return words.map((w,i)=>`<span class="w" style="${wrise(t,times[i]??times[times.length-1])};${typeof style==='function'?style(i,w):style}">${w}${i<words.length-1?' ':''}</span>`).join('');}
function spoken(t,id,words,k=0,style=''){return ws(t,words,words.map((_,i)=>wt(id,k+i)-.05),style);}
function A(x,y,css,html){return `<div class="a" style="left:${x}px;top:${y}px;${css}">${html??''}</div>`;}
function C(y,css,html){return `<div class="a c" style="top:${y}px;${css}">${html??''}</div>`;}
function dotgrid(col,o=1){return `<div class="a" style="left:0;top:0;width:1920px;height:1080px;opacity:${o};background-image:radial-gradient(${col} 1.5px,transparent 1.5px);background-size:48px 48px;background-position:24px 24px"></div>`;}
const it=(s,c=AC)=>`<span style="font-family:Serif;font-style:italic;font-weight:400;color:${c}">${s}</span>`;
const ICON={check:'<path d="M20 6 9 17l-5-5"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
 send:'<path d="M5 12h14M13 6l6 6-6 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
 rew:'<path d="M11 6 3 12l8 6zM21 6l-8 6 8 6z"/>',play:'<path d="M7 4l13 8-13 8z"/>',down:'<path d="M12 4v14M6 12l6 6 6-6"/>'};
function icon(n,s,c,sw=2,fill='none'){return `<svg viewBox="0 0 24 24" width="${s}" height="${s}" style="position:static;fill:${fill};stroke:${c};stroke-width:${sw};stroke-linecap:round;stroke-linejoin:round;vertical-align:middle">${ICON[n]}</svg>`;}

// ---------- the story's clock ----------
const T_REW=at('l03','take')-.05, T_REW_END=S('l04')-.08;                // the rewind
const STRIP={sound:at('l04','sound'),motion:at('l06','motion'),timing:at('l08','timing'),plan:at('l10','plan'),style:at('l12','style')};
const T_VOID=S('l14')-.35;                                               // everything gone: black and silence
const T_REB=at('l18','start')-.04, T_HIT=at('l18','directing')-.04;     // the rebuild, the hit
const T_CTA=S('l19')-.2;
const LAYERS=['sound','motion','timing','plan','style','script'];
// how present each layer is (1 there, 0 stripped)
function pres(name,t){
  if(t>=T_REB){const k=['style','plan','timing','motion','sound','script'].indexOf(name);return name==='script'?1:seg(t,T_REB+k*.09,.18);}
  if(name==='script')return t<T_VOID?1:0;
  if(t>=T_VOID)return 0;
  return 1-seg(t,STRIP[name]-.05,.35);
}
// world time: forward from frame 0, scrubbed back to 0 in the rewind, paused while it's stripped, forward again after the rebuild
function tau(t){if(t<T_REW)return t;if(t<T_REW_END)return lerp(T_REW,0,sio(clamp((t-T_REW)/(T_REW_END-T_REW))));if(t<T_REB)return 0;return t-T_REB;}

// ---------- the world: one composite frame, six layers ----------
const REG={plan:[110,140,500,250],title:[680,150,1140,320],cue:[120,380,520,320],timing:[140,690,1640,80],sound:[140,780,1640,70],all:[0,0,1920,1080]};REG.motion=REG.title;REG.style=[560,240,800,520];
const L1=['Everything','you\'re','watching','was','made','by','Claude.'];
function world(t){
  const ta=tau(t), P={};LAYERS.forEach(n=>P[n]=pres(n,t));
  const ugly=P.style<.5;  // stripped style: default serif, pure primaries, white page
  const F=ugly?'font-family:"Times New Roman",Times,serif;font-weight:400;letter-spacing:0':'';
  const col=(a,b)=>ugly?b:a;
  let h=ugly?`<div class="a" style="left:0;top:0;width:1920px;height:1080px;background:#fff"></div>`:dotgrid('#1d1d22');
  const mo=P.motion, bob=(k,amp=6)=>mo*amp*Math.sin(ta*2.1+k*1.3);
  // the plan card
  if(P.plan>0){const p=P.plan;
    const rows=[['01','the hook','CAPTIONS'],['02','the rewind','FULL SCREEN'],['03','the reveal','HALF SCREEN']];
    h+=A(110,140+(1-p)*-30,`width:500px;opacity:${p};transform:rotate(${(1-p)*-6}deg) translateY(${bob(1,4)}px);${F}`,
      `<div style="background:${col(DK2,'#fff')};border:${ugly?'2px solid #000':'1px solid '+DKL};border-radius:${ugly?0:16}px;padding:20px 24px">
      <div class="mono" style="font-size:18px;color:${col(DMID,'#000')};letter-spacing:.12em;${F}">PLAN.md</div>
      ${rows.map(([n,l,tp],i)=>`<div style="display:flex;align-items:center;gap:14px;margin-top:14px;font-size:24px;color:${col(TXT,'#000')}"><span class="mono" style="font-size:16px;color:${col(DMID,'#000')}">${n}</span><span style="flex:1">${l}</span><span class="mono" style="font-size:15px;padding:5px 10px;border-radius:${ugly?0:6}px;background:${col(i===1?AC:'#26262d',['#FF0000','#00FF00','#0000FF'][i])};color:${col(i===1?'#141318':TXT,'#fff')}">${tp}</span></div>`).join('')}</div>`);}
  // the title: rises word by word while motion lives; frozen with keyframe diamonds when it's stripped
  const tw1=['Stop','prompting.'], tw2=['Start','directing.'];
  // on screen from frame 0; it only un-rises while the rewind runs it backwards
  const tr=(i)=>(t>=T_REW&&t<T_REW_END)?wrise(ta<2.5?ta:2.5,.15+i*.12):'opacity:1';
  h+=A(680,150+bob(2,5),`width:1140px;${F}`,`<div style="font-size:${ugly?84:92}px;font-weight:${ugly?400:700};letter-spacing:${ugly?0:-.035}em;line-height:1.05;color:${col(TXT,'#000')};${F}">${tw1.map((w,i)=>`<span class="w" style="${tr(i)}">${w} </span>`).join('')}</div>
    <div style="font-size:${ugly?92:132}px;line-height:1.05;${ugly?'color:#FF0000;'+F:'font-family:Serif;font-style:italic;color:'+AC}">${tw2.map((w,i)=>`<span class="w" style="${tr(i+2)}">${w} </span>`).join('')}</div>`);
  if(mo<1){const q=1-mo;  // what motion was: keyframes and dotted paths, frozen
    for(let i=0;i<4;i++){const x=690+i*240, y=i<2?178:300;h+=A(x,y,`opacity:${q*.9}`,`<div style="width:14px;height:14px;transform:rotate(45deg);background:${ugly?'#0000FF':SAND}"></div>`);}
    h+=`<svg class="a" style="left:0;top:0;opacity:${q}" width="1920" height="1080"><path d="M300 700 Q 360 600 380 520" stroke="${ugly?'#0000FF':SAND}" stroke-dasharray="6 8" stroke-width="3" fill="none"/></svg>`;}
  // the hook, said and shown: each line replaces the last, word by word on the voice
  if(P.script>0&&t<S('l04')){const id=t<S('l02')-.05?'l01':t<S('l03')-.05?'l02':'l03';const l=LINES[id];
    const tt=t>=T_REW?Math.max(lerp(T_REW,S('l03'),sio(clamp((t-T_REW)/(T_REW_END-T_REW)))),S('l03')-.01)+0*(t):t;
    const words=l.text.split(' ');
    h+=A(700,500,`width:1100px;font-size:62px;font-weight:700;letter-spacing:-.03em;line-height:1.1;color:${TXT};${F}`,spoken(t,id,words,0,(i,w)=>/Claude|code|purpose|apart/.test(w)?`font-family:Serif;font-weight:400;font-style:italic;color:${AC}`:''));}
  // Cue on the stage
  if(P.script>0){
    const talk=clamp(venv(t)*1.6), bl=(Math.floor((ta+.3)/3.1)!==Math.floor((ta+.18)/3.1));
    h+=A(150,560,`width:520px;height:130px;border-radius:50%;background:radial-gradient(ellipse at center, ${ugly?'#FFFF00':'rgba(227,188,92,.16)'} 0%, transparent 70%)`,'');
    h+=A(150,338+bob(3,8),``,blob({variant:'C',px:13,talk:mo?talk:0,blink:mo?bl:false,look:Math.sin(ta*.7),clap:mo*Math.max(0,Math.sin(ta*1.4))*.6,slate:['SCENE 01','TAKE '+(1+Math.floor(ta/4))]}));
  }
  // timing: the hook's own words at their own times
  if(P.timing>0){const p=P.timing, l=LINES['l01'];const x0=140,w=1640,span=l.end-l.start+.3;const X=tt=>x0+(tt-l.start+.15)/span*w;
    h+=A(x0,700,`width:${w}px;height:2px;background:${col(DKL,'#000')};opacity:${p}`,'');
    l.words.forEach((wd,i)=>{const on=ta>=wd.s-.04;h+=A(X(wd.s),710+(1-p)*40,`opacity:${p};${F}`,`<div style="border-left:2px solid ${col(i===6?AC:'#4a4855','#000')};padding-left:8px"><div style="font-size:24px;font-weight:600;color:${col(on?TXT:'#5a5862','#000')};${F}">${wd.w.replace(/[.,]/g,'')}</div><div class="mono" style="font-size:15px;color:${col(DMID,'#000')}">${wd.s.toFixed(2)}s</div></div>`);});
    if(mo>0)h+=A(X(clamp(ta,l.start,l.end)),690,`width:2px;height:80px;background:${AC};opacity:${p*mo}`,'');}
  // sound: a live waveform of the voice, with its cues
  if(P.sound>0){const p=P.sound;let b='';const N=150;for(let k=0;k<N;k++){const v=venv(t-(N-k)*.012)*p;b+=`<div style="width:5px;border-radius:2px;height:${(3+v*60).toFixed(1)}px;background:${k>N-6?AC:col('#8c8a96','#000')}"></div>`;}
    h+=A(140,785,`width:1640px;height:70px;display:flex;align-items:center;gap:6px;opacity:${p}`,b);
    [['whoosh',.18],['pop',.42],['hit',.66],['pop',.83]].forEach(([n,u],i)=>{h+=A(140+u*1640,768,`opacity:${p};${F}`,`<div class="mono" style="font-size:14px;color:${col(SAND,'#FF0000')};${F}">◆ ${n}</div>`);});}
  else{h+=A(140,820,`width:1640px;height:2px;background:${col('#3a3943','#000')}`,'');}
  return h;
}
// the layer stack at the bottom: what's left of the film
function stack(t){if(t>=T_VOID&&t<T_REB)return '';if(t>=T_CTA)return '';
  let s='';LAYERS.forEach((n,i)=>{const p=pres(n,t);s+=`<span class="pill" style="margin:0 6px;border:1px solid ${p>.5?AC:'#33323b'};color:${p>.5?TXT:'#5d5b66'};background:${p>.5?'rgba(227,188,92,.12)':'transparent'};${p>.5?'':'text-decoration:line-through'}">${n}</span>`;});
  return `<div class="a c" style="top:1012px">${s}</div>`;}
function hud(t){if(t>=T_VOID&&t<T_REB)return '';
  const ta=tau(t), f=Math.floor(ta*30), tc=`${String(Math.floor(ta/60)).padStart(2,'0')}:${String(Math.floor(ta)%60).padStart(2,'0')}:${String(f%30).padStart(2,'0')}`;
  const rew=t>=T_REW&&t<T_REW_END, paused=t>=T_REW_END&&t<T_REB;
  const ugly=pres('style',t)<.5&&t<T_REB;const c=ugly?'#000':DMID;
  let h=`<div class="a" style="left:72px;top:44px;font-family:Mono;font-size:20px;letter-spacing:.16em;color:${c}">DIRECTOR'S CUT</div>`;
  h+=`<div class="a" style="right:72px;top:40px;font-family:Mono;font-size:24px;letter-spacing:.08em;color:${rew?AC:c};display:flex;gap:14px;align-items:center">${rew?icon('rew',22,AC,0,AC):paused?'<span style="font-size:18px;letter-spacing:.16em">PAUSED</span>':icon('play',18,c,0,c)} ${tc}</div>`;
  return h+stack(t);}

// ---------- the explainers: each grows out of its layer (a match cut, not a slide) ----------
function panelBox(t,t0,t1,reg,html,light){
  const pin=seg(t,t0-.12,.34), pout=seg(t,t1-.1,.2);const p=pin*(1-pout);if(p<=0)return '';
  const [rx,ry,rw,rh]=REG[reg]; const ox=rx+rw/2, oy=ry+rh/2; const s=lerp(.35,1,pin)*(1-.05*pout);
  return `<div class="a" style="left:150px;top:130px;width:1620px;height:740px;opacity:${p.toFixed(3)};transform-origin:${ox-150}px ${oy-130}px;transform:scale(${s.toFixed(4)})">
    <div class="a" style="left:0;top:0;width:1620px;height:740px;border-radius:24px;background:${light?IV:DK2};border:1px solid ${light?'#d8d3c8':DKL};box-shadow:0 40px 80px rgba(0,0,0,.45)"></div>${html}</div>`;}
function P_sound(t){const id='l05', t0=S(id), wf=at(id,'fastest'), one=at(id,'one'), nv=at(id,'nothing');let h='';
  h+=A(60,46,`${rise(t,t0)};font-family:Mono;font-size:24px;letter-spacing:.12em;color:${DMID}`,'01 · PEAK ON THE FASTEST FRAME');
  const pts=[],env=[];for(let k=0;k<=60;k++){const u=k/60;pts.push(`${60+u*620},${470-Math.exp(-Math.pow((u-.5)/.16,2))*300}`);env.push(`${60+u*620},${470-Math.exp(-Math.pow((u-.5)/.11,2))*260}`);}
  h+=`<svg class="a" style="left:0;top:0" width="1620" height="740"><polyline points="${pts.join(' ')}" fill="none" stroke="${TXT}" stroke-width="4" stroke-dasharray="1600" stroke-dashoffset="${(1-seg(t,t0+.1,.7))*1600}"/>
    <polyline points="${env.join(' ')}" fill="none" stroke="${AC}" stroke-width="5" stroke-dasharray="1600" stroke-dashoffset="${(1-seg(t,wf-.35,.5))*1600}"/>
    <line x1="370" y1="140" x2="370" y2="500" stroke="${SAND}" stroke-width="3" stroke-dasharray="8 8" opacity="${seg(t,wf,.25)}"/></svg>`;
  h+=A(386,150,`${rise(t,wf)};font-family:Mono;font-size:20px;color:${SAND}`,'fastest frame');
  h+=A(60,520,`${rise(t,t0+.3)};font-family:Mono;font-size:18px;color:${DMID}`,`<span style="color:${TXT}">—</span> speed on screen &nbsp; <span style="color:${AC}">—</span> whoosh loudness`);
  h+=A(780,46,`${rise(t,one-.1)};font-family:Mono;font-size:24px;letter-spacing:.12em;color:${DMID}`,'02 · ONE BIG HIT');
  let bars='';[.2,.28,.16,.24,1,.2,.26].forEach((v,k)=>{bars+=`<div style="width:38px;border-radius:6px;background:${k===4?AC:'#34333c'};height:${(v*300*seg(t,one-.05+k*.03,.25)).toFixed(1)}px"></div>`;});
  h+=A(780,170,`width:380px;height:330px;display:flex;align-items:flex-end;gap:14px`,bars);
  h+=A(1230,46,`${rise(t,nv-.1)};font-family:Mono;font-size:24px;letter-spacing:.12em;color:${DMID}`,'03 · THE VOICE ON TOP');
  [['VOICE',300,TXT],['MUSIC',150,'#6E79A8'],['SFX',120,MINT]].forEach(([n,w,c],i)=>{h+=A(1230,170+i*90,`${rise(t,nv+i*.1)}`,`<div class="mono" style="font-size:18px;color:${DMID};margin-bottom:8px">${n}</div><div style="width:${w}px;height:26px;border-radius:6px;background:${c}"></div>`);});
  h+=A(1230,450,`${rise(t,nv+.4)};font-family:Mono;font-size:18px;color:${SAND}`,'SFX held ≥ 6 dB under the voice');
  h+=C(620-130,`width:1620px;font-size:46px;font-weight:700;letter-spacing:-.02em`,spoken(t,id,['Nothing','covers','the','voice.'],wordIdx(id,'nothing'),(i)=>i===3?`font-family:Serif;font-weight:400;font-style:italic;color:${AC}`:''));
  return h;}
function P_motion(t){const id='l07', t0=S(id), u=at(id,'under'), c=at(id,'cut');let h='';
  h+=C(110,`width:1620px;font-size:100px;font-weight:700;letter-spacing:-.035em`,spoken(t,id,['Words','rise','one','at','a','time.'],0,(i)=>i===1?`font-family:Serif;font-weight:400;font-style:italic;color:${AC}`:''));
  h+=C(270,`width:1620px;${rise(t,u-.1)}`,`<span class="pill" style="background:#1e1e24;border:1px solid ${DKL};color:${TXT}">${icon('clock',20,AC)} under 1.5 s · fade + 20 px + a little blur · no bounce</span>`);
  const p=seg(t,c-.1,1.0,sio);let r=`<div class="a" style="left:0;top:54px;width:${p*1320}px;height:2px;background:#4a4855"></div>`;
  for(let i=0;i<=6;i++){const x=i/6*1320, on=p*1320>=x-1;r+=`<div class="a" style="left:${x-1}px;top:18px;width:3px;height:72px;background:${on?AC:'#26252c'}"></div>`;if(i)r+=`<div class="a mono" style="left:${x-130}px;top:96px;width:120px;text-align:center;font-size:18px;color:${on?DMID:'transparent'}">2.0 s</div>`;}
  h+=A(150,400,`width:1320px;height:130px`,r);
  h+=C(590,`width:1620px;font-size:52px;font-weight:700;letter-spacing:-.03em;color:#cfcdd8`,spoken(t,id,['A','cut','every','two','seconds.'],wordIdx(id,'cut')-1));
  return h;}
function P_timing(t){const id='l09', l=LINES[id], t0=S(id);let h='';
  h+=A(60,46,`${rise(t,t0-.1)};font-family:Mono;font-size:20px;letter-spacing:.14em;color:${DMID}`,'THIS SENTENCE, TIMED BY WHISPER · word starts in seconds');
