<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Geist;src:url(fonts/geist.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Mono;src:url(fonts/mono.woff2) format("woff2")}
@font-face{font-family:Serif;font-style:italic;src:url(fonts/serif-i.woff2) format("woff2")}
body{margin:0;background:#0D0D0C;font-family:Geist;color:#ECE7DE;width:1920px;height:1080px;overflow:hidden}
h1{font-size:54px;letter-spacing:-.03em;margin:56px 80px 6px}
.sub{font-family:Mono;font-size:20px;color:#9A948B;margin:0 80px 30px;letter-spacing:.06em}
.row{display:flex;gap:30px;padding:0 80px}
.card{flex:1;min-width:0;overflow:hidden;background:#171615;border:1px solid #2A2826;border-radius:18px;padding:26px 28px;height:780px;box-sizing:border-box;position:relative}
.name{font-family:Mono;font-size:22px;letter-spacing:.14em}
.desc{font-size:24px;color:#bdb7ac;margin-top:8px;line-height:1.35}
.poses{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.pose{background:#0D0D0C;border-radius:12px;height:250px;display:flex;align-items:center;justify-content:center;position:relative}
.pose span{position:absolute;left:12px;top:10px;font-family:Mono;font-size:15px;color:#77716a}
.sw{display:flex;gap:8px;margin-top:18px}.sw i{width:40px;height:26px;border-radius:6px;display:block}
.pick{position:absolute;right:24px;top:24px;font-family:Mono;font-size:18px;padding:6px 14px;border-radius:999px}
</style></head><body>
<h1>Meet the director: three sketches</h1>
<div class="sub">PIXEL BLOB · DRAWN IN CODE, NOT AN IMAGE · BLINKS, TALKS TO THE VOICE, SQUASHES, CLAPS THE SLATE</div>
<div class="row" id="row"></div>
<script src="blob.js"></script>
<script>
const V=[['A','CUE','Periwinkle, beret, slate. The classic film director; the slate is our CTA prop (it can read SKILL.md).'],
 ['B','BOOM','Mint, headset, megaphone. A live-show floor director: loud energy, reads more "gaming".'],
 ['C','REEL','Marigold, backwards cap, finger viewfinder. The young creator framing the shot.']];
const row=document.getElementById('row');
V.forEach(([v,n,d])=>{const P=BLOB_PAL[v];
 const poses=[['idle',{}],['talking',{talk:.8,look:1}],['blink · arms up',{blink:true,raise:1}],['landing squash'+(v==='A'?' · clap':''),{squash:.8,clap:v==='A'?1:0,slate:['SKILL.md','TAKE: YOURS']}]];
 row.insertAdjacentHTML('beforeend',`<div class="card"><div class="name" style="color:${P.b}">${v} · ${n}</div>
 <div class="desc">${d}</div><div class="sw">${['o','d','b','l','w'].map(k=>`<i style="background:${P[k]}"></i>`).join('')}</div>
 ${v==='C'?`<div class="pick" style="background:${P.b};color:#141318">the owner's pick</div>`:''}
 <div class="poses">${poses.map(([l,o])=>`<div class="pose"><span>${l}</span>${blob({variant:v,px:6,...o})}</div>`).join('')}</div></div>`);});
</script></body></html>
