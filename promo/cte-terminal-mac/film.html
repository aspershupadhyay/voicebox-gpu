<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Geist;src:url(fonts/geist.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Serif;src:url(fonts/serif.woff2) format("woff2")}
@font-face{font-family:Serif;font-style:italic;src:url(fonts/serif-i.woff2) format("woff2")}
@font-face{font-family:Caveat;src:url(fonts/caveat.woff2) format("woff2");font-weight:400 700}
@font-face{font-family:Mono;src:url(fonts/mono.woff2) format("woff2");font-weight:100 900}
html,body{margin:0;background:#1A1917;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Geist,sans-serif;-webkit-font-smoothing:antialiased}
#cam{position:absolute;inset:0;transform-origin:540px 900px}
.a{position:absolute;box-sizing:border-box}
.c{left:0;width:1080px;text-align:center}
.serif{font-family:Serif;font-weight:400;letter-spacing:-0.01em}
.mono{font-family:Mono;font-variant-numeric:tabular-nums}
.w{display:inline-block;white-space:pre}
svg{position:absolute;overflow:visible}
img{position:absolute;display:block}
</style></head>
<body><div id="stage"><div id="cam"></div></div>
<script src="vo.js"></script>
<script src="cte.js"></script>
<script>
// Catch the Error: terminal-mac, a whole Mac inside a terminal, for your AI agent (github.com/govijr/terminal-mac).
// The world: the desktop. A warm sand desk surface where everything is a window: matte terminal windows, drawn
// screens with cursors (yours in ink, the agent's in red), and the real footage as rounded cards the camera moves
// inside. The red pen is still the one gesture of meaning. Real media: @kirtandopamine's two launch videos.
const DESK='#E0D9CC', DESK2='#C9C0AF', SURF='#E8E2D6', SURF2='#DCD4C5', INK='#1D1C1A', INK2='#2B2926', SOFT='#4C473F',
      WIN='#1A1917', BAR='#272521', HAIR='#3B3833', TXT='#EAE4D8', TXT2='#A9A295', RED='#D8463A', REDL='#E8705F',
      OK='#7FA886', SAND='#CDB98D', DOT1='#C8594C',
      REDT='#A8322A', DIM='#6A655B';   // REDT: red for words and pills on light (4.6:1 on the desk; the pen stroke stays RED); DIM: dots not reached yet (3:1 on the window)
// ---------- math ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const eo=x=>x<=0?0:x>=1?1:1-Math.pow(2,-10*x);
const eio=x=>x<=0?0:x>=1?1:x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{if(x<=0)return 0;if(x>=1)return 1;const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const seg=(t,t0,d,e=eo)=>e(clamp((t-t0)/d));
function hash(n){let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
// ---------- voice timing ----------
const LINES={};for(const l of VO.lines)LINES[l.id]=l;
const S=id=>LINES[id]?LINES[id].start:NaN, E=id=>LINES[id]?LINES[id].end:NaN;
function wt(id,i){const l=LINES[id];if(!l)return NaN;const w=l.words[Math.min(i,l.words.length-1)];return w?w.s:l.start;}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
function wordIdx(id,word,from=0){const l=LINES[id];if(!l)return 0;const k=l.words.findIndex((w,i)=>i>=from&&norm(w.w).startsWith(word));return k<0?0:k;}
const at=(id,word,from=0)=>wt(id,wordIdx(id,word,from));
// ---------- text motion (the house rise) ----------
function rise(t,t0,d=.34,dy=22){const p=seg(t,t0,d);return `opacity:${p.toFixed(3)};transform:translateY(${((1-p)*dy).toFixed(2)}px);filter:blur(${((1-p)*5).toFixed(2)}px)`;}
function fade(t,t0,d=.3){return `opacity:${seg(t,t0,d).toFixed(3)}`;}
function arrive(t,t0,d=.42){const p=clamp((t-t0)/d);const s=p<=0?.82:lerp(.82,1,back(p));return `opacity:${clamp(p*3).toFixed(3)};transform:scale(${s.toFixed(4)})`;}
function ws(t,words,times,style=''){return words.map((w,i)=>`<span class="w" style="${rise(t,times[i]??times[times.length-1],.3,18)};${style}">${w}${i<words.length-1?' ':''}</span>`).join('');}
function spoken(t,id,words,k=0,style=''){return ws(t,words,words.map((_,i)=>wt(id,k+i)-.06),style);}
function A(x,y,css,html){return `<div class="a" style="left:${x}px;top:${y}px;${css}">${html??''}</div>`;}
function C(y,css,html){return `<div class="a c" style="top:${y}px;${css}">${html??''}</div>`;}
function grain(dark){return `<svg width="1080" height="1920" style="left:0;top:0"><filter id="g${dark?1:0}"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="${dark?9:4}"/><feColorMatrix values="0 0 0 0 ${dark?.9:.25}  0 0 0 0 ${dark?.88:.24}  0 0 0 0 ${dark?.85:.22}  0 0 0 ${dark?.035:.07} 0"/></filter><rect width="1080" height="1920" filter="url(#g${dark?1:0})"/></svg>`;}
function slug(t,dark){return A(70,150,`font-family:Mono;font-size:24px;letter-spacing:.1em;color:${dark?TXT2:SOFT}`,`cte <span style="color:${dark?REDL:RED}">/</span> A MAC FOR YOUR AGENT`);}
function credit(t,t0,text,dark=0,y=1700){return A(70,y,`${fade(t,t0,.3)};font-family:Mono;font-size:22px;letter-spacing:.03em;color:${dark?TXT2:SOFT};width:940px;line-height:1.45`,text);}
function svgL(inner){return `<svg width="1080" height="1920" style="left:0;top:0">${inner}</svg>`;}
function note(x,y,t,t0,text,size=52,rot=-3,col=REDT){return A(x,y,`${rise(t,t0,.3,10)};font-family:Caveat;font-weight:600;font-size:${size}px;color:${col};transform-origin:left;rotate:${rot}deg;white-space:nowrap`,text);}
// ---------- the red pen ----------
function wob(i,seed,amp){return amp*(Math.sin(i*.9+seed)*.6+Math.sin(i*2.3+seed*1.7)*.4);}
function penPath(pts,t,t0,d,w=7,col=RED){const p=eio(clamp((t-t0)/d));if(p<=0)return '';let L=0;for(let i=1;i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  return `<path d="M${pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L')}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${L.toFixed(0)}" stroke-dashoffset="${(L*(1-p)).toFixed(1)}"/>`;}
function penUnder(x0,x1,y,t,t0,d=.35,w=8,seed=1,col=RED){const n=24,pts=[];for(let i=0;i<=n;i++){const u=i/n;pts.push([lerp(x0,x1,u),y+wob(i,seed,3)+u*6-8*u*(1-u)]);}return penPath(pts,t,t0,d,w,col);}
function penStrike(x0,x1,y,t,t0,d=.25,w=8,col=RED){const pts=[];for(let i=0;i<=16;i++){const u=i/16;pts.push([lerp(x0,x1,u),y+wob(i,4,2.5)-u*10]);}return penPath(pts,t,t0,d,w,col);}
function penRing(cx,cy,rx,ry,t,t0,d=.6,w=7,turns=1.25,seed=2,col=RED){const pts=[],n=120,a0=-2.3;for(let i=0;i<=n;i++){const u=i/n,a=a0+u*Math.PI*2*turns;const r=1+.05*Math.sin(3*a+seed)+.03*Math.sin(5*a+seed*2)+.03*u;pts.push([cx+Math.cos(a)*rx*r,cy+Math.sin(a)*ry*r]);}return penPath(pts,t,t0,d,w,col);}
function penTick(x,y,s,t,t0,d=.22,w=8,col=RED){return penPath([[x,y],[x+s*.35,y+s*.4],[x+s,y-s*.55]],t,t0,d,w,col);}
function penX(x,y,s,t,t0,w=7,col=RED){return penPath([[x,y],[x+s,y+s]],t,t0,.12,w,col)+penPath([[x+s,y],[x,y+s]],t,t0+.1,.12,w,col);}
function penArrow(x0,y0,x1,y1,t,t0,d=.3,w=6,bend=24,col=RED){const pts=[];for(let i=0;i<=16;i++){const u=i/16;pts.push([lerp(x0,x1,u)+Math.sin(u*Math.PI)*bend,lerp(y0,y1,u)]);}
  const ang=Math.atan2(y1-pts[14][1],x1-pts[14][0]);const h=22;const hd=[[x1-h*Math.cos(ang-.5),y1-h*Math.sin(ang-.5)],[x1,y1],[x1-h*Math.cos(ang+.5),y1-h*Math.sin(ang+.5)]];
  return penPath(pts,t,t0,d,w,col)+penPath(hd,t,t0+d*.9,.12,w,col);}
// an inline mark on a word (ring / strike / under), drawn in the word's own box
function mark(t,t0,inner,kind='ring',d=.5,col=RED,w=7,seed=3){const p=eio(clamp((t-t0)/d));
  let path='',box='left:-10%;top:-24%;width:120%;height:148%';
  if(kind==='ring'){const pts=[];for(let i=0;i<=90;i++){const u=i/90,a=-2.3+u*Math.PI*2*1.2;const r=1+.04*Math.sin(3*a+seed)+.03*u;pts.push([50+Math.cos(a)*46*r,50+Math.sin(a)*44*r]);}path='M'+pts.map(q=>q[0].toFixed(2)+' '+q[1].toFixed(2)).join(' L');}
  if(kind==='strike'){box='left:-4%;top:0;width:108%;height:100%';path='M0 58 C30 52, 60 56, 100 46';}
  if(kind==='under'){box='left:-3%;top:84%;width:106%;height:22%';path='M0 40 C30 60, 70 30, 100 55';}
  const svg=p>0?`<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;${box};overflow:visible;pointer-events:none"><path d="${path}" pathLength="1" fill="none" stroke="${col}" stroke-width="${w}" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 1" stroke-dashoffset="${(1-p).toFixed(4)}"/></svg>`:'';
  return `<span style="position:relative;display:inline-block">${inner}${svg}</span>`;}
// the top caption: the phrase being spoken rises word by word on its spoken times; idea words are the serif italic
// in red; marks: {index: [kind, time]} lets the pen strike, ring or underline a word as it's said
function topcap(t,id,groups,o={}){const l=LINES[id];if(!l)return '';const {y=250,size=78,emph=[],col=INK,ecol=REDT,lh=1.08,w=960,marks={}}=o;
  let g=0;groups.forEach(([a],i)=>{if(t>=wt(id,a)-.12)g=i;});const [a,b]=groups[g];
  const words=l.words.slice(a,b+1).map((x,i)=>{const k=a+i;const e=emph.includes(k);let inner=x.w;
    if(marks[k])inner=mark(t,marks[k][1],inner,marks[k][0],marks[k][2]||.35,ecol,7,k);
    return `<span class="w${e?' serif':''}" style="${rise(t,wt(id,k)-.06,.3,18)};${e?`font-style:italic;color:${ecol};font-size:1.12em`:''}">${inner}${k<b?' ':''}</span>`;}).join('');
  return A((1080-w)/2,y,`width:${w}px;text-align:center;font-size:${size}px;line-height:${lh};font-weight:600;color:${col};letter-spacing:-0.035em`,words);}
// ---------- the desktop world ----------
// a cursor: yours in ink, the agent's in red (an arrow with a light rim so it reads on any surface)
function cursor(x,y,col=INK,s=1,op=1){return `<svg width="${40*s}" height="${52*s}" viewBox="-3 -3 40 52" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;opacity:${op};overflow:visible"><path d="M0 0 L0 36 L9.5 27.5 L16 42 L22.5 39 L16 25 L28 25 Z" fill="${col}" stroke="${TXT}" stroke-width="3" stroke-linejoin="round"/></svg>`;}
// a matte terminal window: title bar with three dull dots, a mono title, content inside
function win(x,y,w,h,inner,o={}){const {title='',css='',r=22,bar=50}=o;
  return `<div class="a" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${r}px;background:${WIN};box-shadow:0 40px 70px -36px rgba(29,28,26,.75),0 0 0 1.5px ${HAIR};overflow:hidden;${css}">
    <div style="position:absolute;left:0;top:0;width:${w}px;height:${bar}px;background:${BAR}"></div>
    ${[DOT1,SAND,OK].map((c,i)=>`<div style="position:absolute;left:${22+i*24}px;top:${bar/2-7}px;width:14px;height:14px;border-radius:7px;background:${c}"></div>`).join('')}
    <div class="mono" style="position:absolute;left:0;width:${w}px;top:${bar/2-13}px;text-align:center;font-size:20px;color:${TXT2}">${title}</div>
    <div style="position:absolute;left:0;top:${bar}px;width:${w}px;height:${h-bar}px">${inner}</div></div>`;}
// a drawn screen (a generic display on a stand): the surface, a thin menu strip, whatever's inside
function screen(x,y,w,h,inner,o={}){const {surf=SURF,label='',lcol=SOFT,css='',border=''}=o;
  return `<div class="a" style="left:${x}px;top:${y}px;width:${w}px;height:${h+70}px;${css}">
    <div style="position:absolute;left:${w/2-60}px;top:${h}px;width:120px;height:46px;background:${DESK2};clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)"></div>
    <div style="position:absolute;left:${w/2-110}px;top:${h+42}px;width:220px;height:10px;border-radius:5px;background:${DESK2}"></div>
    <div style="position:absolute;left:0;top:0;width:${w}px;height:${h}px;border-radius:22px;background:${WIN};box-shadow:0 34px 60px -32px rgba(29,28,26,.7)"></div>
    <div style="position:absolute;left:12px;top:12px;width:${w-24}px;height:${h-24}px;border-radius:12px;background:${surf};overflow:hidden;${border}">
      <div style="position:absolute;left:0;top:0;width:100%;height:22px;background:${SURF2}"></div>${inner}</div>
    ${label?`<div class="mono" style="position:absolute;left:0;width:${w}px;top:${h+64}px;text-align:center;font-size:24px;letter-spacing:.12em;color:${lcol}">${label}</div>`:''}</div>`;}
// real footage / a screenshot as a rounded card; the view zooms and pans inside it (image point cx,cy at the card's
// centre at z screen px per image px); marks are SVG in the image's own pixels
function shot(o){const {x,y,w,h,src,iw,ih,cx=iw/2,cy=ih/2,z=w/iw,op=1,rp=1,marks='',r=30}=o;
  const ix=w/2-cx*z, iy=h/2-cy*z;
  return `<div class="a" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${r}px;overflow:hidden;opacity:${op.toFixed(3)};transform:translateY(${((1-rp)*110).toFixed(1)}px) scale(${lerp(.92,1,rp).toFixed(4)});box-shadow:0 44px 70px -34px rgba(29,28,26,.7),0 0 0 2px rgba(29,28,26,.14);background:${WIN}">
    <div style="position:absolute;left:${ix.toFixed(1)}px;top:${iy.toFixed(1)}px;width:${iw}px;height:${ih}px;transform-origin:0 0;transform:scale(${z.toFixed(4)})">
    <img src="${src}" style="left:0;top:0;width:${iw}px;height:${ih}px"><svg width="${iw}" height="${ih}" style="left:0;top:0">${marks}</svg></div></div>`;}
// a frame of the real footage (assets/clips/<dir>/NNN.jpg, 30 fps): the clip plays from t0, holds its last frame
const CLIP={a:141,b:30,c:204};
function frame(dir,t,t0){const k=clamp(Math.floor((t-t0)*30)+1,1,CLIP[dir]);return `assets/clips/${dir}/${String(k).padStart(3,'0')}.jpg`;}
const FW=1280, FH=819;
// a pill / chip
function chip(text,o={}){const {fg=INK,bg='transparent',bd=INK,size=30,pad='10px 26px',css=''}=o;return `<span style="display:inline-block;font-family:Mono;font-size:${size}px;color:${fg};background:${bg};border:3px solid ${bd};border-radius:60px;padding:${pad};white-space:nowrap;${css}">${text}</span>`;}
// the Droste: the real "Mac in a terminal" frame, with the same frame inside its own desktop, and again, and again
const DR={x0:89,y0:95,x1:1177,y1:774};   // the guest desktop inside a clip-a frame (1280 × 819)
function droste(w,depth=5,src='assets/clips/a/141.jpg',agent=-1){const h=w*FH/FW;let s='';
  const k=.46, dw=(DR.x1-DR.x0), dh=(DR.y1-DR.y0);
  function lvl(i,W){if(i>=depth)return '';const H=W*FH/FW, sc=W/FW;const iw=dw*sc*k, ih=iw*FH/FW;const ix=(DR.x0+dw*.5)*sc-iw/2, iy=(DR.y0+dh*.47)*sc-ih/2;
    return `<div style="position:absolute;left:0;top:0;width:${W.toFixed(1)}px;height:${H.toFixed(1)}px;border-radius:${Math.max(3,W*.02).toFixed(1)}px;overflow:hidden;box-shadow:0 ${(W*.03).toFixed(1)}px ${(W*.05).toFixed(1)}px -${(W*.02).toFixed(1)}px rgba(29,28,26,.8)"><img src="${src}" style="left:0;top:0;width:${W.toFixed(1)}px;height:${H.toFixed(1)}px">
      <div style="position:absolute;left:${ix.toFixed(1)}px;top:${iy.toFixed(1)}px;width:${iw.toFixed(1)}px;height:${ih.toFixed(1)}px">${lvl(i+1,iw)}</div></div>`;}
  return lvl(0,w);}
// ---------- scenes ----------
const SC=[];
function scene(t0,bg,draw,opt={}){if(isFinite(t0))SC.push({t0,bg,draw,...opt});}
const A0=at('l01','mac')-1.2-.03;   // clip a: macOS boots inside the terminal on "Mac"

// 1 · the hook: the real footage is already playing (terminal-mac typed); the headline is on screen from frame 1;
// on "Mac" macOS boots inside the terminal and the pen rings the word; "terminal" underlined
scene(0,DESK,(t)=>{
  let h=grain(0)+slug(t,0);
  const mac=at('l01','mac'), te=at('l01','terminal');
  const hp=seg(t,-.2,.3);
  h+=C(200,`opacity:${hp};font-size:74px;line-height:1.04;font-weight:600;color:${INK};letter-spacing:-0.04em`,`Someone just put`);
  h+=C(292,`opacity:${hp};font-size:128px;line-height:1.04;font-weight:600;color:${INK};letter-spacing:-0.045em`,`a whole ${mark(t,mac+.05,`<span class="serif" style="font-style:italic;color:${REDT};font-size:1.12em">Mac</span>`,'ring',.45,RED,8,2)}`);
  h+=C(452,`opacity:${hp};font-size:74px;line-height:1.04;font-weight:600;color:${INK};letter-spacing:-0.04em`,`inside a ${mark(t,te+.1,`<span class="serif" style="font-style:italic;font-size:1.12em">terminal.</span>`,'under',.35,RED,7)}`);
  const z=1+.04*seg(t,mac-.05,.5,eio)+.012*t;
  h+=`<div class="a" style="inset:0;transform-origin:540px 900px;transform:scale(${z.toFixed(4)})">`+shot({x:40,y:600,w:1000,h:1000*FH/FW,src:frame('a',t,A0),iw:FW,ih:FH})+`</div>`;
  h+=credit(t,0,'real footage · @kirtandopamine on X · terminal-mac',0,1290);
  return h;
});

// 2 · not for you: for your AI agent. The footage keeps running; "you." is struck; the agent's red cursor flies in
scene(S('l02'),DESK,(t)=>{
  let h=grain(0)+slug(t,0);
  const yo=at('l02','you'), ag=at('l02','agent');
  h+=topcap(t,'l02',[[0,4],[5,9]],{size:86,emph:[8,9],marks:{4:['strike',yo+.15,.25]}});
  h+=shot({x:40,y:540,w:1000,h:1000*FH/FW,src:frame('a',t,A0),iw:FW,ih:FH});
  // the agent's cursor arrives on an arc and starts working the guest desktop
  const p=seg(t,ag-.2,.55,eio);const x=lerp(1120,560,p)+Math.sin(p*Math.PI)*-60, y=lerp(1500,820,p)-Math.sin(p*Math.PI)*120;
  if(p>0){const jig=t>ag+.4?Math.sin((t-ag)*5)*30:0;h+=cursor(x+jig,y+jig*.4,RED,1.7);}
  h+=note(300,1250,t,ag+.25,'the agent drives this one',58,-3);
  h+=credit(t,S('l02'),'real footage · @kirtandopamine on X · terminal-mac',0,1330);
  return h;
},{tr:'cut',punch:1.03});

// 3 · the pain: an agent on YOUR computer takes your mouse, your screen, your clipboard
function yourScreen(t,o){const {mo=99,dlg=99,del=99,cant=99}=o;
  let s='';
  // a notes window you're typing in
  const typed='Q4 plan: ship the beta, then';const nTyped=Math.min(typed.length,Math.floor(clamp((Math.min(t,cant)-S('l03')+1)*9,0,99)));
  s+=`<div style="position:absolute;left:70px;top:70px;width:470px;height:300px;border-radius:12px;background:${TXT};box-shadow:0 18px 30px -18px rgba(29,28,26,.5)">
    <div class="mono" style="position:absolute;left:22px;top:16px;font-size:18px;color:${SOFT}">notes.txt</div>
    <div style="position:absolute;left:22px;top:60px;width:420px;font-family:Geist;font-size:30px;line-height:1.35;color:${INK}">${typed.slice(0,nTyped)}<span style="display:inline-block;width:3px;height:32px;background:${t<cant&&Math.floor(t*3)%2?'transparent':INK};vertical-align:-5px"></span></div>
    ${t>cant?`<div class="mono" style="position:absolute;left:22px;top:230px;font-size:20px;color:${REDT};${fade(t,cant,.2)}">typing… blocked</div>`:''}</div>`;
  // the dialog the agent clicks
