<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Serif;src:url(fonts/serif.woff2) format("woff2")}
@font-face{font-family:Serif;font-style:italic;src:url(fonts/serif-i.woff2) format("woff2")}
@font-face{font-family:Geist;src:url(fonts/geist.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Mono;src:url(fonts/mono.woff2) format("woff2");font-weight:100 900}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:Geist,sans-serif;-webkit-font-smoothing:antialiased;color:#fff}
#cam{position:absolute;inset:0;transform-origin:960px 500px}
#ui,#wipe,#cap{position:absolute;inset:0;pointer-events:none}
.a{position:absolute;box-sizing:border-box}
.c{left:0;width:1920px;text-align:center}
.serif{font-family:Serif;font-weight:400;letter-spacing:-0.01em}
.mono{font-family:Mono}
.w{display:inline-block;white-space:pre}
.pill{display:inline-flex;align-items:center;gap:12px;border-radius:999px;padding:10px 22px;font-family:Mono;font-size:22px}
.card{border-radius:18px;border:1px solid #2A2826;background:#171615}
#cap{top:auto;bottom:0;height:200px}
#cap .box{position:absolute;left:0;width:1920px;top:52px;text-align:center;font-family:Geist;font-weight:700;font-size:50px;letter-spacing:-0.01em}
#cap .box span.b{display:inline-block;background:rgba(10,10,9,.86);border-radius:18px;padding:10px 26px 14px}
svg{position:absolute;overflow:visible}
</style></head>
<body><div id="stage"><div id="cam"></div><div id="ui"></div><div id="cap"></div><div id="wipe"></div></div>
<script src="vo.js"></script>
<script>
// ---------- palette (matte black, ivory, dull accents: rule 5 practised) ----------
const DK='#0D0D0C', DK2='#171615', DKL='#2A2826', IV='#EFEBE3', IV2='#E4DFD5', INK='#161513', MID='#6E6860', DMID='#9A948B',
      OR='#E07A4F', ORS='#3A2318', TEAL='#7BA79F', BLUE='#8597B8', SAND='#CDB98D', RED='#C8594C', GRN='#79AB84';
const W=1920, H=1080, CX=960;
// ---------- math ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const eo=x=>x<=0?0:x>=1?1:1-Math.pow(2,-10*x);
const sio=x=>x<=0?0:x>=1?1:-(Math.cos(Math.PI*x)-1)/2;
const seg=(t,t0,d,e=eo)=>e(clamp((t-t0)/d));
function hash(n){let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
// ---------- voice timing ----------
const LINES={};for(const l of VO.lines)LINES[l.id]=l;
const S=id=>LINES[id].start, E=id=>LINES[id].end;
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
function wt(id,i){const l=LINES[id];const w=l.words[Math.min(i,l.words.length-1)];return w?w.s:l.start;}
function we(id,i){const l=LINES[id];const w=l.words[Math.min(i,l.words.length-1)];return w?w.e:l.end;}
function wordIdx(id,word,from=0){const l=LINES[id];const k=l.words.findIndex((w,i)=>i>=from&&norm(w.w).startsWith(word));if(k<0)console.warn('no word',id,word);return k<0?0:k;}
const at=(id,word,from=0)=>wt(id,wordIdx(id,word,from));
// the voice's own loudness at time t (30 fps envelope from mkvo.py)
function venv(t){for(const l of VO.lines){if(t>=l.start&&t<l.end){return l.env[Math.min(l.env.length-1,Math.floor((t-l.start)*30))]||0;}}return 0;}
// ---------- primitives ----------
function rise(t,t0,d=.38,dy=24){const p=seg(t,t0,d);return `opacity:${p.toFixed(3)};transform:translateY(${((1-p)*dy).toFixed(2)}px)`;}
// words rise one at a time: fade + 20 px + a touch of blur (rule 5: never longer than 1.5 s for a phrase)
function wrise(t,t0){const p=seg(t,t0,.34);return `opacity:${p.toFixed(3)};transform:translateY(${((1-p)*20).toFixed(1)}px);filter:blur(${((1-p)*5).toFixed(2)}px)`;}
function fade(t,t0,d=.3){return `opacity:${seg(t,t0,d).toFixed(3)}`;}
function ws(t,words,times,style=''){return words.map((w,i)=>`<span class="w" style="${wrise(t,times[i]??times[times.length-1])};${typeof style==='function'?style(i,w):style}">${w}${i<words.length-1?' ':''}</span>`).join('');}
function spoken(t,id,words,k=0,style=''){return ws(t,words,words.map((_,i)=>wt(id,k+i)-.06),style);}
function A(x,y,css,html){return `<div class="a" style="left:${x}px;top:${y}px;${css}">${html??''}</div>`;}
function C(y,css,html){return `<div class="a c" style="top:${y}px;${css}">${html??''}</div>`;}
function dotgrid(col,o=1){return `<div class="a" style="inset:0;opacity:${o};background-image:radial-gradient(${col} 1.5px,transparent 1.5px);background-size:48px 48px;background-position:24px 24px"></div>`;}
const it=(s,c=OR)=>`<span class="serif" style="font-style:italic;color:${c}">${s}</span>`;
const ICON={
 check:'<path d="M20 6 9 17l-5-5"/>', x:'<path d="M6 6l12 12M18 6 6 18"/>',
 file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
 film:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/>',
 wave:'<path d="M2 12h2M6 8v8M10 4v16M14 7v10M18 10v4M22 12h-2"/>',
 pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
 eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/>',
 send:'<path d="M5 12h14M13 6l6 6-6 6"/>', spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
 loop:'<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>',
 bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
};
function icon(name,size,col,sw=2){return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" style="position:static;fill:none;stroke:${col};stroke-width:${sw};stroke-linecap:round;stroke-linejoin:round;vertical-align:middle">${ICON[name]}</svg>`;}
function chat(x,y,w,text,t,t0,opts={}){
  // a plain chat composer (generic, not any product's UI): typed text + caret
  const n=Math.floor(clamp((t-t0)/(opts.dur??1.2))*text.length); const shown=opts.del!=null?text.slice(0,Math.max(0,n-Math.floor(clamp((t-opts.del)/.45)*text.length))):text.slice(0,n);
  const caret=(Math.floor(t*2.2)%2===0)?`<span style="display:inline-block;width:3px;height:1.05em;background:${OR};vertical-align:-0.15em;margin-left:2px"></span>`:'<span style="display:inline-block;width:3px;margin-left:2px"></span>';
  return A(x,y,`width:${w}px;${opts.css||''}`,`<div class="card" style="padding:26px 30px 22px;background:${opts.bg||DK2}">
    <div style="font-size:${opts.fs||34}px;line-height:1.35;color:${opts.col||'#ECE7DE'};min-height:${(opts.fs||34)*1.35}px">${shown}${caret}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px">
      <span class="mono" style="font-size:18px;color:${DMID}">${opts.tag||'+  attach'}</span>
      <span style="width:46px;height:46px;border-radius:12px;background:${OR};display:inline-flex;align-items:center;justify-content:center">${icon('send',24,'#1a0f09',2.4)}</span></div></div>`);
}
// ---------- scenes (each starts on its line; the next scene's start ends it) ----------
const SC=[];
function scene(t0,bg,draw,opt={}){SC.push({t0,bg,draw,...opt});}
const RULES=['Direct','Style','Plan','Voice','Motion','Sound','Review'];
const RULE_AT=['l05','l08','l11','l14','l16','l19','l23'];
const LEAD=.3; // a section's cut (and its pixel wipe) sits in the breath before its first word
function ruleOf(t){let r=-1;for(let i=0;i<7;i++)if(t>=S(RULE_AT[i])-LEAD)r=i;return (t>=S('l26')-LEAD)?-1:r;}

// title card for a rule: big number, the rule in words, risen word by word
function ruleTitle(id,n,words,ital){
  scene(S(id)-LEAD,DK,(t)=>{
    const t0=S(id);let h=dotgrid('#1b1a18');
    h+=A(160,300,`${rise(t,t0-.2)}`,`<span class="mono" style="font-size:26px;letter-spacing:.22em;color:${DMID}">RULE</span>`);
    // the rule number counts up like a dial
    const p=seg(t,t0-.25,.5);
    h+=A(150,330,`font-family:Mono;font-size:300px;line-height:1;color:${OR};letter-spacing:-.04em;opacity:${p};font-variant-numeric:tabular-nums`,String(n).padStart(2,'0'));
    h+=A(760,365,`width:1050px;font-size:118px;line-height:1.02;font-weight:700;letter-spacing:-0.035em;color:#fff`,
      spoken(t,id,words,2,(i)=>ital.includes(i)?`font-family:Serif;font-weight:400;font-style:italic;color:${OR};letter-spacing:-0.01em`:''));
    return h;
  },{rule:true,punch:1.045});
}

// 1 · hook: the chat box is already typing on frame 0; the text hook is already on screen
scene(0,DK,(t)=>{
  let h=dotgrid('#1b1a18');
  h+=C(150,'',`<span class="pill" style="background:${DK2};border:1px solid ${DKL};color:${DMID}">${icon('spark',22,OR)} the question everyone asks</span>`);
  const del=at('l01','there')-.05;
  h+=chat(CX-560,300,1120,'make me a viral video, cinematic, trending, high quality',t,-0.9,{dur:2.3,del,fs:40});
  const words=['Everyone','wants','the','prompt.'];
  h+=C(620,`font-size:96px;font-weight:700;letter-spacing:-0.035em;${fade(t,-1)}`,`${words.map((w,i)=>`<span class="w" style="${i===3?`font-family:Serif;font-weight:400;font-style:italic;color:${OR}`:''}">${w}${i<3?' ':''}</span>`).join('')}`);
  const p=seg(t,del,.4);
  h+=C(760,`font-size:120px;${wrise(t,del)}`,`<span class="serif" style="font-style:italic;color:#fff">There isn't one.</span>`);
  // the first line dims once the answer lands
  if(p>0)h+=C(620,`height:120px;background:${DK};opacity:${(p*.6).toFixed(3)}`,'');
  return h;
});

// 2 · made by Claude: script, every frame, every sound
scene(S('l02'),DK,(t)=>{
  const t0=S('l02');let h=dotgrid('#1b1a18');
  h+=C(120,`font-size:70px;font-weight:700;letter-spacing:-0.03em`,spoken(t,'l02',['This','whole','video','was','made','by','Claude.'],0,(i)=>i===6?`color:${OR}`:''));
  const T=[at('l02','script'),at('l02','every'),at('l02','every',wordIdx('l02','every')+1)];
  const tiles=[['THE SCRIPT','file','script.json'],['EVERY FRAME','film','film.html'],['EVERY SOUND','wave','mix.wav']];
  tiles.forEach(([lab,ic,f],i)=>{const x=210+i*520, y=330, d=T[i]-.08;
    let inner='';
    if(i===0){for(let k=0;k<6;k++)inner+=`<div style="height:12px;border-radius:6px;background:${k===2?OR:'#3a3733'};width:${[300,260,330,220,290,180][k]}px;margin:0 0 16px;opacity:${seg(t,d+.1+k*.09,.2)}"></div>`;}
    if(i===1){inner='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">';for(let k=0;k<12;k++)inner+=`<div style="height:46px;border-radius:6px;background:${['#2b2926',ORS,'#22302d','#2b2926'][k%4]};opacity:${seg(t,d+.05+k*.04,.2)}"></div>`;inner+='</div>';}
    if(i===2){inner='<div style="display:flex;align-items:center;gap:6px;height:132px">';for(let k=0;k<38;k++){const a=.25+.75*Math.abs(Math.sin(k*1.7+t*6))*hash(k);inner+=`<div style="width:5px;border-radius:3px;background:${TEAL};height:${(a*120*seg(t,d+.1,.4)).toFixed(1)}px"></div>`;}inner+='</div>';}
    h+=A(x,y,`width:480px;${rise(t,d)}`,`<div class="card" style="padding:30px;height:340px">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:30px">${icon(ic,30,OR)}<span class="mono" style="font-size:22px;letter-spacing:.14em;color:#d8d2c8">${lab}</span></div>${inner}
      <div class="mono" style="position:absolute;left:30px;bottom:24px;font-size:20px;color:${DMID}">${f}</div></div>`);
  });
  h+=C(760,`${rise(t,E('l02')-.3)};font-family:Mono;font-size:22px;color:${DMID};letter-spacing:.06em`,'no stock footage · no editing app · drawn in code, frame by frame');
  return h;
});

// 3 · the voice is a trained model: the waveform is the voice itself
scene(S('l03'),DK,(t)=>{
  const t0=S('l03');let h=dotgrid('#1b1a18');
  h+=C(170,`${rise(t,t0)}`,`<span class="pill" style="background:${DK2};border:1px solid ${DKL};color:#d8d2c8">${icon('mic',22,OR)} myvoice · sparsh</span>`);
  let bars='';const N=96;
  for(let k=0;k<N;k++){const tt=t-(N-k)*.018;const v=venv(tt);const hh=10+v*300;bars+=`<div style="width:9px;border-radius:5px;background:${k>N-8?OR:'#d8d2c8'};opacity:${(.3+.7*k/N).toFixed(2)};height:${hh.toFixed(1)}px"></div>`;}
  h+=A(CX-860,330,`width:1720px;height:330px;display:flex;align-items:center;justify-content:center;gap:9px`,bars);
  h+=C(720,`font-size:64px;font-weight:700;letter-spacing:-0.03em`,spoken(t,'l03',['Even','this','voice','is','a','model','trained','on','mine.'],0,(i)=>i===5?`font-family:Serif;font-weight:400;font-style:italic;color:${OR}`:''));
  h+=C(830,`${rise(t,E('l03')-.2)};font-family:Mono;font-size:22px;color:${DMID}`,'a fine-tuned voice model of Sparsh, voiced on a cloud GPU');
  return h;
});

// 4 · seven rules: directed, not generated
scene(S('l04'),DK,(t)=>{
  const t0=S('l04');let h=dotgrid('#1b1a18');
  const n=Math.round(lerp(0,7,seg(t,at('l04','seven')-.1,.6,sio)));
  h+=C(110,`font-family:Mono;font-size:260px;line-height:1;color:${OR};${fade(t,at('l04','seven')-.15)}`,String(n));
  h+=C(400,`font-size:64px;font-weight:700;letter-spacing:-0.03em`,spoken(t,'l04',['rules','that','make','AI','video','look'],4));
  const d=at('l04','directed'), g=at('l04','generated');
  h+=C(510,`font-size:150px;line-height:1.05`,`<span class="w serif" style="${wrise(t,d-.06)};font-style:italic;color:${OR}">directed,</span> <span class="w serif" style="${wrise(t,g-.25)};color:#5d5852;text-decoration:line-through;text-decoration-thickness:6px">not generated.</span>`);
  // the seven rules, laid out as the map we'll walk through
  RULES.forEach((r,i)=>{const x=CX-840+i*240;h+=A(x,800,`width:220px;text-align:center;${rise(t,E('l04')-.55+i*.05)}`,
    `<div class="mono" style="font-size:20px;color:${DMID}">${String(i+1).padStart(2,'0')}</div><div style="font-size:30px;font-weight:600;color:#ECE7DE;margin-top:6px">${r}</div>`);});
  return h;
});

// RULE 1 · direct, don't prompt
ruleTitle('l05',1,['Stop','prompting.','Start','directing.'],[3]);
scene(S('l06'),DK,(t)=>{
  const t0=S('l06');let h='';
  const slop=at('l06','slop'), give=at('l06','give'), film=at('l06','film');
  // left: the prompt and what it gets you
  h+=A(120,150,`width:780px;${rise(t,t0)}`,`<div class="mono" style="font-size:22px;letter-spacing:.14em;color:${DMID};margin-bottom:18px">THE PROMPT</div>`);
  h+=chat(120,200,780,'make a cool motion video',t,t0+.05,{dur:.9,fs:34});
  let g='';for(let k=0;k<6;k++){const c=['#5b3fd6','#e0306a','#16b3d9','#f2b705','#5b3fd6','#e0306a'][k];g+=`<div style="height:120px;border-radius:12px;background:${c};opacity:${seg(t,slop-.3+k*.05,.2)};position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.55),transparent 60%)"></div></div>`;}
  const dim=seg(t,slop+.2,.4);
  h+=A(120,440,`width:780px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;filter:grayscale(${dim}) blur(${dim*1.5}px);opacity:${1-.5*dim}`,g);
  h+=A(120,740,`width:780px;text-align:center;${wrise(t,slop-.05)}`,`<span style="font-size:72px;font-weight:800;letter-spacing:-0.03em;color:#6b655e">slop.</span>`);
  // right: a director's notes and what they get you
  h+=A(1020,150,`width:780px;${rise(t,give-.1)}`,`<div class="mono" style="font-size:22px;letter-spacing:.14em;color:${OR};margin-bottom:18px">THE DIRECTOR'S NOTES</div>`);
  const notes=['Hook: the question, on frame 1','Cut on spoken words, every 2-3 s','One accent colour, dull palette','Whoosh on every move, voice on top','Hold the end card 2 s'];
  let nl='';notes.forEach((n,k)=>{nl+=`<div style="display:flex;gap:14px;align-items:center;font-size:27px;color:#ECE7DE;margin:0 0 14px;${wrise(t,give+.05+k*.17)}">${icon('pen',22,OR)}<span>${n}</span></div>`;});
  h+=A(1020,200,`width:780px;${rise(t,give-.05)}`,`<div class="card" style="padding:28px 30px 16px">${nl}</div>`);
  // a film strip that runs
  let fr='';const off=((t-film)*180)%170;for(let k=0;k<6;k++)fr+=`<div style="position:absolute;left:${k*170-off}px;top:14px;width:150px;height:92px;border-radius:6px;background:${k%2?'#22302d':ORS}"><div style="position:absolute;left:14px;top:14px;width:${40+hash(k)*60}px;height:8px;background:${k%2?TEAL:OR};border-radius:4px"></div></div>`;
  h+=A(1020,620,`width:780px;height:120px;overflow:hidden;border-radius:12px;background:#000;border:1px solid ${DKL};${rise(t,film-.15)}`,fr);
  h+=A(1020,740,`width:780px;text-align:center;${wrise(t,film-.05)}`,`<span class="serif" style="font-size:84px;font-style:italic;color:${OR}">a film.</span>`);
  return h;
},{rule:true,cap:'l06'});
scene(S('l07'),DK,(t)=>{
  const t0=S('l07');let h=dotgrid('#1b1a18');
  const most=at('l07','most'), idea=at('l07','your'), fake=at('l07','fake');
  h+=C(130,`font-size:60px;font-weight:700;letter-spacing:-0.03em`,spoken(t,'l07',['Claude','does','most','of','the','work.'],0,(i)=>i===2?`color:${OR}`:''));
  // the split: what Claude does vs what only you bring
  const p=seg(t,most,.8,sio), q=seg(t,idea-.1,.6,sio);
  h+=A(260,330,`width:1400px;height:150px;border-radius:18px;background:${DK2};border:1px solid ${DKL};overflow:hidden`,
    `<div style="position:absolute;left:0;top:0;bottom:0;width:${(p*76).toFixed(2)}%;background:#2c2a27"></div>
     <div style="position:absolute;right:0;top:0;bottom:0;width:${(q*24).toFixed(2)}%;background:${OR}"></div>`);
  ['script','frames','voice','sound','the mix'].forEach((s,i)=>{h+=A(290+i*200,372,`${rise(t,most+.15+i*.1)};font-family:Mono;font-size:24px;color:#d8d2c8`,s);});
  h+=A(1360,360,`width:290px;text-align:center;${rise(t,idea)};font-size:38px;font-weight:700;color:#1a0f09`,'idea · taste');
  h+=A(260,505,`${rise(t,most+.2)};font-family:Mono;font-size:22px;color:${DMID}`,'CLAUDE');
  h+=A(1510,505,`${rise(t,idea)};font-family:Mono;font-size:22px;color:${OR}`,'YOU');
  h+=C(650,`font-size:76px;font-weight:700;letter-spacing:-0.03em`,spoken(t,'l07',['the','part','it','can\'t','fake.'],wordIdx('l07','the',8),(i)=>i===4?`font-family:Serif;font-weight:400;font-style:italic;color:${OR}`:''));
  return h;
},{rule:true});

// RULE 2 · write your style down once
ruleTitle('l08',2,['Write','your','style','down','once.'],[4]);
scene(S('l09'),IV,(t)=>{
  const t0=S('l09');let h=dotgrid('#DCD6CB');
  const T=[at('l09','fonts'),at('l09','colours'),at('l09','where'),at('l09','how'),at('l09','skill')];
  const fold=seg(t,T[4]-.25,.55,sio);
  // the style guide, a real document
  const dx=lerp(0,-430,fold), sc=lerp(1,.62,fold);

// ---------- seek ----------
const cam=document.getElementById('cam'), ui=document.getElementById('ui'), cap=document.getElementById('cap'), wp=document.getElementById('wipe'), stage=document.getElementById('stage');
window.DURATION=VO.duration;
window.seek=function(t){
  let i=0;while(i+1<SC.length&&SC[i+1].t0<=t)i++;
  const sc=SC[i], lt=t-sc.t0, t1=(SC[i+1]?.t0)??window.DURATION;
  stage.style.background=sc.bg;
  // camera: a small punch-in on each cut, a slow drift after (never fully still, except the end card)
  let s=1;
  if(!sc.still){s=1+(sc.punch?sc.punch-1:.03)*(1-eo(clamp(lt/.3)))+(sc.drift??.018)*clamp(lt/Math.max(1,t1-sc.t0));}
  else s=1+.03*(1-eo(clamp(lt/.3)));
  cam.style.transform=`scale(${s.toFixed(5)})`;
  cam.innerHTML=sc.draw(t);
  ui.innerHTML=chrome(t);
  cap.innerHTML=caption(t);
  wp.innerHTML=wipe(t);
};
window.CUTS=SC.map(s=>s.t0);
