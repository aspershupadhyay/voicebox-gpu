<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Jost;src:url(fonts/jost.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:"Courier Prime";src:url(fonts/courier-prime.woff2) format("woff2")}
@font-face{font-family:Geist;src:url(fonts/geist.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Serif;src:url(fonts/serif.woff2) format("woff2")}
@font-face{font-family:Serif;font-style:italic;src:url(fonts/serif-i.woff2) format("woff2")}
@font-face{font-family:Caveat;src:url(fonts/caveat.woff2) format("woff2");font-weight:400 700}
@font-face{font-family:Mono;src:url(fonts/mono.woff2) format("woff2");font-weight:100 900}
html,body{margin:0;background:#1A1917;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Geist,sans-serif;-webkit-font-smoothing:antialiased}
#cam{position:absolute;inset:0;transform-origin:540px 900px}
.a{position:absolute;box-sizing:border-box}
.c{left:0;width:1080px;text-align:center}
.serif{font-family:Serif;font-weight:400;letter-spacing:-0.01em}
.mono{font-family:Mono;font-variant-numeric:tabular-nums}
.w{display:inline-block;white-space:pre}
svg{position:absolute;overflow:visible}
img{position:absolute;display:block}
</style></head>
<body><div id="stage"><div id="cam"></div></div>
<script src="vo.js"></script>
<script src="cte.js"></script>
<script>
// Catch the Error: "Markdown is the new malware" (Forever Security, "Markdown Is the New Executable", Gal Weizman &
// Omer Samet, Oct 22, 2026: forever.security/blog/hijacking-ai-agents-via-downloads-folder).
// The world: the case file. A dark walnut evidence desk, the planted AGENTS.md sealed in an evidence bag, typed
// exhibits on paper, manila folders for the diagrams, tags on strings; the red pen is the investigator's. Real media:
// the article's headline, the attacker's real AGENTS.md section and the two result lines, as clippings on the desk.
const DESK='#2A2521', DESK2='#37302B', MAN='#CDB27A', MAN2='#B89C63', PAPER='#ECE5D5', PAPER2='#DDD4C1',
      INK='#1E1B18', SOFT='#4A443C', GREY='#8C857A', TXT='#ECE5D5', TXT2='#B7AE9E', RED='#D8463A', REDL='#E8705F',
      REDT='#A8322A', OK='#5E7D5B', CODE='#23201D', CODET='#E3DCCB', BRASS='#C9A86A', INK2='#2F2A25';
// ---------- math ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const eo=x=>x<=0?0:x>=1?1:1-Math.pow(2,-10*x);
const eio=x=>x<=0?0:x>=1?1:x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{if(x<=0)return 0;if(x>=1)return 1;const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const seg=(t,t0,d,e=eo)=>e(clamp((t-t0)/d));
function hash(n){let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
// ---------- voice timing ----------
const LINES={};for(const l of VO.lines)LINES[l.id]=l;
const S=id=>LINES[id]?LINES[id].start:NaN, E=id=>LINES[id]?LINES[id].end:NaN;
function wt(id,i){const l=LINES[id];if(!l)return NaN;const w=l.words[Math.min(i,l.words.length-1)];return w?w.s:l.start;}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
function wordIdx(id,word,from=0){const l=LINES[id];if(!l)return 0;const k=l.words.findIndex((w,i)=>i>=from&&norm(w.w).startsWith(word));return k<0?0:k;}
const at=(id,word,from=0)=>wt(id,wordIdx(id,word,from));
// ---------- text motion (the house rise) ----------
function rise(t,t0,d=.34,dy=22){const p=seg(t,t0,d);return `opacity:${p.toFixed(3)};transform:translateY(${((1-p)*dy).toFixed(2)}px);filter:blur(${((1-p)*5).toFixed(2)}px)`;}
function fade(t,t0,d=.3){return `opacity:${seg(t,t0,d).toFixed(3)}`;}
function arrive(t,t0,d=.42){const p=clamp((t-t0)/d);const s=p<=0?.82:lerp(.82,1,back(p));return `opacity:${clamp(p*3).toFixed(3)};transform:scale(${s.toFixed(4)})`;}
function ws(t,words,times,style=''){return words.map((w,i)=>`<span class="w" style="${rise(t,times[i]??times[times.length-1],.3,18)};${style}">${w}${i<words.length-1?' ':''}</span>`).join('');}
function spoken(t,id,words,k=0,style=''){return ws(t,words,words.map((_,i)=>wt(id,k+i)-.06),style);}
function A(x,y,css,html){return `<div class="a" style="left:${x}px;top:${y}px;${css}">${html??''}</div>`;}
function C(y,css,html){return `<div class="a c" style="top:${y}px;${css}">${html??''}</div>`;}
function grain(dark){return `<svg width="1080" height="1920" style="left:0;top:0"><filter id="g${dark?1:0}"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="${dark?9:4}"/><feColorMatrix values="0 0 0 0 ${dark?.9:.25}  0 0 0 0 ${dark?.88:.24}  0 0 0 0 ${dark?.85:.22}  0 0 0 ${dark?.035:.07} 0"/></filter><rect width="1080" height="1920" filter="url(#g${dark?1:0})"/></svg>`;}
function credit(t,t0,text,dark=0,y=1700){return A(70,y,`${fade(t,t0,.3)};font-family:Mono;font-size:22px;letter-spacing:.03em;color:${dark?TXT2:SOFT};width:940px;line-height:1.45`,text);}
function svgL(inner){return `<svg width="1080" height="1920" style="left:0;top:0">${inner}</svg>`;}
function note(x,y,t,t0,text,size=52,rot=-3,col=REDT){return A(x,y,`${rise(t,t0,.3,10)};font-family:Caveat;font-weight:600;font-size:${size}px;color:${col};transform-origin:left;rotate:${rot}deg;white-space:nowrap`,text);}
// ---------- the red pen ----------
function wob(i,seed,amp){return amp*(Math.sin(i*.9+seed)*.6+Math.sin(i*2.3+seed*1.7)*.4);}
function penPath(pts,t,t0,d,w=7,col=RED){const p=eio(clamp((t-t0)/d));if(p<=0)return '';let L=0;for(let i=1;i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  return `<path d="M${pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L')}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${L.toFixed(0)}" stroke-dashoffset="${(L*(1-p)).toFixed(1)}"/>`;}
function penUnder(x0,x1,y,t,t0,d=.35,w=8,seed=1,col=RED){const n=24,pts=[];for(let i=0;i<=n;i++){const u=i/n;pts.push([lerp(x0,x1,u),y+wob(i,seed,3)+u*6-8*u*(1-u)]);}return penPath(pts,t,t0,d,w,col);}
function penStrike(x0,x1,y,t,t0,d=.25,w=8,col=RED){const pts=[];for(let i=0;i<=16;i++){const u=i/16;pts.push([lerp(x0,x1,u),y+wob(i,4,2.5)-u*10]);}return penPath(pts,t,t0,d,w,col);}
function penRing(cx,cy,rx,ry,t,t0,d=.6,w=7,turns=1.25,seed=2,col=RED){const pts=[],n=120,a0=-2.3;for(let i=0;i<=n;i++){const u=i/n,a=a0+u*Math.PI*2*turns;const r=1+.05*Math.sin(3*a+seed)+.03*Math.sin(5*a+seed*2)+.03*u;pts.push([cx+Math.cos(a)*rx*r,cy+Math.sin(a)*ry*r]);}return penPath(pts,t,t0,d,w,col);}
function penTick(x,y,s,t,t0,d=.22,w=8,col=RED){return penPath([[x,y],[x+s*.35,y+s*.4],[x+s,y-s*.55]],t,t0,d,w,col);}
function penX(x,y,s,t,t0,w=7,col=RED){return penPath([[x,y],[x+s,y+s]],t,t0,.12,w,col)+penPath([[x+s,y],[x,y+s]],t,t0+.1,.12,w,col);}
function penArrow(x0,y0,x1,y1,t,t0,d=.3,w=6,bend=24,col=RED){const pts=[];for(let i=0;i<=16;i++){const u=i/16;pts.push([lerp(x0,x1,u)+Math.sin(u*Math.PI)*bend,lerp(y0,y1,u)]);}
  const ang=Math.atan2(y1-pts[14][1],x1-pts[14][0]);const h=22;const hd=[[x1-h*Math.cos(ang-.5),y1-h*Math.sin(ang-.5)],[x1,y1],[x1-h*Math.cos(ang+.5),y1-h*Math.sin(ang+.5)]];
  return penPath(pts,t,t0,d,w,col)+penPath(hd,t,t0+d*.9,.12,w,col);}
// an inline mark on a word (ring / strike / under), drawn in the word's own box
function mark(t,t0,inner,kind='ring',d=.5,col=RED,w=7,seed=3){const p=eio(clamp((t-t0)/d));
  let path='',box='left:-10%;top:-24%;width:120%;height:148%';
  if(kind==='ring'){const pts=[];for(let i=0;i<=90;i++){const u=i/90,a=-2.3+u*Math.PI*2*1.2;const r=1+.04*Math.sin(3*a+seed)+.03*u;pts.push([50+Math.cos(a)*46*r,50+Math.sin(a)*44*r]);}path='M'+pts.map(q=>q[0].toFixed(2)+' '+q[1].toFixed(2)).join(' L');}
  if(kind==='strike'){box='left:-4%;top:0;width:108%;height:100%';path='M0 58 C30 52, 60 56, 100 46';}
  if(kind==='under'){box='left:-3%;top:84%;width:106%;height:22%';path='M0 40 C30 60, 70 30, 100 55';}
  const svg=p>0?`<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;${box};overflow:visible;pointer-events:none"><path d="${path}" pathLength="1" fill="none" stroke="${col}" stroke-width="${w}" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 1" stroke-dashoffset="${(1-p).toFixed(4)}"/></svg>`:'';
  return `<span style="position:relative;display:inline-block">${inner}${svg}</span>`;}
// the top caption: the phrase being spoken rises word by word on its spoken times; idea words are the serif italic
// in red; marks: {index: [kind, time]} lets the pen strike, ring or underline a word as it's said
function topcap(t,id,groups,o={}){const l=LINES[id];if(!l)return '';const {y=250,size=78,emph=[],col=INK,ecol=REDT,lh=1.08,w=960,marks={},early=-1}=o;
  let g=0;groups.forEach(([a],i)=>{if(t>=wt(id,a)-.12)g=i;});const [a,b]=groups[g];
  const words=l.words.slice(a,b+1).map((x,i)=>{const k=a+i;const e=emph.includes(k);let inner=x.w;
    if(marks[k])inner=mark(t,marks[k][1],inner,marks[k][0],marks[k][2]||.35,ecol,7,k);
    return `<span class="w${e?' serif':''}" style="${k<=early?'':rise(t,wt(id,k)-.06,.3,18)};${e?`font-style:italic;color:${ecol};font-size:1.12em`:''}">${inner}${k<b?' ':''}</span>`;}).join('');
  return A((1080-w)/2,y,`width:${w}px;text-align:center;font-size:${size}px;line-height:${lh};font-weight:600;color:${col};letter-spacing:-0.035em`,words);}
// ---------- the case-file world ----------
function cursor(x,y,col=INK,s=1,op=1){return `<svg width="${40*s}" height="${52*s}" viewBox="-3 -3 40 52" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;opacity:${op};overflow:visible"><path d="M0 0 L0 36 L9.5 27.5 L16 42 L22.5 39 L16 25 L28 25 Z" fill="${col}" stroke="${TXT}" stroke-width="3" stroke-linejoin="round"/></svg>`;}
function shot(o){const {x,y,w,h,src,iw,ih,cx=iw/2,cy=ih/2,z=w/iw,op=1,rp=1,marks='',r=30}=o;
  const ix=w/2-cx*z, iy=h/2-cy*z;
  return `<div class="a" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${r}px;overflow:hidden;opacity:${op.toFixed(3)};transform:translateY(${((1-rp)*110).toFixed(1)}px) scale(${lerp(.92,1,rp).toFixed(4)});box-shadow:0 44px 70px -34px rgba(29,28,26,.7),0 0 0 2px rgba(29,28,26,.14);background:${CODE}">
    <div style="position:absolute;left:${ix.toFixed(1)}px;top:${iy.toFixed(1)}px;width:${iw}px;height:${ih}px;transform-origin:0 0;transform:scale(${z.toFixed(4)})">
    <img src="${src}" style="left:0;top:0;width:${iw}px;height:${ih}px"><svg width="${iw}" height="${ih}" style="left:0;top:0">${marks}</svg></div></div>`;}
function chip(text,o={}){const {fg=INK,bg='transparent',bd=INK,size=30,pad='10px 26px',css=''}=o;return `<span style="display:inline-block;font-family:Mono;font-size:${size}px;color:${fg};background:${bg};border:3px solid ${bd};border-radius:60px;padding:${pad};white-space:nowrap;${css}">${text}</span>`;}
function slugC(dark=1){return A(70,150,`font-family:'Courier Prime';font-size:26px;letter-spacing:.12em;color:${dark?TXT2:SOFT}`,`CASE FILE <span style="color:${dark?REDL:REDT}">·</span> MARKDOWN`);}
function exhibit(t,t0,label,dark=1){return A(700,146,`${fade(t,t0,.3)};width:310px;text-align:right;font-family:'Courier Prime';font-size:26px;letter-spacing:.12em;color:${dark?REDL:REDT}`,label);}
const TC=(o={})=>({col:TXT,ecol:REDL,size:72,...o});          // the top caption on the desk
const TL=(o={})=>({col:INK,ecol:REDT,size:72,...o});          // on paper / manila
// a typed sheet: a heading and "text" lines as grey bars (we never invent the file's words), optional real heading at the end
function sheet(x,y,w,h,o={}){const {title='',tail='',rot=0,rows=14,css='',seed=1,fill=SOFT}=o;let r='';
  for(let i=0;i<rows;i++){const lw=w-120-(hash(i+seed)*.45)*(w-120);r+=`<div style="position:absolute;left:56px;top:${118+i*36}px;width:${lw.toFixed(0)}px;height:12px;border-radius:6px;background:${PAPER2}"></div>`;}
  return `<div class="a" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${PAPER};border-radius:8px;transform:rotate(${rot}deg);box-shadow:0 40px 60px -30px rgba(20,17,14,.75);overflow:hidden;${css}">
    <div style="position:absolute;left:56px;top:48px;font-family:'Courier Prime';font-weight:700;font-size:34px;color:${INK}">${title}</div>${r}
    ${tail?`<div style="position:absolute;left:56px;top:${118+rows*36+10}px;font-family:'Courier Prime';font-weight:700;font-size:30px;color:${fill}">${tail}</div>`:''}</div>`;}
// the evidence bag: clear plastic (flat panes, no gradients), a red seal strip, the item inside
function bag(x,y,w,h,inner,o={}){const {rot=-3,label='EVIDENCE'}=o;
  return `<div class="a" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${rot}deg)">
    <div style="position:absolute;inset:0;border-radius:18px;background:rgba(236,229,213,.07);box-shadow:inset 0 0 0 3px rgba(236,229,213,.28),0 50px 80px -40px rgba(10,8,6,.9)"></div>
    <div style="position:absolute;left:40px;top:110px;width:${w-80}px;height:${h-150}px">${inner}</div>
    <svg width="${w}" height="${h}" style="left:0;top:0"><polygon points="${w*.62},0 ${w*.8},0 ${w*.35},${h} ${w*.17},${h}" fill="rgba(236,229,213,.06)"/><polygon points="${w*.84},0 ${w*.88},0 ${w*.43},${h} ${w*.39},${h}" fill="rgba(236,229,213,.05)"/></svg>
    <div style="position:absolute;left:0;top:0;width:${w}px;height:84px;border-radius:18px 18px 0 0;background:rgba(236,229,213,.13);border-bottom:3px solid rgba(236,229,213,.3)"></div>
    <div style="position:absolute;left:28px;top:100px;width:${w-56}px;height:4px;background:${REDT};opacity:.9"></div>
    <div style="position:absolute;left:0;width:${w}px;top:20px;text-align:center;font-family:'Courier Prime';font-weight:700;font-size:34px;letter-spacing:.3em;color:${TXT}">${label}</div></div>`;}
// a manila tag on a string
function tag(x,y,w,text,o={}){const {rot=6,size=34,col=INK,sub=''}=o;
  return `<div class="a" style="left:${x}px;top:${y}px;width:${w}px;transform:rotate(${rot}deg);transform-origin:0 50%">
    <div style="position:relative;background:${MAN};clip-path:polygon(9% 0,100% 0,100% 100%,9% 100%,0 50%);padding:22px 30px 22px 74px;box-shadow:0 20px 30px -18px rgba(10,8,6,.8)">
    <div style="position:absolute;left:30px;top:50%;margin-top:-11px;width:22px;height:22px;border-radius:11px;background:${DESK}"></div>
    <div style="font-family:'Courier Prime';font-weight:700;font-size:${size}px;color:${col};line-height:1.15">${text}</div>${sub?`<div style="font-family:'Courier Prime';font-size:24px;color:${SOFT};margin-top:6px">${sub}</div>`:''}</div></div>`;}
// a small dark window (an agent's terminal, a browser, a config file)
function card(x,y,w,h,title,inner,o={}){const {bg=CODE,col=CODET,css=''}=o;
  return `<div class="a" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:20px;background:${bg};box-shadow:0 36px 60px -30px rgba(10,8,6,.85),0 0 0 2px rgba(236,229,213,.12);overflow:hidden;${css}">
    <div style="position:absolute;left:0;top:0;width:100%;height:48px;background:${INK2}"></div>
    ${[REDT,MAN2,OK].map((c,i)=>`<div style="position:absolute;left:${20+i*22}px;top:17px;width:13px;height:13px;border-radius:7px;background:${c}"></div>`).join('')}
    <div class="mono" style="position:absolute;left:0;width:100%;top:11px;text-align:center;font-size:21px;color:${TXT2}">${title}</div>
    <div style="position:absolute;left:0;top:48px;width:100%;height:${h-48}px;font-family:Mono;color:${col}">${inner}</div></div>`;}
// a folder icon (drawn), optionally locked / lit
function folder(x,y,s,label,o={}){const {col=MAN,lc=TXT,op=1,ring=''}=o;
  return `<div class="a" style="left:${x}px;top:${y}px;width:${200*s}px;opacity:${op}"><svg width="${200*s}" height="${150*s}" viewBox="0 0 200 150" style="position:relative;display:block"><path d="M8 26 Q8 14 20 14 L76 14 L92 30 L180 30 Q192 30 192 42 L192 132 Q192 144 180 144 L20 144 Q8 144 8 132 Z" fill="${col}"/><path d="M8 52 L192 52 L192 132 Q192 144 180 144 L20 144 Q8 144 8 132 Z" fill="${col}" style="filter:brightness(1.08)"/>${ring}</svg>
    <div style="font-family:Mono;font-size:${Math.round(26*Math.max(.8,s))}px;color:${lc};text-align:center;margin-top:10px;white-space:nowrap">${label}</div></div>`;}
function realcard(o){return shot({r:22,...o});}
// a red packet that travels along a straight line from a to b between t0 and t0+d
function packet(t,t0,d,x0,y0,x1,y1,label='',col=RED){const p=eio(clamp((t-t0)/d));if(t<t0||t>t0+d+.25)return '';const x=lerp(x0,x1,p),y=lerp(y0,y1,p);
  return A(x-60,y-26,`width:120px;height:52px;border-radius:12px;background:${col};color:${PAPER};font-family:Mono;font-size:22px;line-height:52px;text-align:center;opacity:${(1-seg(t,t0+d,.25)).toFixed(3)}`,label);}
function line(x0,y0,x1,y1,t,t0,d=.35,col=TXT2,w=4,dash=''){const p=eo(clamp((t-t0)/d));if(p<=0)return '';const L=Math.hypot(x1-x0,y1-y0);
  return svgL(`<line x1="${x0}" y1="${y0}" x2="${x0+(x1-x0)*p}" y2="${y0+(y1-y0)*p}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${dash?`stroke-dasharray="${dash}"`:''}/>`);}
// the tally: ten attempts as squares; k of them filled red, landing one by one
function tally(x,y,k,t,t0,dt=.07,o={}){const {s=74,gap=14,on=RED,off='rgba(236,229,213,.16)',bd='rgba(236,229,213,.35)'}=o;let h='';
  for(let i=0;i<10;i++){const p=seg(t,t0+i*dt,.2,back);const lit=i<k&&t>=t0+i*dt;
    h+=A(x+i*(s+gap),y,`width:${s}px;height:${s}px;border-radius:10px;background:${lit?on:off};box-shadow:inset 0 0 0 3px ${lit?on:bd};transform:scale(${(lit?lerp(.6,1,p):1).toFixed(3)})`);}
  return h;}
function counter(t,t0,d,to,fmt=v=>Math.round(v)){return fmt(to*eo(clamp((t-t0)/d)));}

// ---------- scenes ----------
const SC=[];
function scene(t0,bg,draw,opt={}){if(isFinite(t0))SC.push({t0,bg,draw,...opt});}
const BAGX=170,BAGY=620,BAGW=740,BAGH=900;
function theBag(t,o={}){const {lab=-1}=o;   // the hero: AGENTS.md sealed in the evidence bag
  return bag(BAGX,BAGY,BAGW,BAGH,sheet(0,0,BAGW-80,BAGH-160,{title:'# Engineering Work Guidelines',rows:15,rot:1.5,tail:'## Local developer environment',fill:REDT}),{rot:-3});}

// 1 · hook: the bag is on the desk on frame 1, the camera already pushing in; "no code" struck on the sheet line;
// on "malware" the tag swings in
scene(0,DESK,(t)=>{
  let h=grain(1)+slugC()+exhibit(t,-1,'EXHIBIT A');
  const push=1+.05*eio(clamp(t/4));
  h+=`<div class="a" style="inset:0;transform:scale(${push.toFixed(4)});transform-origin:540px 1050px">${theBag(t)}`;
