<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Geist;src:url(fonts/geist.woff2) format("woff2");font-weight:100 900}
html,body{margin:0;background:#000}
.st{position:relative;overflow:hidden;font-family:Geist;-webkit-font-smoothing:antialiased}
.a{position:absolute}
img{display:block}
.t{font-weight:900;letter-spacing:-.055em;line-height:.84;text-transform:uppercase;color:#fff;white-space:nowrap;text-align:center;left:0;right:0}
</style></head><body>
<!-- YouTube 1280x720 -->
<div id="yt" class="st" style="width:1280px;height:720px;background:rgb(200,2,6)">
  <img class="a" src="assets/thumb_src.png" style="left:0;top:150px;width:1280px;height:720px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 70px)">
  <div class="a t" style="top:22px;font-size:120px;text-shadow:0 6px 0 rgba(80,0,0,.35)">You only see</div>
  <div class="a t" style="top:128px;font-size:178px;text-shadow:0 6px 0 rgba(80,0,0,.35)">the result.</div>
  <img class="a" src="assets/thumb_cut.png" style="left:0;top:150px;width:1280px;height:720px">
</div>
<!-- Instagram cover 1080x1920; the grid shows y 285-1635 -->
<div id="ig" class="st" style="width:1080px;height:1920px;background:#0d0d0d">
  <div class="a" style="left:40px;top:930px;width:1000px;height:640px;border-radius:44px;overflow:hidden">
    <img class="a" src="assets/thumb_src.png" style="left:-262px;top:-290px;width:1460px;height:822px">
  </div>
  <div class="a t" style="top:470px;font-size:138px">You only see</div>
  <div class="a t" style="top:600px;font-size:170px;color:#fff">the result.</div>
  <div class="a" style="left:40px;top:640px;width:1000px;height:930px;overflow:hidden;border-radius:0 0 44px 44px">
    <img class="a" src="assets/thumb_cut_tight.png" style="left:-262px;top:0;width:1460px;height:822px">
  </div>
</div>
</body></html>
