<!doctype html><meta charset="utf-8"><script>
const SR=48000, DUR=42.5, B=0.5;
const mtof=m=>440*Math.pow(2,(m-69)/12);
// deterministic noise
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function noiseBuf(ctx,sec,seed=1){const n=Math.floor(sec*SR),b=ctx.createBuffer(2,n,SR);for(let c=0;c<2;c++){const r=rng(seed+c*77),d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=r()*2-1;}return b;}
function irBuf(ctx,sec=2.6,decay=3.2){const n=Math.floor(sec*SR),b=ctx.createBuffer(2,n,SR);for(let c=0;c<2;c++){const r=rng(9+c),d=b.getChannelData(c);for(let i=0;i<n;i++){const x=i/n;d[i]=(r()*2-1)*Math.pow(1-x,decay)*(i<SR*0.012?i/(SR*0.012):1);}}return b;}
// chords: Fm9, Dbmaj7(add9), Abmaj9, Eb6/9 — one per 2 bars
const CH=[[53,56,60,63,67],[49,53,56,60,65],[56,60,63,67,70],[51,55,58,60,67]];
const ROOT=[41,37,44,39];
const chordAt=t=>Math.floor(Math.max(0,t)/4)%4;

function busses(ctx){
  const master=ctx.createGain();master.gain.value=0.9;
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3.5;comp.attack.value=0.006;comp.release.value=0.18;comp.knee.value=8;
  const lim=ctx.createDynamicsCompressor();lim.threshold.value=-3;lim.ratio.value=20;lim.attack.value=0.001;lim.release.value=0.06;lim.knee.value=0;

// ---------------- PASS 1: the music ----------------
async function music(){

  const kickOn=t=>!(t>=10&&t<12);

    // duck tonal bus
    const g=tonal.gain;g.setValueAtTime(1,t);g.setValueAtTime(0.35,t+0.005);g.linearRampToValueAtTime(1,t+0.32);

  // sub drop at the payoff
  {const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(70,32);o.frequency.exponentialRampToValueAtTime(32,33.6);g.gain.setValueAtTime(0,32);g.gain.linearRampToValueAtTime(0.75,32.01);g.gain.exponentialRampToValueAtTime(0.001,34.2);o.connect(g);g.connect(master);o.start(32);o.stop(34.3);}

function kick(ctx,out,t,lvl,lp){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(165,t);o.frequency.exponentialRampToValueAtTime(48,t+0.11);

  const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;o.connect(g);g.connect(f);f.connect(out);o.start(t);o.stop(t+0.45);
  const c=ctx.createOscillator(),cg=ctx.createGain();c.type='triangle';c.frequency.setValueAtTime(2400,t);c.frequency.exponentialRampToValueAtTime(400,t+0.012);cg.gain.setValueAtTime(lvl*0.25*(lp>1000?1:0.2),t);cg.gain.exponentialRampToValueAtTime(0.001,t+0.02);c.connect(cg);cg.connect(out);c.start(t);c.stop(t+0.03);}
function hat(ctx,out,NZ,t,v,dec){const s=ctx.createBufferSource();s.buffer=NZ;const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=8200;const g=ctx.createGain();

function clap(ctx,out,rev,NZ,t,v){const s=ctx.createBufferSource();s.buffer=NZ;const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=1500;f.Q.value=0.9;const g=ctx.createGain();
  g.gain.setValueAtTime(0,t);[0,0.011,0.022].forEach((d,i)=>{g.gain.setValueAtTime(v,t+d);g.gain.exponentialRampToValueAtTime(v*0.25,t+d+0.009);});g.gain.setValueAtTime(v*0.8,t+0.03);g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
  s.connect(f);f.connect(g);g.connect(out);const rs=ctx.createGain();rs.gain.value=0.5;g.connect(rs);rs.connect(rev);s.start(t,(t*3.1)%1.5,0.25);}
function pad(ctx,out,t,dur,fr,v,cut,bright){const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(cut*0.6,t);f.frequency.linearRampToValueAtTime(cut,t+dur*0.6);f.Q.value=0.7;
  const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+(bright?0.02:0.35));g.gain.setValueAtTime(v,t+dur-0.3);g.gain.linearRampToValueAtTime(bright?v*0.6:0,t+dur);if(bright)g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.05);
  f.connect(g);g.connect(out);for(const d of [-9,-3,4,10]){const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=fr;o.detune.value=d;const p=ctx.createStereoPanner();p.pan.value=d/14;o.connect(p);p.connect(f);o.start(t);o.stop(t+dur+0.1);}}
function bass(ctx,out,t,dur,fr,v){const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=fr;const s=ctx.createOscillator();s.frequency.value=fr;const f=ctx.createBiquadFilter();f.type='lowpass';f.Q.value=3;
  f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(220,t+dur);const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+0.008);g.gain.setValueAtTime(v,t+dur*0.7);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  const sg=ctx.createGain();sg.gain.value=0.9;o.connect(f);s.connect(sg);sg.connect(g);f.connect(g);g.connect(out);o.start(t);s.start(t);o.stop(t+dur+0.02);s.stop(t+dur+0.02);}
function pluck(ctx,out,dIn,t,fr,v){const o=ctx.createOscillator();o.type='triangle';o.frequency.value=fr;const m=ctx.createOscillator();m.frequency.value=fr*2;const mg=ctx.createGain();mg.gain.setValueAtTime(fr*1.2,t);mg.gain.exponentialRampToValueAtTime(1,t+0.15);m.connect(mg);mg.connect(o.frequency);

function bell(ctx,out,rev,t,fr,v,dur){const o=ctx.createOscillator();o.frequency.value=fr;const m=ctx.createOscillator();m.frequency.value=fr*3.5;const mg=ctx.createGain();mg.gain.setValueAtTime(fr*2,t);mg.gain.exponentialRampToValueAtTime(fr*0.05,t+dur);m.connect(mg);mg.connect(o.frequency);
  const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+0.003);g.gain.exponentialRampToValueAtTime(0.0005,t+dur);o.connect(g);g.connect(out);const r=ctx.createGain();r.gain.value=0.6;g.connect(r);r.connect(rev);o.start(t);m.start(t);o.stop(t+dur);m.stop(t+dur);}
function riser(ctx,out,NZ,t,dur,v){const s=ctx.createBufferSource();s.buffer=NZ;s.loop=true;const f=ctx.createBiquadFilter();f.type='bandpass';f.Q.value=2.5;f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(7000,t+dur);
  const g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+dur-0.02);g.gain.linearRampToValueAtTime(0,t+dur);s.connect(f);f.connect(g);g.connect(out);s.start(t);s.stop(t+dur);}
function whoosh(ctx,out,NZ,t,dur,v,f0,f1){const s=ctx.createBufferSource();s.buffer=NZ;s.loop=true;const f=ctx.createBiquadFilter();f.type='bandpass';f.Q.value=1.4;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);

function pop(ctx,out,t,v){const o=ctx.createOscillator();o.frequency.setValueAtTime(320,t);o.frequency.exponentialRampToValueAtTime(85,t+0.06);const g=ctx.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);o.connect(g);g.connect(out);o.start(t);o.stop(t+0.13);}
function thock(ctx,out,t,v){const o=ctx.createOscillator();o.frequency.setValueAtTime(190,t);o.frequency.exponentialRampToValueAtTime(95,t+0.03);const g=ctx.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.045);o.connect(g);g.connect(out);o.start(t);o.stop(t+0.05);}
function blip(ctx,out,t,fr,v,dur=0.09,type='sine'){const o=ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(fr,t);const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+0.002);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);o.connect(g);g.connect(out);o.start(t);o.stop(t+dur+0.01);}
function tick(ctx,out,NZ,t,v,hp=2500,dur=0.012){const s=ctx.createBufferSource();s.buffer=NZ;const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=ctx.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(f);f.connect(g);g.connect(out);s.start(t,(t*11.7)%1.5,dur+0.01);}
function uiClick(ctx,out,NZ,t,v=0.35){tick(ctx,out,NZ,t,v*0.8,1800,0.018);blip(ctx,out,t,1900,v*0.5,0.03,'triangle');tick(ctx,out,NZ,t+0.075,v*0.35,2600,0.012);}
function hit(ctx,out,rev,NZ,t,v=1){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(95,t);o.frequency.exponentialRampToValueAtTime(38,t+0.35);g.gain.setValueAtTime(0.5*v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.55);o.connect(g);g.connect(out);o.start(t);o.stop(t+0.6);

// ---------------- PASS 2: edit + sound design ----------------
