<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Jost;src:url(fonts/jost.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:"Courier Prime";src:url(fonts/courier-prime.woff2) format("woff2")}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
</style></head>
<body><div id="stage"></div>
<script src="cte.js"></script>
<script>
// the ident on its own (1080x1920): node ../cyclon/tools/render.js-style seek(t)
const stage=document.getElementById('stage');
window.DURATION=CTE.DUR+1.7;
window.seek=t=>{stage.innerHTML=CTE.ident(t,{w:1080,h:1920});};
window.SFX=CTE.cues(0);
window.ready=document.fonts.load('400 100px Jost').then(()=>document.fonts.load('40px "Courier Prime"')).then(()=>document.fonts.ready);
</script></body></html>
