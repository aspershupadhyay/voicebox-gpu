<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Serif;src:url(fonts/serif.woff2) format("woff2")}
@font-face{font-family:Serif;font-style:italic;src:url(fonts/serif-i.woff2) format("woff2")}
@font-face{font-family:Geist;src:url(fonts/geist.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Mono;src:url(fonts/mono.woff2) format("woff2");font-weight:100 900}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Geist,sans-serif;-webkit-font-smoothing:antialiased}
#cam{position:absolute;inset:0;transform-origin:540px 860px}
.a{position:absolute;box-sizing:border-box}
.c{left:0;width:1080px;text-align:center}
.serif{font-family:Serif;font-weight:400;letter-spacing:-0.01em}
.mono{font-family:Mono}
.w{display:inline-block;white-space:pre}
.pill{display:inline-flex;align-items:center;gap:14px;border-radius:999px;padding:14px 28px;font-family:Mono;font-size:28px}
#cap{position:absolute;left:0;width:1080px;top:1470px;text-align:center;font-family:Geist;font-weight:700;font-size:62px;letter-spacing:-0.01em}
#cap span.box{display:inline-block;background:rgba(14,13,12,.88);color:#fff;border-radius:22px;padding:14px 30px 18px}
svg{position:absolute;overflow:visible}
</style></head>
<body><div id="stage"><div id="cam"></div><div id="cap"></div></div>
<script src="vo.js"></script>
<script>
// ---------- palette (house launch-film look; violet accent for this one) ----------
const IV='#F1EEE7', INK='#171614', MID='#6F6A61', LINE='#DAD5CA', DK='#121110', DK2='#1C1B19', DKL='#2E2C29',
      VI='#7C6CF2', VIL='#A99EFF', VIS='#E4E0FB', LAV='#ECE9F5', GRN='#3E8E5A', PINK='#D63A78', BEZ='#1E1D22';
const BPM=120, BEAT=60/BPM;
// ---------- math ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const eo=x=>x<=0?0:x>=1?1:1-Math.pow(2,-10*x);
const eio=x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2;
const sio=x=>x<=0?0:x>=1?1:-(Math.cos(Math.PI*x)-1)/2;
const ein=x=>x<=0?0:x>=1?1:x*x*x;
const seg=(t,t0,d,e=eo)=>e(clamp((t-t0)/d));
function hash(n){let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
// ---------- voice timing ----------
const LINES={};for(const l of VO.lines)LINES[l.id]=l;
const S=id=>LINES[id].start, E=id=>LINES[id].end;
function wt(id,i){const l=LINES[id];const w=l.words[Math.min(i,l.words.length-1)];return w?w.s:l.start;}
function we(id,i){const l=LINES[id];const w=l.words[Math.min(i,l.words.length-1)];return w?w.e:l.end;}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
function wordIdx(id,word,from=0){const l=LINES[id];const k=l.words.findIndex((w,i)=>i>=from&&norm(w.w).startsWith(word));return k<0?0:k;}
const at=(id,word,from=0)=>wt(id,wordIdx(id,word,from));
// ---------- primitives ----------
function rise(t,t0,d=.34,dy=22){const p=seg(t,t0,d);return `opacity:${p.toFixed(3)};transform:translateY(${((1-p)*dy).toFixed(2)}px);filter:blur(${((1-p)*4).toFixed(2)}px)`;}
function fade(t,t0,d=.3){return `opacity:${seg(t,t0,d).toFixed(3)}`;}
function pop(t,t0,d=.32){const p=seg(t,t0,d);const s=p<=0?.6:.6+.4*p;return `opacity:${clamp(p*2).toFixed(3)};transform:scale(${s.toFixed(3)})`;}
function ws(t,words,times,style=''){return words.map((w,i)=>`<span class="w" style="${rise(t,times[i]??times[times.length-1],.3,18)};${typeof style==='function'?style(i,w):style}">${w}${i<words.length-1?' ':''}</span>`).join('');}
function spoken(t,id,words,k=0,style=''){return ws(t,words,words.map((_,i)=>wt(id,k+i)-.06),style);}
function A(x,y,css,html){return `<div class="a" style="left:${x}px;top:${y}px;${css}">${html??''}</div>`;}
function C(y,css,html){return `<div class="a c" style="top:${y}px;${css}">${html??''}</div>`;}
function label(t,t0,y,text,col=MID){return C(y,`font-family:Mono;font-size:28px;letter-spacing:.16em;color:${col};${rise(t,t0)}`,text);}
function dotgrid(col){return `<div class="a" style="inset:0;background-image:radial-gradient(${col} 1.6px,transparent 1.6px);background-size:44px 44px;background-position:22px 22px"></div>`;}
// pixel corner brackets that step on the beat (the 120 BPM pulse you can see)
function brackets(t,x,y,w,h,col,t0=-9){const k=Math.floor(t/BEAT)%2?6:0;const p=seg(t,t0,.25);const o=(1-p)*30+k;const s=18,b=6;
  const sq=(X,Y)=>`<div class="a" style="left:${X}px;top:${Y}px;width:${b}px;height:${b}px;background:${col}"></div>`;
  const corner=(cx,cy,dx,dy)=>{let h='';for(let i=0;i<3;i++){h+=sq(cx+dx*i*b,cy);h+=sq(cx,cy+dy*i*b);}return h;};
  return `<div class="a" style="left:0;top:0;opacity:${p.toFixed(3)}">${corner(x-o,y-o,1,1)}${corner(x+w+o-b,y-o,-1,1)}${corner(x-o,y+h+o-b,1,-1)}${corner(x+w+o-b,y+h+o-b,-1,-1)}</div>`;}
const ICON={
 check:'<path d="M20 6 9 17l-5-5"/>',
 mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
 tap:'<path d="M9 11V5a2 2 0 0 1 4 0v6M13 10a2 2 0 0 1 4 0v3M17 12a2 2 0 0 1 3 1.5V16a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-4.6-2.1L4.5 16a2 2 0 0 1 3-2.6L9 15"/>',
 chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
 image:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/>',
 phone:'<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/>',
 chip:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
 plug:'<path d="M9 2v6M15 2v6M6 8h12v3a6 6 0 0 1-12 0zM12 17v5"/>',
 code:'<path d="m8 6-6 6 6 6M16 6l6 6-6 6"/>',
 moon:'<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
 x:'<path d="M5 5l14 14M19 5 5 19"/>',
 send:'<path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>',
 spark:'<path d="M12 2v6M12 16v6M2 12h6M16 12h6M5 5l3 3M16 16l3 3M5 19l3-3M16 8l3-3"/>',
};
function icon(name,size,col,sw=2){return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" style="position:static;fill:none;stroke:${col};stroke-width:${sw};stroke-linecap:round;stroke-linejoin:round">${ICON[name]}</svg>`;}
// generic app tiles (no real logos)
const TILE=['#E9482B','#F2B705','#2F6FEB','#3E8E5A','#7B3FE4','#E86AA6','#14A3A3','#F07A1A','#4B5563','#0EA5E9','#84CC16','#B45309'];
const GLY=['<circle cx="12" cy="12" r="5"/>','<rect x="7" y="7" width="10" height="10" rx="2"/>','<path d="M6 16 12 6l6 10z"/>','<path d="M6 12h12M12 6v12"/>','<path d="M5 9h14M5 15h10"/>','<circle cx="9" cy="12" r="3"/><circle cx="15" cy="12" r="3"/>'];
function tile(i,size,css=''){return `<div style="width:${size}px;height:${size}px;border-radius:${size*.26}px;background:${TILE[i%TILE.length]};display:flex;align-items:center;justify-content:center;${css}"><svg viewBox="0 0 24 24" width="${size*.5}" height="${size*.5}" style="position:static;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round">${GLY[i%GLY.length]}</svg></div>`;}
// the phone, drawn at 520x1060 and scaled
function phone(cx,top,sc,screenBg,inner,css=''){
  return `<div class="a" style="left:${cx-270}px;top:${top}px;width:540px;height:1080px;transform:scale(${sc});transform-origin:270px 0;${css}">
   <div class="a" style="inset:0;border-radius:78px;background:${BEZ};box-shadow:0 40px 90px rgba(0,0,0,.28)"></div>
   <div class="a" style="left:12px;top:12px;width:516px;height:1056px;border-radius:68px;background:${screenBg};overflow:hidden">${inner}
     <div class="a" style="left:244px;top:22px;width:28px;height:28px;border-radius:50%;background:${BEZ}"></div></div></div>`;}
function status(col='#2a2833'){return A(40,80,`font-family:Geist;font-size:22px;color:${col};font-weight:600`,`1:41 PM <span style="font-weight:400;opacity:.6;margin-left:14px">Fri, Oct 23</span>`);}
function wordmark(size,col){return `<span style="font-family:Geist;font-weight:800;letter-spacing:-0.04em;font-size:${size}px;color:${col}">Cyclon</span>`;}

// ---------- scenes (each starts on its line; tr = how it enters) ----------
const SC=[];
function scene(t0,bg,draw,opt={}){SC.push({t0,bg,draw,...opt});}

// 1 · hook: the app-grid phone, on screen from frame 0
scene(0,DK,(t)=>{
  let h=dotgrid('#232220');
  h+=C(200,`${rise(t,-1)}`,`<span class="pill" style="background:${DK2};color:#cfc9f7;border:1px solid ${DKL}">Y Combinator · F26 · AI phone</span>`);
  h+=C(320,`font-size:76px;color:#fff;font-weight:700;letter-spacing:-0.03em`,ws(t,['A','YC','startup','wants'],[-1,-1,-1,wt('l01',4)-.06]));
  const rep=at('l01','replace');
  h+=C(420,`font-size:138px;line-height:1;color:#fff`,`<span class="serif">${ws(t,['to','replace','your','iPhone.'],[wt('l01',5)-.06,rep-.06,wt('l01',7)-.06,wt('l01',8)-.06],(i)=>i>=2?`font-style:italic;color:${VIL}`:'')}</span>`);
  // the phone with a grid of apps that break apart on "replace"
  let g='';
  for(let i=0;i<24;i++){const c=i%4,r=Math.floor(i/4);const x=46+c*112,y=190+r*124;
    const d=rep+.05+hash(i)*.35, p=seg(t,d,.55,ein);const ang=hash(i+3)*Math.PI*2;
    const dx=Math.cos(ang)*900*p, dy=(Math.sin(ang)*500+700*p)*p;
    g+=A(x+dx,y+dy,`opacity:${(1-p).toFixed(3)};transform:rotate(${(p*(hash(i+9)-.5)*120).toFixed(1)}deg)`,tile(i,86));}
  const scr=`${status('#e9e6f5')}${g}`;
  h+=phone(540,700,.62,'#22202b',scr,`${fade(t,-1)}`);
  h+=brackets(t,540-180,690,360,690,'#cfc9f7');
  return h;
});

// 2 · a phone you just talk to (same phone, now listening)
scene(S('l02'),LAV,(t)=>{
  const t0=S('l02');let h=dotgrid('#DCD7EA');
  h+=C(250,`font-size:84px;color:${INK};font-weight:700;letter-spacing:-0.03em`,spoken(t,'l02',['With','a','phone','you'],0));
  h+=C(360,`font-size:150px;line-height:1;color:${INK}`,`<span class="serif">${spoken(t,'l02',['just','talk','to.'],4,(i)=>`font-style:italic;color:${VI}`)}</span>`);
  const talk=at('l02','talk');
  let bars='';for(let i=0;i<23;i++){const a=(.25+.75*Math.abs(Math.sin(t*9+i*.7)*Math.sin(t*4.3+i*.31)))*(t<E('l02')+.2?1:.15);bars+=`<div style="width:10px;height:${(16+a*110).toFixed(1)}px;border-radius:5px;background:${VI}"></div>`;}
  const scr=`${status()}
    ${A(40,140,'font-size:52px;font-weight:600;color:#1c1a24;letter-spacing:-0.02em','Good afternoon.')}
    ${A(40,212,`font-size:26px;color:#8a85a0;${fade(t,t0+.1)}`,'Listening…')}
    ${A(0,640,`width:516px;display:flex;gap:8px;justify-content:center;align-items:center;height:160px;${fade(t,t0+.05,.2)}`,bars)}
    ${A(40,980,'font-size:24px;color:#8a85a0;width:436px;display:flex;justify-content:space-between',`<span>Hold power to talk</span><span>type</span>`)}`;
  h+=phone(540,700,.62,'#F4F2FA',scr);
  h+=A(720,820,`${pop(t,talk)}`,`<div style="background:${INK};color:#fff;border-radius:30px 30px 30px 6px;padding:22px 30px;font-size:34px;display:flex;gap:14px;align-items:center">${icon('mic',34,VIL)}“handle my notifications”</div>`);
  return h;
},{tr:'pix'});

// 3 · it's called Cyclon
scene(S('l03'),DK,(t)=>{
  const t0=S('l03');let h=dotgrid('#232220');
  h+=label(t,t0,560,"IT'S CALLED",'#a19b90');
  const nm=at('l03','cyclon');
  h+=C(640,`${pop(t,nm-.05,.3)}`,wordmark(230,'#fff'));
  h+=brackets(t,170,620,740,300,VIL,nm);
  const r=at('l03','rule');
  h+=C(1010,`${rise(t,at('l03','and'))};font-size:58px;color:#d8d2c7`,`and the <span class="serif" style="font-style:italic;font-size:76px;color:${VIL}">rule</span> is simple:`);
  return h;
},{tr:'zoom'});

// 4 · the rule (the founder's line)
scene(S('l04'),IV,(t)=>{
  const t0=S('l04');let h=dotgrid('#E2DED4');
  const W=LINES.l04.words.map(w=>w.w);
  const ask=wordIdx('l04','ask');
  h+=A(90,300,`width:900px;font-size:96px;line-height:1.08;color:${INK}`,`<span class="serif">${spoken(t,'l04',W,0,(i)=>i>=ask&&i<=ask+2?`font-style:italic;color:${VI}`:(i<8?'color:#A39D92':''))}</span>`);
  // tap → ask
  const d=at('l04','do'), a=wt('l04',ask);
  h+=A(150,1070,`${pop(t,d)}`,`<div style="width:220px;height:220px;border-radius:50px;background:#fff;border:1px solid ${LINE};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">${icon('tap',90,INK,1.6)}<span class="mono" style="font-size:24px;color:${MID}">tap, tap, tap</span></div>`);
  const ap=seg(t,a-.1,.4);
  h+=`<svg width="1080" height="1920" style="left:0;top:0"><path d="M400 1180 H${(400+280*ap).toFixed(1)}" stroke="${VI}" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 16"/></svg>`;
  h+=A(710,1070,`${pop(t,a)}`,`<div style="width:220px;height:220px;border-radius:50px;background:${VI};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">${icon('chat',90,'#fff',1.6)}<span class="mono" style="font-size:24px;color:#fff">just ask</span></div>`);
  h+=C(1340,`${rise(t,E('l04')-.4)};font-family:Mono;font-size:26px;color:${MID}`,'— Adam Zinebi, co-founder & CEO');
  return h;
},{tr:'up'});

// 5 · demo: the photos (three cuts on one phone)
function demo(t){
  let h=dotgrid('#DCD7EA');
  h+=C(200,`${rise(t,S('l05'))};font-family:Mono;font-size:26px;letter-spacing:.14em;color:${MID}`,'REDRAWN FROM CYCLON\'S DEMO');
  const n0=S('l05'), f=at('l06','finds'), ch=at('l06','chats'), ga=at('l06','gallery'), r=at('l06','right');
  const nine=S('l07'), tap=at('l07','tap'), sent=at('l07','sent');
  let s=`${status()}${A(40,140,'font-size:52px;font-weight:600;color:#1c1a24;letter-spacing:-0.02em','Good afternoon.')}`;
  // incoming message
  const mp=seg(t,n0+.05,.35);
  s+=A(28,250-(1-mp)*60,`width:460px;opacity:${mp.toFixed(3)};background:#fff;border-radius:26px;padding:22px 24px;box-shadow:0 8px 24px rgba(40,30,90,.08)`,
    `<div style="display:flex;align-items:center;gap:12px;font-size:22px;color:#8a85a0"><span style="width:22px;height:22px;border-radius:6px;background:#25B05A"></span>WhatsApp · Alex</div>
     <div style="font-size:28px;color:#1c1a24;margin-top:10px;line-height:1.3">Can you send me the photos from yesterday?</div>`);
  // searching
  if(t>=f-.1){const run=t<nine;
    s+=A(28,450,`${rise(t,f-.1)};display:flex;gap:12px;align-items:center;font-size:24px;color:#4a4560`,
      `<span style="display:inline-flex;gap:10px;align-items:center;background:#fff;border-radius:999px;padding:10px 18px">${run?['⠋','⠙','⠹','⠸','⠼','⠴'][Math.floor(t*16)%6]:'✓'} ${run?'Searching':'Found 9'}</span>
       <span style="background:${t>=ch?VIS:'#fff'};color:${t>=ch?VI:'#8a85a0'};border-radius:999px;padding:10px 18px;display:inline-flex;gap:8px;align-items:center">${icon('chat',22,t>=ch?VI:'#8a85a0')}Chats</span>
       <span style="background:${t>=ga?VIS:'#fff'};color:${t>=ga?VI:'#8a85a0'};border-radius:999px;padding:10px 18px;display:inline-flex;gap:8px;align-items:center">${icon('image',22,t>=ga?VI:'#8a85a0')}Gallery</span>`);
    // photo tiles: 12 found, 3 dropped on "right ones"
    let g='';for(let i=0;i<12;i++){const c=i%4,rw=Math.floor(i/4);const drop=(i===2||i===7||i===9);const dp=drop?seg(t,r+.1,.3):0;
      const fly=seg(t,sent+.05+i*.025,.35,ein);
      const hue=[18,32,200,12,350,28,190,40,8,210,24,330][i];
      g+=A(28+c*116,(t>=nine?600:540)+rw*116-fly*700,`${pop(t,ch+i*.05,.25)};opacity:${((1-dp)*(1-fly)*seg(t,ch+i*.05,.2)).toFixed(3)}`,
        `<div style="width:104px;height:104px;border-radius:18px;background:hsl(${hue} 45% ${42+hash(i)*16}%);overflow:hidden;position:relative"><div style="position:absolute;left:30px;top:22px;width:44px;height:44px;border-radius:50%;background:hsla(30,40%,85%,.85)"></div><div style="position:absolute;left:16px;top:70px;width:72px;height:60px;border-radius:30px 30px 0 0;background:hsla(${hue+180},30%,30%,.7)"></div></div>`);}
    s+=g;}
  // the ask: nine photos, one tap
  if(t>=nine-.1){
    s+=A(28,450,`${rise(t,nine-.05)};font-size:38px;font-weight:600;color:#1c1a24;background:${LAV};width:470px;padding:4px 0 16px`,`${t>=sent?'Sent to Alex.':'9 photos of Alex. Send them?'}`);
    const pressed=t>=tap&&t<tap+.18;
    s+=A(28,980-((t>=nine)?0:0),`display:flex;gap:16px;${rise(t,nine+.1)}`,
      `<div style="background:${t>=sent?GRN:'#1c1a24'};color:#fff;border-radius:999px;padding:20px 34px;font-size:28px;transform:scale(${pressed?.94:1});display:flex;gap:10px;align-items:center">${t>=sent?icon('check',28,'#fff',3)+' Sent':'Send to Alex'}</div>
       <div style="background:#E6E3EE;color:#4a4560;border-radius:999px;padding:20px 34px;font-size:28px">Not now</div>`);
    // tap ripple
    const rp=seg(t,tap,.45);if(t>=tap&&rp<1)s+=A(130-80*rp,1015-80*rp,`width:${160*rp}px;height:${160*rp}px;border-radius:50%;border:4px solid ${VI};opacity:${(1-rp).toFixed(3)}`);
  }
  h+=phone(540,280,.98,'#F4F2FA',s);
  // the count, outside the phone
  return h;
}
scene(S('l05'),LAV,demo,{tr:'pix',cap:'l05'});
scene(S('l06'),LAV,demo,{tr:'cut',punch:1.05,cap:'l06'});
scene(S('l07'),LAV,demo,{tr:'cut',punch:1.06,cap:'l07'});

// 6 · missing an app? it builds one
scene(S('l08'),DK,(t)=>{
  const t0=S('l08');let h=dotgrid('#232220');
  h+=C(250,`font-size:120px;line-height:1;color:#fff`,`<span class="serif">${spoken(t,'l08',['Missing','an','app?'],0)}</span>`);
  const b=at('l08','builds');
  let g='';const names=['Notes','Maps','Bank','Music','Mail','Rides','Food','Photos','Chat','Shop','Docs',''];
  for(let i=0;i<12;i++){const c=i%4,r=Math.floor(i/4);const x=150+c*200,y=520+r*230;
    if(i===11){const p=seg(t,b,.35);
      g+=A(x,y,'',`<div style="width:140px;height:140px;border-radius:36px;border:4px dashed ${p>0?VI:'#55524c'};display:flex;align-items:center;justify-content:center;font-size:64px;color:#77736b;position:relative">${p>0?'':'?'}${p>0?`<div class="a" style="inset:-4px;${pop(t,b,.3)}">${`<div style="width:140px;height:140px;border-radius:36px;background:${VI};display:flex;align-items:center;justify-content:center">${icon('spark',70,'#fff',2.2)}</div>`}</div>`:''}</div><div class="mono" style="text-align:center;width:140px;font-size:22px;color:${p>0?VIL:'#77736b'};margin-top:12px">${p>0?'yours':'—'}</div>`);
      continue;}
    g+=A(x,y,`${pop(t,t0+.05+i*.04,.25)}`,`${tile(i,140)}<div class="mono" style="text-align:center;width:140px;font-size:22px;color:#8f897f;margin-top:12px">${names[i]}</div>`);}
  h+=g;

// ---------- captions (1-2 words, the current word lit) ----------
function caption(t){
  const sc=SC.filter(s=>s.t0<=t).pop();if(!sc||!sc.cap)return '';
  const l=LINES[sc.cap];if(!l||t<l.start||t>l.end+.25)return '';
  const W=l.words;let k=W.findIndex(w=>t<w.e+.04);if(k<0)k=W.length-1;
  const g=Math.floor(k/2)*2;const grp=W.slice(g,g+2);
  if(t<W[0].s-.05)return '';
  return `<span class="box">${grp.map((w,i)=>`<span style="color:${g+i===k?VIL:'#fff'}">${w.w}</span>`).join(' ')}</span>`;
}

// ---------- transitions ----------
const TR=.26;
function layer(sc,t,css){return `<div class="a" style="inset:0;background:${sc.bg};${css}">${sc.draw(t)}</div>`;}
function pixwipe(t,lt,oldBg){ // blocks of the old colour clear in a scattered order
  const p=lt/TR;let h='';const N=12,M=21,s=90;
  for(let i=0;i<N;i++)for(let j=0;j<M;j++){const k=i*M+j;if(hash(k+.5)*.85+((j/M)*.15)<p)continue;h+=`<div class="a" style="left:${i*s}px;top:${j*s+(j?0:0)}px;width:${s+1}px;height:${s+1}px;background:${oldBg}"></div>`;}
  return h;}

// ---------- seek ----------
const cam=document.getElementById('cam'), cap=document.getElementById('cap'), stage=document.getElementById('stage');
window.DURATION=E('l15')+2.4;
window.seek=function(t){
  let i=0;while(i+1<SC.length&&SC[i+1].t0<=t)i++;
  const sc=SC[i], lt=t-sc.t0, t1=(SC[i+1]?.t0)??window.DURATION;
  stage.style.background=sc.bg;
  let s=1;
  if(!sc.still){s=1+(sc.punch?sc.punch-1:.03)*(1-eo(clamp(lt/.28)))+(sc.drift??.025)*clamp(lt/Math.max(1,t1-sc.t0));}
  const tr=sc.tr||'cut', prev=SC[i-1];
  let html;
  if(prev&&lt<TR&&tr!=='cut'){
    const p=eio(lt/TR);
    if(tr==='push') html=layer(prev,t,`transform:translateX(${(-1080*p).toFixed(1)}px)`)+layer(sc,t,`transform:translateX(${(1080*(1-p)).toFixed(1)}px)`);
    else if(tr==='up') html=layer(prev,t,`transform:translateY(${(-1920*p).toFixed(1)}px)`)+layer(sc,t,`transform:translateY(${(1920*(1-p)).toFixed(1)}px)`);
    else if(tr==='zoom') html=layer(sc,t,`transform:scale(${(.86+.14*p).toFixed(4)});opacity:${p.toFixed(3)}`)+layer(prev,t,`transform:scale(${(1+.5*p).toFixed(4)});opacity:${(1-p).toFixed(3)};filter:blur(${(p*10).toFixed(1)}px)`);
    else if(tr==='pix') html=layer(sc,t,'')+pixwipe(t,lt,prev.bg);
  } else html=layer(sc,t,'');
  cam.style.transform=`scale(${s.toFixed(5)})`;
  cam.innerHTML=html;
  cap.innerHTML=caption(t);
};
window.CUTS=SC.map(s=>s.t0);
window.TRANS=SC.map(s=>({t:s.t0,tr:s.tr||'cut'}));
window.ready=document.fonts.ready;
</script></body></html>
