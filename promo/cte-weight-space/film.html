<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Jost;src:url(fonts/jost.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Serif;src:url(fonts/serif.woff2) format("woff2")}

<body><div id="stage"><div id="cam"></div><div id="cap"></div></div>
<script src="vo.js"></script>
<script src="real.js"></script>
<script src="cte.js"></script>
<script>
// Catch the Error: an AI fixed another AI's brain (weight-space programming). The world: the operating notebook:
// the brand's paper and ink, an ink neural network whose edits are the logo's red dots, the real weight matrices of
// Qwen3.5-0.8B's layers 15 and 19, and Qwen's real looping output. check_colors.py must stay clean.
const PAPER='#E7E5E1', PAPER2='#D9D6D0', SHEET='#F4F1EA', INK='#1B1A18', INK2='#2A2926', INKL='#3A3936', SOFT='#57554F',
      GRAPH='#A6A49F', RED='#D8463A', REDL='#E8705F', OK='#5E7D5B', ONINK='#EDEBE6', ONINK2='#9C9A94';
// ---------- math ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const eo=x=>x<=0?0:x>=1?1:1-Math.pow(2,-10*x);
const ei=x=>x<=0?0:x>=1?1:x*x*x;
const eio=x=>x<=0?0:x>=1?1:x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{if(x<=0)return 0;if(x>=1)return 1;const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const seg=(t,t0,d,e=eo)=>e(clamp((t-t0)/d));
function hash(n){let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const fmt=n=>Math.round(n).toLocaleString('en-US');
// ---------- voice timing ----------
const LINES={};for(const l of VO.lines)LINES[l.id]=l;
const S=id=>LINES[id].start, E=id=>LINES[id].end;
function wt(id,i){const l=LINES[id];const w=l.words[Math.min(i,l.words.length-1)];return w?w.s:l.start;}
function we(id,i){const l=LINES[id];const w=l.words[Math.min(i,l.words.length-1)];return w?w.e:l.end;}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
function wordIdx(id,word,from=0){const l=LINES[id];const k=l.words.findIndex((w,i)=>i>=from&&norm(w.w).startsWith(word));return k<0?0:k;}
const at=(id,word,from=0)=>wt(id,wordIdx(id,word,from));
function venv(t){for(const l of VO.lines){if(t>=l.start&&t<l.end&&l.env){return l.env[Math.min(l.env.length-1,Math.floor((t-l.start)*30))]||0;}}return 0;}
// ---------- text motion (the house rise) ----------
function rise(t,t0,d=.34,dy=22){const p=seg(t,t0,d);return `opacity:${p.toFixed(3)};transform:translateY(${((1-p)*dy).toFixed(2)}px);filter:blur(${((1-p)*5).toFixed(2)}px)`;}
function fade(t,t0,d=.3){return `opacity:${seg(t,t0,d).toFixed(3)}`;}
function arrive(t,t0,d=.42){const p=clamp((t-t0)/d);const s=p<=0?.82:lerp(.82,1,back(p));return `opacity:${clamp(p*3).toFixed(3)};transform:scale(${s.toFixed(4)})`;}
function ws(t,words,times,style=''){return words.map((w,i)=>`<span class="w" style="${rise(t,times[i]??times[times.length-1],.3,18)};${typeof style==='function'?style(i,w):style}">${w}${i<words.length-1?' ':''}</span>`).join('');}
function spoken(t,id,words,k=0,style=''){return ws(t,words,words.map((_,i)=>wt(id,k+i)-.06),style);}
function A(x,y,css,html){return `<div class="a" style="left:${x}px;top:${y}px;${css}">${html??''}</div>`;}
function C(y,css,html){return `<div class="a c" style="top:${y}px;${css}">${html??''}</div>`;}
function grain(dark){return `<svg width="1080" height="1920" style="left:0;top:0"><filter id="g${dark?1:0}"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="${dark?9:4}"/><feColorMatrix values="0 0 0 0 ${dark?.9:.25}  0 0 0 0 ${dark?.88:.24}  0 0 0 0 ${dark?.85:.22}  0 0 0 ${dark?.035:.07} 0"/></filter><rect width="1080" height="1920" filter="url(#g${dark?1:0})"/></svg>`;}
function slug(t,dark){return A(70,150,`font-family:'Courier Prime';font-size:26px;letter-spacing:.12em;color:${dark?ONINK2:SOFT}`,`cte <span style="color:${RED}">/</span> THE AI THAT EDITS AIs`);}
function src(t,t0,text,dark=0,y=1700){return A(70,y,`${fade(t,t0,.3)};font-family:'Courier Prime';font-size:24px;letter-spacing:.04em;color:${dark?ONINK2:SOFT};width:940px`,text);}
// ---------- the red pen ----------
function wob(i,seed,amp){return amp*(Math.sin(i*.9+seed)*.6+Math.sin(i*2.3+seed*1.7)*.4);}
function penPath(pts,t,t0,d,w=7,col=RED){const p=eio(clamp((t-t0)/d));if(p<=0)return '';let L=0;for(let i=1;i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  return `<path d="M${pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L')}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${L.toFixed(0)}" stroke-dashoffset="${(L*(1-p)).toFixed(1)}"/>`;}
function penUnder(x0,x1,y,t,t0,d=.35,w=8,seed=1){const n=24,pts=[];for(let i=0;i<=n;i++){const u=i/n;pts.push([lerp(x0,x1,u),y+wob(i,seed,3)+u*6-8*u*(1-u)]);}return penPath(pts,t,t0,d,w);}
function penStrike(x0,x1,y,t,t0,d=.25,w=8){const pts=[];for(let i=0;i<=16;i++){const u=i/16;pts.push([lerp(x0,x1,u),y+wob(i,4,2.5)-u*10]);}return penPath(pts,t,t0,d,w);}
function penRing(cx,cy,rx,ry,t,t0,d=.6,w=7,turns=1.25,seed=2,col=RED){const pts=[],n=120,a0=-2.3;for(let i=0;i<=n;i++){const u=i/n,a=a0+u*Math.PI*2*turns;const r=1+.05*Math.sin(3*a+seed)+.03*Math.sin(5*a+seed*2)+.03*u;pts.push([cx+Math.cos(a)*rx*r,cy+Math.sin(a)*ry*r]);}return penPath(pts,t,t0,d,w,col);}
function penTick(x,y,s,t,t0,d=.22,w=8){return penPath([[x,y],[x+s*.35,y+s*.4],[x+s,y-s*.55]],t,t0,d,w);}
function penX(x,y,s,t,t0,w=7){return penPath([[x,y],[x+s,y+s]],t,t0,.12,w)+penPath([[x+s,y],[x,y+s]],t,t0+.1,.12,w);}
function penArrow(x0,y0,x1,y1,t,t0,d=.3,w=6,bend=24){const pts=[];for(let i=0;i<=16;i++){const u=i/16;pts.push([lerp(x0,x1,u)+Math.sin(u*Math.PI)*bend,lerp(y0,y1,u)]);}
  const ang=Math.atan2(y1-pts[14][1],x1-pts[14][0]);const h=22;const hd=[[x1-h*Math.cos(ang-.5),y1-h*Math.sin(ang-.5)],[x1,y1],[x1-h*Math.cos(ang+.5),y1-h*Math.sin(ang+.5)]];
  return penPath(pts,t,t0,d,w)+penPath(hd,t,t0+d*.9,.12,w);}
function mark(t,t0,inner,kind='ring',d=.5,col=RED,w=7,seed=3){const p=eio(clamp((t-t0)/d));
  let path='',box='left:-10%;top:-24%;width:120%;height:148%';
  if(kind==='ring'){const pts=[];for(let i=0;i<=90;i++){const u=i/90,a=-2.3+u*Math.PI*2*1.2;const r=1+.04*Math.sin(3*a+seed)+.03*u;pts.push([50+Math.cos(a)*46*r,50+Math.sin(a)*44*r]);}path='M'+pts.map(q=>q[0].toFixed(2)+' '+q[1].toFixed(2)).join(' L');}
  if(kind==='strike'){box='left:-4%;top:0;width:108%;height:100%';path='M0 58 C30 52, 60 56, 100 46';}
  if(kind==='under'){box='left:-3%;top:84%;width:106%;height:22%';path='M0 40 C30 60, 70 30, 100 55';}
  const svg=p>0?`<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;${box};overflow:visible;pointer-events:none"><path d="${path}" pathLength="1" fill="none" stroke="${col}" stroke-width="${w}" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 1" stroke-dashoffset="${(1-p).toFixed(4)}"/></svg>`:'';
  return `<span style="position:relative;display:inline-block">${inner}${svg}</span>`;}
function svgL(inner){return `<svg width="1080" height="1920" style="left:0;top:0">${inner}</svg>`;}
function note(x,y,t,t0,text,size=52,rot=-3,col=RED){return A(x,y,`${rise(t,t0,.3,10)};font-family:Caveat;font-weight:600;font-size:${size}px;color:${col};transform-origin:left;rotate:${rot}deg;white-space:nowrap`,text);}
// a real piece (screenshot), as a clipping taped to the page: slightly turned, a fold shadow, a credit under it
function clip(x,y,w,file,iw,ih,t,t0,rot=-1.2,inner='',credit='',dark=0){const h=w*ih/iw;const p=seg(t,t0,.45,back);
  return `<div class="a" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;opacity:${clamp((t-t0)/.15).toFixed(3)};transform:translateY(${((1-p)*80).toFixed(1)}px) rotate(${rot}deg);box-shadow:0 18px 0 -8px ${dark?INK2:PAPER2}">
   <img src="assets/real/${file}" style="left:0;top:0;width:${w}px;height:${h}px">${inner}
   ${credit?`<div class="ty" style="position:absolute;left:0;top:${h+22}px;font-size:22px;letter-spacing:.06em;color:${dark?ONINK2:SOFT};white-space:nowrap">${credit}</div>`:''}</div>`;}
// ---------- the network (ink, the logo's red dots for what gets edited) ----------
// layers of nodes; edges drawn once; pulses run along them so the brain is always "thinking"
function netNodes(L,N,x0,x1,y0,y1,seed=1){const cols=[];for(let i=0;i<L;i++){const n=N[i%N.length];const col=[];for(let j=0;j<n;j++){const x=lerp(x0,x1,i/(L-1))+(hash(seed+i*31+j)-.5)*14;const y=lerp(y0,y1,(j+.5)/n)+(hash(seed+i*17+j*7)-.5)*18;col.push([x,y]);}cols.push(col);}return cols;}
function network(t,o){const {nodes,red=[],ring=null,pulse=1,dark=0,edgeOp=1,r=13,show=1}=o;const ink=dark?ONINK:INK, faint=dark?'rgba(237,235,230,.22)':'rgba(27,26,24,.20)';
  let e='',p='',n='';const E=[];
  for(let i=0;i+1<nodes.length;i++)nodes[i].forEach((a,j)=>nodes[i+1].forEach((b,k)=>{if(hash(i*97+j*13+k)<.62){E.push([a,b,i,j,k]);}}));
  E.forEach(([a,b,i,j,k],q)=>{const vis=seg(show,(i/nodes.length)*.7,.3,x=>x);if(vis<=0)return;e+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${lerp(a[0],b[0],vis).toFixed(1)}" y2="${lerp(a[1],b[1],vis).toFixed(1)}" stroke="${faint}" stroke-width="2"/>`;
    if(pulse>0&&hash(q*3.1)<.33){const u=((t*.9+hash(q)*4)%1.6)/1.6;if(u<1)p+=`<circle cx="${lerp(a[0],b[0],u).toFixed(1)}" cy="${lerp(a[1],b[1],u).toFixed(1)}" r="4.2" fill="${ink}" opacity="${(pulse*.75).toFixed(2)}"/>`;}});
  nodes.forEach((col,i)=>col.forEach(([x,y],j)=>{const vis=seg(show,(i/nodes.length)*.7,.25,eo);if(vis<=0)return;const isR=red.find(q=>q[0]===i&&q[1]===j);const rr=r*(isR?1+.25*isR[2]:1)*vis;
    n+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr.toFixed(1)}" fill="${isR&&isR[2]>0?(isR[2]>=1?RED:dark?INK:PAPER):dark?INK:SHEET}" stroke="${isR&&isR[2]>0?RED:ink}" stroke-width="3.2"/>`;
    if(isR&&isR[2]>0&&isR[2]<1)n+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(rr*isR[2]).toFixed(1)}" fill="${RED}"/>`;}));
  return svgL(`<g opacity="${edgeOp}">${e}${p}</g>${n}`);}
// ---------- scenes ----------
const SC=[];
function scene(t0,bg,draw,opt={}){SC.push({t0,bg,draw,...opt});}
const R=window.REAL;
const NET1=netNodes(6,[5,7,8,8,7,5],150,930,820,1380,3);

// 1 · the hook: an ink brain already firing; on "fixed" two of its dots turn red and the pen rings them
scene(0,PAPER,(t)=>{
  let h=grain(0)+slug(t,0);
  const fx=at('l01','fixed');
  h+=C(270,`font-size:76px;line-height:1.05;font-weight:500;color:${INK};letter-spacing:-0.03em;padding:0 70px`,ws(t,['An','AI','just','opened','up'],[-1,-1,-1,-1,-1]));
  h+=C(360,`font-size:118px;line-height:1.02;font-weight:500;color:${INK};letter-spacing:-0.04em`,ws(t,['another',"AI's",'brain,'],[-1,-1,-1]));
  h+=C(500,`font-size:126px;line-height:1;color:${RED}`,`<span class="serif" style="font-style:italic">${spoken(t,'l01',['and','fixed','it.'],wordIdx('l01','and'))}</span>`);
  const rp=seg(t,fx,.35,back);
  h+=network(t,{nodes:NET1,red:[[3,3,rp],[3,4,rp]],pulse:1});
  const [ax,ay]=NET1[3][3],[bx,by]=NET1[3][4];
  h+=svgL(penRing((ax+bx)/2,(ay+by)/2,64,86,t,fx+.12,.55,7));
  h+=note(((ax+bx)/2)+70,((ay+by)/2)-140,t,fx+.5,'the fix',58,-6);
  return h;
});

// 2 · "No retraining. 0.016%": 6,250 dots, one is red
scene(S('l02'),PAPER,(t)=>{
  const t0=S('l02');let h=grain(0)+slug(t,0);
  const rt=at('l02','retraining'), ch=at('l02','changed'), pc=at('l02','percent'), wg=at('l02','weights');
  h+=C(270,`font-size:110px;font-weight:500;color:${INK};letter-spacing:-0.04em`,`${spoken(t,'l02',['No'],0)} ${mark(t,rt+.35,spoken(t,'l02',['retraining.'],1),'strike',.28,RED,9)}`);
  // the number counts down to its smallness
  const p=seg(t,ch,Math.max(.5,pc-ch+.2),eio);
  h+=C(450,`${rise(t,ch-.05)};font-size:250px;line-height:1;font-weight:500;color:${INK};letter-spacing:-0.05em`,`${lerp(100,0.016,p).toFixed(3)}<span style="font-size:110px">%</span>`);
  h+=C(720,`${rise(t,wg-.05)};font-size:60px;color:${SOFT}`,`<span class="serif" style="font-style:italic">of its weights</span>`);
  // the field: 125 x 50 dots; one of them red (1 in 6,250 = 0.016%)
  const gx=102,gy=880,sp=7;const show=seg(t,t0+.15,.5);
  h+=`<svg width="1080" height="1920" style="left:0;top:0;opacity:${show.toFixed(3)}"><defs><pattern id="dots" width="${sp}" height="${sp}" patternUnits="userSpaceOnUse"><circle cx="${sp/2}" cy="${sp/2}" r="2" fill="${INK}" opacity=".55"/></pattern></defs><rect x="${gx}" y="${gy}" width="${125*sp}" height="${50*sp}" fill="url(#dots)"/></svg>`;
  const rx=gx+83*sp+sp/2, ry=gy+31*sp+sp/2, rp=seg(t,pc,.3,back);
  h+=svgL(`<circle cx="${rx}" cy="${ry}" r="${(9*rp).toFixed(1)}" fill="${RED}"/>`+penRing(rx,ry,34,34,t,pc+.15,.45,6));
  h+=A(102,gy+50*sp+30,`${rise(t,pc+.3)};font-family:'Courier Prime';font-size:30px;color:${SOFT};letter-spacing:.04em`,`6,250 dots. <span style="color:${RED}">1</span> changed. That's 0.016%.`);
  return h;
},{tr:'cut',punch:1.05});

// 3 · "six times better at math": the real post, the pen under its claim, 7.9 -> 48.1
scene(S('l03'),PAPER,(t)=>{
  const t0=S('l03');let h=grain(0)+slug(t,0);
  const sx=at('l03','six'), mt=at('l03','math');
  const W=900,k=W/597;
  const inner=svgL(penUnder(64*k,236*k,108*k,t,sx+.05,.35,6,4)).replace('width="1080" height="1920"','width="900" height="900"');
  h+=clip(90,250,W,'tweet.jpg',597,556,t,t0-.05,-1.4,inner,'@rikiyatakehi on X · Nov 2, 2026');
  // the claim, checked: 7.9 -> 48.1 on MATH-500
  h+=A(90,1180,`${rise(t,sx)};font-size:200px;line-height:1;color:${INK}`,`<span class="serif" style="font-style:italic">6×</span>`);
  h+=A(400,1210,`${rise(t,mt-.1)};font-family:Mono;font-size:56px;color:${INK};line-height:1.25`,`7.9% <span style="color:${RED}">→</span> 48.1%<br><span style="font-family:'Courier Prime';font-size:28px;color:${SOFT};letter-spacing:.06em">MATH-500 · same settings</span>`);
  return h;
},{tr:'whip',dir:1});

// 4 · "a giant web of numbers": push into the network; its edges turn into real weights
scene(S('l04'),PAPER,(t)=>{
  const t0=S('l04');let h=grain(0)+slug(t,0);
  const wb=at('l04','web'), nm=at('l04','numbers'), wg=at('l04','weights');
  const z=1+.9*seg(t,t0,1.8,eio);
  let inner=network(t,{nodes:NET1,pulse:1});
  // numbers on edges (real values from Qwen's layer 15)
  const vals=R.grid.flat();let lab='';
  for(let q=0;q<16;q++){const i=1+(q%4),j=(q*3)%NET1[i].length,k=(q*5)%NET1[i+1].length;const a=NET1[i][j],b=NET1[i+1][k];const x=lerp(a[0],b[0],.5),y=lerp(a[1],b[1],.5);
    const v=vals[q*3%vals.length];lab+=A(x-50,y-16,`${rise(t,nm+q*.05,.25,8)};width:100px;text-align:center;font-family:Mono;font-size:21px;color:${INK};background:${PAPER};border-radius:6px`,(v>=0?'+':'')+v.toFixed(4));}
  h+=`<div class="a" style="inset:0;transform-origin:540px 1100px;transform:scale(${z.toFixed(4)})">${inner}${lab}</div>`;
  h+=C(270,`font-size:80px;line-height:1.08;font-weight:500;color:${INK};letter-spacing:-0.03em;padding:0 80px`,spoken(t,'l04',['Every','AI','is','a','giant','web','of','numbers,'],0));
  h+=C(470,`font-size:120px;line-height:1;color:${INK}`,`<span class="serif" style="font-style:italic">${mark(t,wg+.3,spoken(t,'l04',['weights.'],9),'under',.35,RED,7)}</span>`);
  return h;
},{tr:'cut',punch:1.04});

// 5 · "Qwen 3.5 has 800 million": the real matrices scroll; the counter runs
scene(S('l05'),INK,(t)=>{
  const t0=S('l05');let h=grain(1);
  const qw=at('l05','qwen'), mi=at('l05','million');
  const sc=(t-t0)*60;
  h+=`<div class="a" style="left:0;top:${(560-sc).toFixed(1)}px;width:1080px;opacity:${seg(t,t0,.3).toFixed(3)}">
    <img src="assets/real/L15.jpg" style="position:relative;width:1080px;height:309px">
    <div class="ty" style="position:relative;font-size:22px;letter-spacing:.1em;color:${ONINK2};padding:14px 70px 30px">LAYER 15 · MLP OUT · 1,024 × 3,584 WEIGHTS</div>
    <img src="assets/real/L19.jpg" style="position:relative;width:1080px;height:309px">
    <div class="ty" style="position:relative;font-size:22px;letter-spacing:.1em;color:${ONINK2};padding:14px 70px">LAYER 19 · MLP OUT · 1,024 × 3,584 WEIGHTS</div></div>`;
  h+=A(70,150,`font-family:'Courier Prime';font-size:26px;letter-spacing:.12em;color:${ONINK2}`,`REAL WEIGHTS · Qwen3.5-0.8B · Hugging Face`);
  h+=C(250,`font-size:84px;font-weight:500;color:${ONINK};letter-spacing:-0.03em`,spoken(t,'l05',['This','one,'],0)+' '+`<span style="${rise(t,qw-.06)};display:inline-block">Qwen 3.5</span>`);

// ---------- captions (1-2 words, the current word in red) ----------
function caption(t){
  const sc=SC.filter(s=>s.t0<=t).pop();if(!sc||!sc.cap)return '';
  const l=LINES[sc.cap];if(!l||t<l.start-.05||t>l.end+.2)return '';if(sc.capEnd&&t>=sc.capEnd())return '';
  const W=l.words;let k=W.findIndex(w=>t<w.e+.04);if(k<0)k=W.length-1;
  const g=Math.floor(k/2)*2;const grp=W.slice(g,g+2);
  return `<span class="box">${grp.map((w,i)=>`<span style="color:${g+i===k?REDL:'#EDEBE6'}">${w.w}</span>`).join(' ')}</span>`;
}
// ---------- transitions (0.25 s, each motivated) ----------
const TR=.25;
function layer(sc,t,css){return `<div class="a" style="inset:0;background:${sc.bg};${css}">${sc.draw(t)}</div>`;}
function penWipe(p){const a=p<.5?0:(p-.5)*2, b=p<.5?p*2:1;const y0=lerp(2200,-300,b), y1=lerp(2200,-300,a);
  return `<svg width="1080" height="1920" style="left:0;top:0"><path d="M-60 ${y0+120} C 300 ${y0-60}, 700 ${y0+80}, 1140 ${y0-120} L1140 ${y1-120} C 700 ${y1+80}, 300 ${y1-60}, -60 ${y1+120} Z" fill="${RED}"/></svg>`;}
const cam=document.getElementById('cam'), cap=document.getElementById('cap'), stage=document.getElementById('stage');

window.seek=function(t){
  let i=0;while(i+1<SC.length&&SC[i+1].t0<=t)i++;
  const sc=SC[i], lt=t-sc.t0, t1=(SC[i+1]?.t0)??window.DURATION, prev=SC[i-1];
  stage.style.background=sc.bg;
  let s=1;if(!sc.still)s=1+(sc.punch?sc.punch-1:.025)*(1-eo(clamp(lt/.3)))+.025*clamp(lt/Math.max(1,t1-sc.t0));
  const tr=sc.tr||'cut';let html;
  if(prev&&lt<TR&&tr!=='cut'){
    const p=eio(lt/TR), d=sc.dir||1;
    if(tr==='whip') html=layer(prev,t,`transform:translateY(${(-d*1920*p).toFixed(1)}px);filter:blur(${(p*14).toFixed(1)}px)`)+layer(sc,t,`transform:translateY(${(d*1920*(1-p)).toFixed(1)}px);filter:blur(${((1-p)*14).toFixed(1)}px)`);
    else if(tr==='zoom') html=layer(sc,t,`transform:scale(${(.85+.15*p).toFixed(4)});opacity:${p.toFixed(3)}`)+layer(prev,t,`transform:scale(${(1+.6*p).toFixed(4)});opacity:${(1-p).toFixed(3)};filter:blur(${(p*12).toFixed(1)}px)`);
    else if(tr==='pull') html=layer(prev,t,`transform:scale(${(1-.25*p).toFixed(4)});opacity:${(1-p).toFixed(3)}`)+layer(sc,t,`transform:scale(${(1.25-.25*p).toFixed(4)});opacity:${p.toFixed(3)}`);
    else if(tr==='pen') html=(lt/TR<.5?layer(prev,t,''):layer(sc,t,''))+penWipe(lt/TR);
    else if(tr==='fadeup') html=layer(prev,t,`opacity:${(1-p).toFixed(3)};transform:translateY(${(-40*p).toFixed(1)}px)`)+`<div class="a" style="inset:0;opacity:${p.toFixed(3)}">${layer(sc,t,'')}</div>`;
  } else html=layer(sc,t,'');
  cam.style.transform=`scale(${s.toFixed(5)})`;
  cam.innerHTML=html;
  cap.innerHTML=caption(t);
  return Promise.all([...cam.querySelectorAll('img')].map(i=>i.complete?i.decode().catch(()=>{}):new Promise(r=>{i.onload=i.onerror=r;})));
};
// ---------- sound: every cue scores something that moves ----------
function cues(){const q=[];const add=(t,f,db=0,o={})=>q.push({t:+t.toFixed(3),f,db,...o});
  // hook: the network firing (soft ticks), the red dots land, the pen rings them
  for(let i=0;i<6;i++)add(.05+i*.27,'tick',-20);

  // transitions
  SC.forEach((s,i)=>{if(!i)return;const tr=s.tr||'cut';
    if(tr==='whip')add(s.t0,'swoosh-014-383768',-8,{peak:true,at:s.t0+.12});
    else if(tr==='zoom'||tr==='pull')add(s.t0,'simple-whoosh-02-433006',-10,{peak:true,at:s.t0+.12});

    else add(s.t0,'mouse-click',-16);});

  add(at('l02','changed'),'data',-18,{len:Math.max(.5,at('l02','percent')-at('l02','changed')),fade:.2});
  add(at('l02','percent'),'sharp-pop',-6);add(at('l02','percent')+.15,'PEN',-12,{synth:'pen',len:.45});
  // 3: the clipping lands, the pen under the claim, the 6x
  add(S('l03'),'flipcard',-12);add(at('l03','six')+.05,'PEN',-10,{synth:'pen',len:.35});add(at('l03','six'),'pop-402324',-10);add(at('l03','math')-.1,'subtle-pop',-12);
  // 4: numbers appear on the edges (a run)

  // 5: the counter runs to 800 million

  // 10: the blog, MIT ringed, the numbers stream, Astra lands
  add(S('l09'),'flipcard',-12);add(at('l09','mit')+.2,'PEN',-10,{synth:'pen',len:.45});add(at('l09','raw'),'data',-18,{len:1.2,fade:.4});add(at('l09','gpt')-.1,'sharp-pop',-6);
  // 11: the ask, the strikes
  add(S('l10'),'flipcard',-12);[0,.18].forEach(d=>add(at('l10','training')+.15+d,'PEN',-9,{synth:'pen',len:.22}));add(at('l10','math')+.05,'PEN',-10,{synth:'pen',len:.45});
  // 12: the scan, the two layers, the direction
  add(at('l11','traced'),'data',-16,{len:Math.max(.6,at('l11','fifteen')-at('l11','traced')),fade:.2});
  add(at('l11','fifteen'),'sharp-pop',-6);add(at('l11','nineteen'),'sharp-pop',-6);add(at('l11','nineteen')+.2,'PEN',-8,{synth:'pen',len:.5});
  // 13: the operation: a riser into "subtracted", the hit, the columns drawn
  const sb=at('l12','subtracted');add(sb-.75,'shine-6-268910',-10,{reverse:true,len:.75});add(sb,'whoosh-end-384629',-3,{peak:true,len:2,fade:1});
  add(sb+.1,'PEN',-10,{synth:'pen',len:1.0});add(at('l12','hundred')-.05,'pop-402324',-8);add(at('l12','million')+.3,'PEN',-10,{synth:'pen',len:.22});
  // 14: the bars grow, the boxed answer, the tick
  add(at('l13','seven'),'subtle-pop',-10);add(at('l13','forty')-.2,'shine-6-268910',-12,{reverse:true,len:.5});add(at('l13','forty'),'sharp-pop',-4);add(at('l13','forty')+.35,'ui-pop-up-2',-10);add(at('l13','forty')+.75,'accept',-10);
  // 15: the clipping, the x3, the ring on 51

  // 16: the catch: silence, then the pen and one big hit
  add(at('l15','catch')+.03,'whoosh-end-384629',-2,{peak:true,len:2.2,fade:1});add(at('l15','catch')+.05,'PEN',-4,{synth:'pen',len:.6});
  // 17: Gemma flatlines
  add(at('l16','gemma'),'data',-18,{len:.9,fade:.3});add(at('l16','nothing')+.1,'PEN',-10,{synth:'pen',len:.5});add(at('l16','nothing'),'sound-off',-14,{len:.6,fade:.3});
  // 18: the ring opens; the empty slot gets an X
  add(at('l17','blocked'),'swoosh-06-351021',-12,{peak:true,at:at('l17','blocked')+.2});add(at('l17','blocked')+.4,'PEN',-10,{synth:'pen',len:.25});add(at('l17','wasnt'),'PEN',-10,{synth:'pen',len:.3});

  // 20: code lines, the fix underlined

  CTE.cues(T_ID).forEach(c=>q.push(c));
