<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Jost;src:url(fonts/jost.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Serif;src:url(fonts/serif.woff2) format("woff2")}
@font-face{font-family:Serif;font-style:italic;src:url(fonts/serif-i.woff2) format("woff2")}
@font-face{font-family:"Courier Prime";src:url(fonts/courier-prime.woff2) format("woff2")}
@font-face{font-family:Caveat;src:url(fonts/caveat.woff2) format("woff2");font-weight:400 700}
@font-face{font-family:Mono;src:url(fonts/mono.woff2) format("woff2");font-weight:100 900}
html,body{margin:0;background:#1B1A18;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Jost,sans-serif;-webkit-font-smoothing:antialiased}
#cam{position:absolute;inset:0;transform-origin:540px 900px}
.a{position:absolute;box-sizing:border-box}
.c{left:0;width:1080px;text-align:center}
.serif{font-family:Serif;font-weight:400;letter-spacing:-0.01em}
.ty{font-family:"Courier Prime"}
.mono{font-family:Mono;font-variant-numeric:tabular-nums}
.w{display:inline-block;white-space:pre}
#cap{position:absolute;left:0;width:1080px;top:1490px;text-align:center;font-family:Jost;font-weight:500;font-size:58px;letter-spacing:-0.01em}
#cap span.box{display:inline-block;background:rgba(27,26,24,.92);color:#EDEBE6;border-radius:18px;padding:12px 30px 16px}
svg{position:absolute;overflow:visible}
img{position:absolute;display:block}
</style></head>
<body><div id="stage"><div id="cam"></div><div id="cap"></div></div>
<script src="vo.js"></script>
<script src="cte.js"></script>
<script>
// Catch the Error: GDPx, the AI exam where the best model scores 12%.
// The world: the exam paper (the Cyclon house look: paper, ink, and the red pen, which grades). Real media: SemiAnalysis's post and leaderboard.
const PAPER='#E7E5E1', PAPER2='#D9D6D0', SHEET='#F4F1EA', INK='#1B1A18', INK2='#2A2926', INKL='#3A3936', SOFT='#57554F',
      GRAPH='#A6A49F', RED='#D8463A', REDL='#E8705F', OK='#5E7D5B', ONINK='#EDEBE6', ONINK2='#9C9A94';
// ---------- math ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const eo=x=>x<=0?0:x>=1?1:1-Math.pow(2,-10*x);
const ei=x=>x<=0?0:x>=1?1:x*x*x;
const eio=x=>x<=0?0:x>=1?1:x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{if(x<=0)return 0;if(x>=1)return 1;const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const seg=(t,t0,d,e=eo)=>e(clamp((t-t0)/d));
function hash(n){let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const fmt=n=>Math.round(n).toLocaleString('en-US');
// ---------- voice timing ----------
const LINES={};for(const l of VO.lines)LINES[l.id]=l;
// a line can be missing in a shorter cut (tools/script.json of the cut): its time is NaN and its scene and cues drop out
const S=id=>LINES[id]?LINES[id].start:NaN, E=id=>LINES[id]?LINES[id].end:NaN;
function wt(id,i){const l=LINES[id];if(!l)return NaN;const w=l.words[Math.min(i,l.words.length-1)];return w?w.s:l.start;}
function we(id,i){const l=LINES[id];if(!l)return NaN;const w=l.words[Math.min(i,l.words.length-1)];return w?w.e:l.end;}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
function wordIdx(id,word,from=0){const l=LINES[id];if(!l)return 0;const k=l.words.findIndex((w,i)=>i>=from&&norm(w.w).startsWith(word));return k<0?0:k;}
const at=(id,word,from=0)=>wt(id,wordIdx(id,word,from));
function venv(t){for(const l of VO.lines){if(t>=l.start&&t<l.end&&l.env){return l.env[Math.min(l.env.length-1,Math.floor((t-l.start)*30))]||0;}}return 0;}
// ---------- text motion (the house rise) ----------
function rise(t,t0,d=.34,dy=22){const p=seg(t,t0,d);return `opacity:${p.toFixed(3)};transform:translateY(${((1-p)*dy).toFixed(2)}px);filter:blur(${((1-p)*5).toFixed(2)}px)`;}
function fade(t,t0,d=.3){return `opacity:${seg(t,t0,d).toFixed(3)}`;}
function arrive(t,t0,d=.42){const p=clamp((t-t0)/d);const s=p<=0?.82:lerp(.82,1,back(p));return `opacity:${clamp(p*3).toFixed(3)};transform:scale(${s.toFixed(4)})`;}
function ws(t,words,times,style=''){return words.map((w,i)=>`<span class="w" style="${rise(t,times[i]??times[times.length-1],.3,18)};${typeof style==='function'?style(i,w):style}">${w}${i<words.length-1?' ':''}</span>`).join('');}
function spoken(t,id,words,k=0,style=''){return ws(t,words,words.map((_,i)=>wt(id,k+i)-.06),style);}
function A(x,y,css,html){return `<div class="a" style="left:${x}px;top:${y}px;${css}">${html??''}</div>`;}
function C(y,css,html){return `<div class="a c" style="top:${y}px;${css}">${html??''}</div>`;}
function grain(dark){return `<svg width="1080" height="1920" style="left:0;top:0"><filter id="g${dark?1:0}"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="${dark?9:4}"/><feColorMatrix values="0 0 0 0 ${dark?.9:.25}  0 0 0 0 ${dark?.88:.24}  0 0 0 0 ${dark?.85:.22}  0 0 0 ${dark?.035:.07} 0"/></filter><rect width="1080" height="1920" filter="url(#g${dark?1:0})"/></svg>`;}
function slug(t,dark){return A(70,150,`font-family:'Courier Prime';font-size:26px;letter-spacing:.12em;color:${dark?ONINK2:SOFT}`,`cte <span style="color:${RED}">/</span> THE HARDEST AI EXAM`);}
function src(t,t0,text,dark=0,y=1700){return A(70,y,`${fade(t,t0,.3)};font-family:'Courier Prime';font-size:24px;letter-spacing:.04em;color:${dark?ONINK2:SOFT};width:940px`,text);}
// ---------- the red pen ----------
function wob(i,seed,amp){return amp*(Math.sin(i*.9+seed)*.6+Math.sin(i*2.3+seed*1.7)*.4);}
function penPath(pts,t,t0,d,w=7,col=RED){const p=eio(clamp((t-t0)/d));if(p<=0)return '';let L=0;for(let i=1;i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  return `<path d="M${pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L')}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${L.toFixed(0)}" stroke-dashoffset="${(L*(1-p)).toFixed(1)}"/>`;}
function penUnder(x0,x1,y,t,t0,d=.35,w=8,seed=1){const n=24,pts=[];for(let i=0;i<=n;i++){const u=i/n;pts.push([lerp(x0,x1,u),y+wob(i,seed,3)+u*6-8*u*(1-u)]);}return penPath(pts,t,t0,d,w);}
function penStrike(x0,x1,y,t,t0,d=.25,w=8){const pts=[];for(let i=0;i<=16;i++){const u=i/16;pts.push([lerp(x0,x1,u),y+wob(i,4,2.5)-u*10]);}return penPath(pts,t,t0,d,w);}
function penRing(cx,cy,rx,ry,t,t0,d=.6,w=7,turns=1.25,seed=2,col=RED){const pts=[],n=120,a0=-2.3;for(let i=0;i<=n;i++){const u=i/n,a=a0+u*Math.PI*2*turns;const r=1+.05*Math.sin(3*a+seed)+.03*Math.sin(5*a+seed*2)+.03*u;pts.push([cx+Math.cos(a)*rx*r,cy+Math.sin(a)*ry*r]);}return penPath(pts,t,t0,d,w,col);}
function penTick(x,y,s,t,t0,d=.22,w=8){return penPath([[x,y],[x+s*.35,y+s*.4],[x+s,y-s*.55]],t,t0,d,w);}
function penX(x,y,s,t,t0,w=7){return penPath([[x,y],[x+s,y+s]],t,t0,.12,w)+penPath([[x+s,y],[x,y+s]],t,t0+.1,.12,w);}
function penArrow(x0,y0,x1,y1,t,t0,d=.3,w=6,bend=24){const pts=[];for(let i=0;i<=16;i++){const u=i/16;pts.push([lerp(x0,x1,u)+Math.sin(u*Math.PI)*bend,lerp(y0,y1,u)]);}
  const ang=Math.atan2(y1-pts[14][1],x1-pts[14][0]);const h=22;const hd=[[x1-h*Math.cos(ang-.5),y1-h*Math.sin(ang-.5)],[x1,y1],[x1-h*Math.cos(ang+.5),y1-h*Math.sin(ang+.5)]];
  return penPath(pts,t,t0,d,w)+penPath(hd,t,t0+d*.9,.12,w);}
function mark(t,t0,inner,kind='ring',d=.5,col=RED,w=7,seed=3){const p=eio(clamp((t-t0)/d));
  let path='',box='left:-10%;top:-24%;width:120%;height:148%';
  if(kind==='ring'){const pts=[];for(let i=0;i<=90;i++){const u=i/90,a=-2.3+u*Math.PI*2*1.2;const r=1+.04*Math.sin(3*a+seed)+.03*u;pts.push([50+Math.cos(a)*46*r,50+Math.sin(a)*44*r]);}path='M'+pts.map(q=>q[0].toFixed(2)+' '+q[1].toFixed(2)).join(' L');}
  if(kind==='strike'){box='left:-4%;top:0;width:108%;height:100%';path='M0 58 C30 52, 60 56, 100 46';}
  if(kind==='under'){box='left:-3%;top:84%;width:106%;height:22%';path='M0 40 C30 60, 70 30, 100 55';}
  const svg=p>0?`<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;${box};overflow:visible;pointer-events:none"><path d="${path}" pathLength="1" fill="none" stroke="${col}" stroke-width="${w}" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 1" stroke-dashoffset="${(1-p).toFixed(4)}"/></svg>`:'';
  return `<span style="position:relative;display:inline-block">${inner}${svg}</span>`;}
function svgL(inner){return `<svg width="1080" height="1920" style="left:0;top:0">${inner}</svg>`;}
function note(x,y,t,t0,text,size=52,rot=-3,col=RED){return A(x,y,`${rise(t,t0,.3,10)};font-family:Caveat;font-weight:600;font-size:${size}px;color:${col};transform-origin:left;rotate:${rot}deg;white-space:nowrap`,text);}
// a real piece (screenshot), as a clipping taped to the page: slightly turned, a fold shadow, a credit under it
function clip(x,y,w,file,iw,ih,t,t0,rot=-1.2,inner='',credit='',dark=0){const h=w*ih/iw;const p=seg(t,t0,.45,back);
  return `<div class="a" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;opacity:${clamp((t-t0)/.15).toFixed(3)};transform:translateY(${((1-p)*80).toFixed(1)}px) rotate(${rot}deg);box-shadow:0 18px 0 -8px ${dark?INK2:PAPER2}">
   <img src="assets/real/${file}" style="left:0;top:0;width:${w}px;height:${h}px">${inner}
   ${credit?`<div class="ty" style="position:absolute;left:0;top:${h+22}px;font-size:22px;letter-spacing:.06em;color:${dark?ONINK2:SOFT};white-space:nowrap">${credit}</div>`:''}</div>`;}
// ---------- the exam world ----------
const KRAFT='#CFC0A0', KRAFT2='#B9A988';
// the top caption (what the reference does well: the line is always on screen, a few words at a time): the phrase
// group being spoken rises word by word on its spoken times; emphasised words are the serif italic in red
function topcap(t,id,groups,o={}){const l=LINES[id];if(!l)return '';const {y=250,size=78,emph=[],col=INK,ecol=RED,lh=1.08,w=940}=o;
  let g=0;groups.forEach(([a],i)=>{if(t>=wt(id,a)-.12)g=i;});const [a,b]=groups[g];
  const words=l.words.slice(a,b+1).map((x,i)=>{const k=a+i;const e=emph.includes(k);return `<span class="w${e?' serif':''}" style="${rise(t,wt(id,k)-.06,.3,18)};${e?`font-style:italic;color:${ecol};font-size:1.12em`:''}">${x.w}${k<b?' ':''}</span>`;}).join('');
  return A((1080-w)/2,y,`width:${w}px;text-align:center;font-size:${size}px;line-height:${lh};font-weight:500;color:${col};letter-spacing:-0.03em`,words);}
// a real screenshot as a card: rounded corners and a soft shadow; the view zooms and pans inside it (the image point
// cx,cy sits at the card's centre at z screen px per image px); marks are SVG in the image's own pixels
function shot(o){const {x,y,w,h,file,iw,ih,cx=iw/2,cy=ih/2,z=w/iw,op=1,rp=1,marks='',r=34,filt='',credit='',cred0=0,t=0}=o;
  const ix=w/2-cx*z, iy=h/2-cy*z;
  return `<div class="a" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${r}px;overflow:hidden;opacity:${op.toFixed(3)};transform:translateY(${((1-rp)*110).toFixed(1)}px) scale(${lerp(.92,1,rp).toFixed(4)});box-shadow:0 44px 70px -34px rgba(27,26,24,.6),0 0 0 2px rgba(27,26,24,.12);background:#101113">
    <div style="position:absolute;left:${ix.toFixed(1)}px;top:${iy.toFixed(1)}px;width:${iw}px;height:${ih}px;transform-origin:0 0;transform:scale(${z.toFixed(4)})">
    <img src="assets/real/${file}" style="left:0;top:0;width:${iw}px;height:${ih}px;${filt}"><svg width="${iw}" height="${ih}" style="left:0;top:0">${marks}</svg></div></div>`+
    (credit?A(x,y+h+22,`${fade(t,cred0,.3)};font-family:'Courier Prime';font-size:24px;letter-spacing:.05em;color:${SOFT}`,credit):'');}
// the exam paper: a header, eight questions, the red pen marks them, the grade written in the corner
function sheet(t,o={}){const {x=150,y=520,w=780,h=1010,rot=-2,x0=Infinity,grade=Infinity,ring=Infinity,dim=0}=o;
  let s=`<div class="a" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${SHEET};rotate:${rot}deg;border-radius:8px;box-shadow:0 34px 60px -30px rgba(27,26,24,.5),0 0 0 1.5px rgba(27,26,24,.10)">`;
  s+=`<div class="ty" style="position:absolute;left:50px;top:44px;font-size:28px;letter-spacing:.06em;color:${INK}">GDPx v1.0 · FINAL EXAM</div>`;
  s+=`<div class="ty" style="position:absolute;left:50px;top:92px;font-size:22px;letter-spacing:.04em;color:${SOFT}">CANDIDATE: <span style="color:${INK}">Claude Opus 5.5</span></div>`;
  s+=`<div class="ty" style="position:absolute;left:50px;top:128px;font-size:20px;letter-spacing:.06em;color:${SOFT}">206 TASKS · 11 FIELDS · 8 HRS</div>`;
  s+=`<div style="position:absolute;left:50px;right:50px;top:178px;height:2px;background:${INK}"></div>`;
  const marks=[];
  for(let i=0;i<8;i++){const qy=230+i*94;
    s+=`<div class="ty" style="position:absolute;left:50px;top:${qy}px;font-size:26px;color:${INK}">Q${i+1}.</div>`;
    const w1=300+hash(i*3+1)*260, w2=180+hash(i*7+2)*300;
    s+=`<div style="position:absolute;left:130px;top:${qy+12}px;width:${w1}px;height:9px;border-radius:5px;background:${GRAPH};opacity:.7"></div><div style="position:absolute;left:130px;top:${qy+44}px;width:${w2}px;height:9px;border-radius:5px;background:${GRAPH};opacity:.45"></div>`;
    marks.push(i===4?penTick(w-110,qy+40,44,t,x0+i*.07,.14,7):penX(w-112,qy+6,38,t,x0+i*.07,7));}
  // the grade: 12% written by hand, then ringed
  const gp=seg(t,grade,.42,x=>x);
  s+=`<div style="position:absolute;left:${w-262}px;top:34px;width:240px;text-align:center;font-family:Caveat;font-weight:700;font-size:128px;line-height:1.05;color:${RED};clip-path:inset(0 ${((1-gp)*100).toFixed(1)}% 0 0);rotate:-6deg">12%</div>`;
  s+=`<svg width="${w}" height="${h}" style="left:0;top:0">${marks.join('')}${penRing(w-142,108,122,70,t,ring,.5,7,1.2,4)}</svg>`;
  if(dim)s+=`<div style="position:absolute;inset:0;background:${PAPER};opacity:${dim}"></div>`;
  return s+'</div>';}
const DOM=[['RSI',10],['CHIPS',34],['CYBER',18],['BIO',13],['FIN',24],['LAW',20],['QUANT',10],['HW',21],['MAT',23],['ALIGN',18],['SWE',15]];
// the 206 tasks as cells, one column per field (the real counts from gdpx.semianalysis.com/domains)
function taskGrid(t,o){const {fill=1,labels=Infinity,lit=-1,dimOthers=0,base=1230}=o;let s='',k=0;const total=206,shown=Math.floor(fill*total+1e-6);
  DOM.forEach(([name,n],c)=>{const cx=540+(c-5)*86;const isLit=c===lit;const op=lit>=0&&!isLit?(1-.7*dimOthers):1;
    for(let i=0;i<n;i++){const row=Math.floor(i/2), col=i%2;const on=k<shown;k++;if(!on)continue;
      s+=`<rect x="${cx-29+col*30}" y="${base-28-row*30}" width="26" height="26" rx="4" fill="${isLit?RED:INK}" opacity="${op}"/>`;}
    s+=`<text x="${cx}" y="${base+40}" text-anchor="middle" font-family="Courier Prime" font-size="21" letter-spacing="1" fill="${isLit?RED:SOFT}" opacity="${seg(t,labels+c*.05,.25).toFixed(3)}">${name}</text>`;
    s+=`<text x="${cx}" y="${base-28-Math.ceil(n/2)*30-4}" text-anchor="middle" font-family="Mono" font-size="22" font-weight="600" fill="${isLit?RED:INK}" opacity="${(seg(t,labels+c*.05,.25)*op).toFixed(3)}">${n}</text>`;});
  return svgL(s);}
function credit(t,t0,text,dark=0,y=1700){return src(t,t0,text,dark,y);}
// ---------- scenes ----------
const SC=[];
function scene(t0,bg,draw,opt={}){if(isFinite(t0))SC.push({t0,bg,draw,...opt});}

// 1 · the hook: the exam is already on the desk; the pen marks it wrong, wrong, wrong… and writes the grade: 12%
scene(0,PAPER,(t)=>{
  let h=grain(0)+slug(t,0);
  const sc=at('l01','scored'), tw=at('l01','twelve'), pc=at('l01','percent');
  h+=C(232,`font-size:84px;line-height:1.04;font-weight:500;color:${INK};letter-spacing:-0.035em`,`The <span class="serif" style="font-style:italic;font-size:1.12em">best</span> AI in the world`);
  h+=C(330,`font-size:84px;line-height:1.04;font-weight:500;color:${INK};letter-spacing:-0.035em`,`just took a new exam.`);
  const z=1+.16*seg(t,tw-.1,.6,eio), dy=(1-seg(t,-.35,.75,eo))*260;
  h+=`<div class="a" style="inset:0;transform-origin:780px 640px;transform:translateY(${dy.toFixed(1)}px) scale(${z.toFixed(4)})">${sheet(t,{x0:sc-.05,grade:tw-.02,ring:pc+.05})}</div>`;
  return h;
});

// 2 · "And that's the top score.": the real post, the pen under its own words
scene(S('l02'),PAPER,(t)=>{
  const t0=S('l02');let h=grain(0)+slug(t,0);
  const tp=at('l02','top'), sc=at('l02','score');
  h+=topcap(t,'l02',[[0,4]],{size:90,emph:[3,4]});
  const z=860/595;
  const marks=penUnder(338,578,155,t,tp,.35,3.5,3)+penRing(30,165,30,19,t,sc+.05,.45,3.5,1.25,6);
  h+=shot({t,x:110,y:430,w:860,h:780*z,file:'tweet.png',iw:595,ih:780,rp:seg(t,t0-.08,.45,back),marks,credit:'@SemiAnalysis_ on X · Nov 2, 2026',cred0:t0+.3});
  return h;
},{tr:'whip',dir:1});

// 3 · the leaderboard: pan to Gemini, to the price column, back to GPT-6 Astra
scene(S('l03'),PAPER,(t)=>{
  const t0=S('l03');let h=grain(0)+slug(t,0);
  const gm=at('l03','gemini'), pr=at('l03','price'), as=at('l03','astra');
  h+=topcap(t,'l03',[[0,4],[5,10],[11,13]],{size:76,emph:[2,10,13]});
  // the camera inside the screenshot: whole board → names → prices → names
  const p1=seg(t,gm-.25,.5,eio), p2=seg(t,pr-.45,.5,eio), p3=seg(t,as-.3,.45,eio);
  let cx=lerp(1060,660,p1), cy=lerp(1018,520,p1), z=lerp(.453,.98,p1);
  cx=lerp(cx,1480,p2); cx=lerp(cx,660,p3); cy=lerp(cy,560,p3);
  const marks=penUnder(190,470,528,t,gm+.1,.35,5,2)+penRing(1745,495,105,46,t,pr-.05,.45,5,1.2,3)+penRing(1745,375,105,46,t,pr+.35,.4,4,1.1,7,GRAPH)+penUnder(190,420,648,t,as+.05,.3,5,5);
  h+=shot({t,x:60,y:470,w:960,h:940,file:'leaderboard.jpg',iw:2120,ih:2036,cx,cy,z,rp:seg(t,t0-.05,.4,back),marks,filt:'filter:saturate(.55)'});
  h+=A(60,1440,`${rise(t,pr+.1)};font-family:Mono;font-size:38px;color:${INK};width:960px;text-align:center`,`per task: Opus <span style="color:${SOFT}">$51.41</span> · Gemini <span style="color:${RED}">$16.29</span>`);
  h+=credit(t,t0+.3,'gdpx.semianalysis.com · leaderboard, Nov 2, 2026',0,1520);
  return h;
},{tr:'cut',punch:1.05});

// 4 · the name: GDPx, from SemiAnalysis
scene(S('l04'),PAPER,(t)=>{
  const t0=S('l04');let h=grain(0)+slug(t,0);
