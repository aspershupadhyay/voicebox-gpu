# Every 10 min: stop a GPU the app started whose worker died (no heartbeat for 20 min), so a crashed Colab kernel
# doesn't bill until Google reclaims the VM. The logic lives in mcp/lib/colab.ts (sweep); this only knocks.
# No setup: the run proves itself with GitHub's OIDC token (mcp/lib/cronauth.ts), so no secret is copied into GitHub. (Vercel cron would do, but Hobby allows only daily.)
name: Sweep dead GPUs
on:
  schedule: [{ cron: "*/10 * * * *" }]
  workflow_dispatch:
concurrency: { group: sweep, cancel-in-progress: true }
permissions:
  id-token: write # GitHub's OIDC token proves the knock comes from this workflow (mcp/lib/cronauth.ts)
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Sweep
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=voicebox-cron" | jq -r .value)
          code=$(curl -s -o out.json -w '%{http_code}' -m 60 -X POST -H "Authorization: Bearer $token" \
            https://voiceboxstudio.vercel.app/api/cron/sweep)
          echo "$code $(cat out.json)"
          [ "$code" = 200 ]
      - name: Nightly backup
        # once a day after 02:00 UTC (mcp/lib/backup.ts); the other knocks read one small file and stop
        if: always()
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=voicebox-cron" | jq -r .value)
          code=$(curl -s -o out.json -w '%{http_code}' -m 290 -X POST -H "Authorization: Bearer $token" \
            https://voiceboxstudio.vercel.app/api/cron/backup)
          echo "$code $(cat out.json)"
          [ "$code" = 200 ]
