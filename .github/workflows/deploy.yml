# Deploys the dashboard + MCP server (mcp/) to Cloudflare Workers on every push that touches it, with the current
# worker bundle (docs/MIGRATION.md step 3: the app moved off Vercel on 2026-10-30).
# One-time setup: repo Settings → Secrets and variables → Actions → New repository secret CLOUDFLARE_API_TOKEN
# (Cloudflare dashboard → My Profile → API Tokens → Create Token → "Edit Cloudflare Workers" template).
# Settings and keys live on the Worker (wrangler secret); this only ships code.
name: Deploy
on:
  push:
    branches: [main]
    paths: [mcp/**, worker/**, docs/**, CLAUDE.md, notebook/build_notebook.py, scripts/build_playbook.py, .github/workflows/deploy.yml]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 057fb7340dca399cea8eaf0071aa5760
      SITE: https://voiceboxstudio.pages.dev # the short address: a Pages front door that hands requests to the Worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: mcp/package-lock.json }
      - name: Check the token
        run: '[ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (see the top of this file)"; exit 1; }'
      - name: Worker bundle (what Colab pulls from /api/bundle)
        run: python3 notebook/build_notebook.py
      - name: Playbook (the docs the playbook MCP tool serves)
        run: python3 scripts/build_playbook.py
      - name: Build for Workers
        working-directory: mcp
        env: { NEXT_PUBLIC_FILES_BACKEND: r2 }
        run: npm ci && npx opennextjs-cloudflare build
      - name: Deploy
        working-directory: mcp
        run: npx wrangler deploy
      - name: Smoke test
        run: |
          sleep 5
          a=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/login"); b=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/api/register")
          echo "$SITE: /login $a, /api/register $b"
          [ "$a" = 200 ] && [ "$b" = 405 ]
